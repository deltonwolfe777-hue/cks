  var COLS = 24, ROWS = 16, TILE = 32;
  var T = { GRASS:0, PATH:1, WATER:2, ROCK:3, SAND:4, TREE:5, WALL:6 };
  var KEY = ['t_grass','t_path','t_water','t_rock','t_sand','t_tree','t_wall'];
  var BLOCKING = {};
  [T.TREE, T.WALL, T.ROCK, T.WATER].forEach(function(t){ BLOCKING[t] = true; });

  function buildMap() {
    var grid = [];
    for (var y = 0; y < ROWS; y++) {
      var row = [];
      for (var x = 0; x < COLS; x++) {
        var t = T.GRASS;
        if (x === 0 || y === 0 || x === COLS-1 || y === ROWS-1) t = T.WALL;
        else if ((x === 5 || x === 6) && y > 2 && y < ROWS-3) t = T.TREE;
        else if (y === 8 && x > 3 && x < COLS-3) t = T.PATH;
        else if (x === 12 && y > 1 && y < ROWS-2) t = T.PATH;
        else if ((x-12)*(x-12) + (y-8)*(y-8) < 4) t = T.WATER;
        else if (x === 18 && y === 4) t = T.ROCK;
        else if (x > 19 && y > 10) t = T.SAND;
        row.push(t);
      }
      grid.push(row);
    }
    return grid;
  }

  var SAVE_KEY = 'spirirealm_phaser_spike_v1';

  function SpikeScene() { Phaser.Scene.call(this, { key: 'spike' }); }
  SpikeScene.prototype = Object.create(Phaser.Scene.prototype);
  SpikeScene.prototype.constructor = SpikeScene;

  SpikeScene.prototype.preload = function() {
    var self = this;
    function mk(key, color, edge) {
      var g = self.add.graphics();
      g.fillStyle(color, 1); g.fillRect(0, 0, TILE, TILE);
      if (edge !== undefined) { g.fillStyle(edge, 1); g.fillRect(0, TILE-4, TILE, 4); }
      g.generateTexture(key, TILE, TILE); g.destroy();
    }
    mk('t_grass', 0x6abe5a, 0x4f9e44);
    mk('t_path',  0xd9c08a, 0xc2a86e);
    mk('t_water', 0x4aa3df, 0x3a86c0);
    mk('t_rock',  0x9a8f80, 0x7d7263);
    mk('t_sand',  0xe8d8a0, 0xd8c888);
    mk('t_tree',  0x3f7d3a, 0x2f5e2c);
    mk('t_wall',  0x6b5b73, 0x4f4256);

    this._spiritKeys = Object.keys(SPRITES);
    this._spiritKeys.forEach(function(k){ self.load.image('sp_' + k, SPRITES[k]); });
  };

  SpikeScene.prototype.create = function() {
    this.grid = buildMap();
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      this.add.image(x*TILE + TILE/2, y*TILE + TILE/2, KEY[this.grid[y][x]]);
    }

    var sx = 2, sy = 2;
    try {
      var s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (s && Number.isInteger(s.x)) { sx = s.x; sy = s.y; }
    } catch (e) {}

    var pg = this.add.graphics();
    pg.fillStyle(0xffffff, 1); pg.fillCircle(11, 11, 10);
    pg.fillStyle(0x222222, 1); pg.fillCircle(11, 11, 4);
    pg.generateTexture('player', 22, 22); pg.destroy();
    this.player = this.add.image(sx*TILE + TILE/2, sy*TILE + TILE/2, 'player').setDepth(10);

    // 显示一只真实立绘，验证 data-URI 纹理渲染
    var sk = this._spiritKeys[0];
    this.add.image(sx*TILE + TILE/2, (sy+2)*TILE + TILE/2, 'sp_' + sk)
      .setDepth(9).setDisplaySize(28, 28);

    this.cameras.main.setBounds(0, 0, COLS*TILE, ROWS*TILE);
    this.cameras.main.startFollow(this.player, true, 0.15, 0.15);
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
    this.moving = false;
    this.hud = document.getElementById('hud');
    this.showHud(sx, sy, false);
  };

  SpikeScene.prototype.blocked = function(x, y) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return true;
    return !!BLOCKING[this.grid[y][x]];
  };
  SpikeScene.prototype.gridX = function() { return Math.round(this.player.x/TILE - 0.5); };
  SpikeScene.prototype.gridY = function() { return Math.round(this.player.y/TILE - 0.5); };

  SpikeScene.prototype.tryStep = function(dx, dy) {
    if (this.moving) return;
    var nx = this.gridX() + dx, ny = this.gridY() + dy;
    var self = this;
    if (this.blocked(nx, ny)) { this.nudge(dx, dy); return; }
    this.moving = true;
    this.tweens.add({
      targets: this.player, x: nx*TILE + TILE/2, y: ny*TILE + TILE/2, duration: 140,
      onComplete: function(){ self.moving = false; self.save(nx, ny); }
    });
  };
  SpikeScene.prototype.nudge = function(dx, dy) {
    this.tweens.add({ targets: this.player,
      x: this.player.x + dx*3, y: this.player.y + dy*3, duration: 60, yoyo: true });
  };
  SpikeScene.prototype.save = function(gx, gy) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ x: gx, y: gy })); } catch (e) {}
    this.showHud(gx, gy, true);
  };
  SpikeScene.prototype.showHud = function(gx, gy, saved) {
    this.hud.innerHTML =
      'Phaser ' + Phaser.VERSION + ' · 场景 ' + COLS + '×' + ROWS + '<br>' +
      '精灵数据: 40 种 / 立绘 120 张（本页内联 ' + Object.keys(SPRITES).length + ' 张验证）<br>' +
      '位置 (' + gx + ', ' + gy + ')' + (saved ? ' · 已存档 ✓' : '');
  };
  SpikeScene.prototype.update = function() {
    if (this.moving) return;
    var c = this.cursors, k = this.keys;
    if (c.left.isDown  || k.A.isDown)  this.tryStep(-1, 0);
    else if (c.right.isDown || k.D.isDown) this.tryStep(1, 0);
    else if (c.up.isDown    || k.W.isDown) this.tryStep(0, -1);
    else if (c.down.isDown  || k.S.isDown) this.tryStep(0, 1);
  };

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#101018',
    pixelArt: true,
    scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
    scene: [SpikeScene]
  });
})();
</script>
</body>
</html>
