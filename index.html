<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵契大陆 · SpiriRealm — 探索 · 遇敌 · 捕捉 · 对战 · 进化</title>
<style>
  :root{
    --bg-0:#0b1026; --bg-1:#141a3a; --bg-2:#1d2752;
    --card:rgba(255,255,255,.06); --card-border:rgba(255,255,255,.12);
    --txt:#eef2ff; --txt-dim:#9aa6d6; --accent:#7c5cff; --accent-2:#22d3ee;
    --gold:#ffd166; --good:#34d399; --bad:#fb7185;
    --r:16px;
    --type-fire:#ff6b35; --type-water:#4d96ff; --type-grass:#5fd068;
    --type-electric:#ffd93d; --type-light:#ffe27a; --type-dark:#9b6dff;
    --type-rock:#c08552; --type-ice:#7fd8e8; --type-wind:#76e0a8; --type-psychic:#ff8fd0;
    --type-dragon:#6b5cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--txt); background:
      radial-gradient(1200px 700px at 80% -10%, #2a1d5e 0%, transparent 60%),
      radial-gradient(1000px 600px at 0% 10%, #0e3a4d 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 45%,var(--bg-2));
    background-attachment:fixed; min-height:100vh; overflow-x:hidden;
  }
  button{font-family:inherit}
  .ty{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#0b1026;white-space:nowrap}

  /* ===== TOP BAR ===== */
  header.top{position:sticky;top:0;z-index:80;backdrop-filter:blur(14px);
    background:rgba(8,11,30,.72);border-bottom:1px solid var(--card-border)}
  .top-in{max-width:1240px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;white-space:nowrap}
  .brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));font-size:17px;box-shadow:0 6px 16px rgba(124,92,255,.45)}
  .brand small{color:var(--txt-dim);font-weight:600;font-size:12px}
  .top-stats{display:flex;gap:14px;font-size:13px;color:var(--txt-dim);margin-left:auto;flex-wrap:wrap}
  .top-stats b{color:var(--txt);font-size:14px}
  .top-btns{display:flex;gap:8px;margin-left:8px}
  .top-btns button{background:var(--card);border:1px solid var(--card-border);color:var(--txt);
    padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600}
  .top-btns button:hover{border-color:var(--accent)}
  @media(max-width:900px){ .top-stats{display:none} }
  @media(max-width:640px){ .brand small{display:none} .top-btns button{padding:6px 9px;font-size:12px} }

  /* ===== LAYOUT ===== */
  .game-wrap{max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media(max-width:960px){ .game-wrap{grid-template-columns:1fr} }

  /* ===== VIEWPORT / MAP ===== */
  .viewport{position:relative;width:100%;height:min(66vh,600px);min-height:380px;border-radius:18px;overflow:hidden;
    border:1px solid var(--card-border);background:#243b2a;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  @media(max-width:640px){ .viewport{height:52vh;min-height:320px} }
  .map-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .tile-layer,.entity-layer{position:absolute;left:0;top:0}
  .tile{position:absolute;width:32px;height:32px;overflow:hidden}
  .tile::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 42%),linear-gradient(315deg,rgba(0,0,0,.30),transparent 52%)}
  .t-grass{background:#3f7a47}
  .t-tall{background:#2f5f38;background-image:repeating-linear-gradient(118deg,rgba(255,255,255,.10) 0 2px,transparent 2px 8px)}
  .t-path{background:#b59a63}
  .t-tree{background:#234e34;display:grid;place-items:center}
  .t-water{background:linear-gradient(180deg,#2f6fb0,#214e84);box-shadow:inset 0 0 0 1px rgba(77,150,255,.22)}
  .t-rock{background:#5f5a6c}
  .t-snow{background:#c3d9e8}
  .t-sand{background:#cdb173}
  .t-lava{background:linear-gradient(180deg,#ef6a12,#a8320a);box-shadow:inset 0 0 10px rgba(255,190,60,.5)}
  .t-ruin{background:#544e63}
  .tile .spr{width:100%;height:100%}
  .entity{position:absolute;width:32px;height:32px;display:grid;place-items:center;font-size:21px;z-index:4;transition:transform .12s}
  .entity.item{font-size:16px;animation:itemBob 1.6s ease-in-out infinite}
  @keyframes itemBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .entity.trainer::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:20px;height:5px;border-radius:50%;background:rgba(0,0,0,.35)}
  .player{position:absolute;width:32px;height:32px;display:grid;place-items:center;font-size:22px;z-index:6;
    transition:transform .11s linear;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
  .biome-tag{position:absolute;left:12px;top:12px;z-index:20;background:rgba(8,11,30,.7);border:1px solid var(--card-border);
    padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  .flash.on{animation:flashAnim .45s ease-out}
  @keyframes flashAnim{0%{opacity:.85}100%{opacity:0}}

  /* ===== DPAD ===== */
  .controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:5px}
  .dpad button{background:var(--card);border:1px solid var(--card-border);border-radius:12px;color:var(--txt);
    font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .dpad button:active{background:rgba(124,92,255,.35)}
  .dpad .up{grid-area:1/2} .dpad .left{grid-area:2/1} .dpad .right{grid-area:2/3} .dpad .down{grid-area:3/2}
  /* 手杆（虚拟摇杆） */
  .joystick{position:relative;width:132px;height:132px;border-radius:50%;touch-action:none;user-select:none;
    background:radial-gradient(circle at 50% 40%,rgba(124,92,255,.22),rgba(11,16,38,.6) 72%);
    border:2px solid rgba(124,92,255,.5);
    box-shadow:inset 0 0 20px rgba(124,92,255,.28),0 6px 18px rgba(0,0,0,.45);flex:0 0 auto}
  .joystick .joy-base{position:absolute;inset:16px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,rgba(58,76,134,.4),rgba(11,16,38,.5))}
  .joystick .joy-ring{position:absolute;inset:30px;border-radius:50%;border:1px dashed rgba(124,92,255,.4)}
  .joystick .joy-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#c3b2ff,#6c4ff0 58%,#3f29a0);
    border:2px solid rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.55);transition:transform .04s linear}
  .joystick.on{box-shadow:inset 0 0 26px rgba(124,92,255,.5),0 6px 18px rgba(0,0,0,.45)}
  .joystick.on .joy-knob{background:radial-gradient(circle at 38% 32%,#d9ccff,#8a6bff 58%,#4a2fa0)}
  .hint-box{font-size:12.5px;color:var(--txt-dim);line-height:1.8;flex:1;min-width:220px}
  .kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid var(--card-border);font-size:11px}

  /* ===== SIDE PANELS ===== */
  .side{display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:14px}
  .panel h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;color:var(--txt)}
  .panel h3 span{font-size:11.5px;color:var(--txt-dim);font-weight:600}
  .party-row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:11px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .party-row:hover{background:rgba(255,255,255,.05)}
  .party-row.active{border-color:var(--accent);background:rgba(124,92,255,.14)}
  .party-row.fainted{opacity:.45}
  .party-emo{font-size:22px;width:26px;text-align:center}
  .party-mid{flex:1;min-width:0}
  .party-nm{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
  .hpbar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
  .hpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#a3e635);transition:width .35s}
  .hpbar i.mid{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .hpbar i.low{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .party-sub{font-size:11px;color:var(--txt-dim);margin-top:3px}
  .bag-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px dashed rgba(255,255,255,.08)}
  .bag-row:last-child{border-bottom:none}
  .bag-row .use{padding:5px 10px;border-radius:8px;border:1px solid var(--card-border);background:rgba(255,255,255,.06);color:var(--txt);font-size:12px;cursor:pointer;font-weight:600}
  .bag-row .use:disabled{opacity:.35;cursor:not-allowed}
  .prog-row{font-size:12.5px;color:var(--txt-dim);line-height:2}
  .prog-row b{color:var(--txt)}
  .pbar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 10px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
  .tips{font-size:12px;color:var(--txt-dim);line-height:1.9}
  .tips b{color:var(--gold)}

  /* ===== BATTLE ===== */
  .battle{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#1a2450 0%,#2c3d78 55%,#42558f 100%)}
  .battle[hidden]{display:none}
  .b-scene{flex:1;position:relative;padding:14px;overflow:hidden}
  .b-scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:38%;
    background:linear-gradient(180deg,transparent,rgba(120,160,110,.35))}
  .b-side{position:absolute;z-index:2}
  .b-side.enemy{right:5%;top:6%;text-align:center}
  .b-side.player{left:5%;bottom:5%;text-align:center}
  .b-sprite{font-size:64px;line-height:1;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45));display:inline-block}
  @media(max-width:640px){ .b-sprite{font-size:50px} }
  .b-sprite.hit{animation:shakeX .4s}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
  .b-hpbox{background:rgba(8,12,28,.78);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 11px;min-width:170px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);text-align:left}
  .b-name{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}
  .b-lv{font-size:11px;color:var(--gold);font-weight:700}
  .b-hp{height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
  .b-hp i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#a3e635);transition:width .4s}
  .b-hp i.mid{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .b-hp i.low{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .b-hptext{font-size:11px;color:var(--txt-dim);margin-top:4px;text-align:right}
  .b-bottom{flex:none;background:rgba(6,9,22,.94);border-top:2px solid rgba(255,255,255,.16);padding:12px 14px;min-height:150px}
  .b-msg{font-size:14px;line-height:1.6;min-height:42px;color:var(--txt)}
  .b-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .b-btn{background:rgba(255,255,255,.07);border:1px solid var(--card-border);color:var(--txt);padding:11px 12px;
    border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .b-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,92,255,.18)}
  .b-btn:disabled{opacity:.4;cursor:not-allowed}
  .b-btn small{font-size:10.5px;color:var(--txt-dim);font-weight:600;white-space:nowrap}
  .b-btn.cur{border-color:var(--accent-2)}
  .b-btn.back{grid-column:1/-1;justify-content:center;color:var(--txt-dim)}
  .b-ball{position:absolute;left:50%;bottom:20%;width:44px;height:44px;font-size:34px;opacity:0;z-index:5;pointer-events:none}
  .b-ball .spr{width:100%;height:100%}
  .b-ball.throw{animation:ballThrow .9s ease-out}
  @keyframes ballThrow{0%{opacity:1;transform:translate(-50%,0) scale(1)}45%{opacity:1;transform:translate(-50%,-160px) scale(.85)}70%{opacity:1;transform:translate(-50%,-190px) scale(.8)}100%{opacity:0;transform:translate(-50%,-200px) scale(.6)}}
  .float-dmg{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:26px;pointer-events:none;z-index:120;
    animation:floatUp .85s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-64%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(4,6,20,.8);backdrop-filter:blur(6px);display:none;z-index:200;padding:18px;overflow:auto}
  .overlay.show{display:block}
  .modal{max-width:880px;margin:24px auto;background:linear-gradient(160deg,#161c3e,#0e1430);border:1px solid var(--card-border);
    border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
  .modal .close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--txt-dim);font-size:20px;cursor:pointer}
  .modal .close:hover{color:var(--txt)}
  .modal h2{margin:0 0 4px;font-size:22px}
  .modal .sub{color:var(--txt-dim);font-size:13px;margin-bottom:16px;line-height:1.7}
  .dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .dex-cell{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px;cursor:pointer;transition:.15s;text-align:center;position:relative}
  .dex-cell:hover{border-color:var(--accent);transform:translateY(-2px)}
  .dex-cell .dm{font-size:30px}
  .dex-cell .dn{font-size:13px;font-weight:800;margin-top:4px;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}
  .dex-cell .dc{font-size:11px;color:var(--txt-dim);margin-top:3px}
  .dex-cell.owned{border-color:var(--good);box-shadow:0 0 0 1px rgba(52,211,153,.35)}
  .dex-cell.owned::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--good);font-weight:900;font-size:12px}

  .tc-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--txt-dim)}
  .tc-legend .lg{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px}
  .tc-wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:14px;background:var(--card);padding:8px}
  table.tc{border-collapse:separate;border-spacing:3px;margin:0 auto}
  table.tc th{font-size:11px;padding:1px;text-align:center}
  .hbadge{display:inline-block;padding:3px 6px;border-radius:7px;color:#0b1026;font-weight:800;font-size:10.5px;white-space:nowrap;cursor:pointer;transition:.15s}
  .hbadge:hover{transform:translateY(-2px)}
  table.tc th.hl .hbadge{box-shadow:0 0 0 2px #fff,0 0 12px rgba(255,255,255,.5)}
  table.tc td{width:26px;height:26px;text-align:center;border-radius:7px;font-weight:800;font-size:11px;transition:opacity .2s}
  td.c2{background:rgba(52,211,153,.9);color:#052e1a}
  td.ch{background:rgba(251,113,133,.85);color:#3a0a12}
  td.c0{background:#3a3f66;color:#9aa6d6}
  td.c1{background:rgba(255,255,255,.05);color:#586094}
  td.dim{opacity:.15} td.hl{box-shadow:inset 0 0 0 2px var(--accent-2)}
  .tc-summary{margin-top:12px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--txt-dim)}
  .tc-summary b{color:var(--txt)}

  .detail-top{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .detail-sprite{width:110px;height:110px;display:grid;place-items:center;font-size:64px;border-radius:20px;position:relative;isolation:isolate}
  .detail-sprite::before{content:'';position:absolute;inset:0;border-radius:20px;background:radial-gradient(circle,var(--aura,#7c5cff),transparent 70%);opacity:.35;filter:blur(8px);z-index:-1}
  .stat-row{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12.5px}
  .stat-row .lbl{width:40px;color:var(--txt-dim)}
  .stat-bar{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .stat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .stat-row .val{width:30px;text-align:right;font-weight:700}
  .iblock{margin-top:12px}
  .iblock h4{margin:0 0 3px;font-size:13px;color:var(--accent-2)}
  .iblock p{margin:0;color:var(--txt-dim);font-size:12.5px;line-height:1.65}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .mchip{background:rgba(255,255,255,.05);border:1px solid var(--card-border);border-radius:9px;padding:8px 10px;font-size:12px}
  .mchip b{font-size:12.5px}

  .starters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:600px){ .starters{grid-template-columns:1fr} }
  .starter{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;text-align:center;cursor:pointer;transition:.18s}
  .starter:hover{border-color:var(--accent);transform:translateY(-4px)}
  .starter .sm{font-size:52px}
  .starter .sn{font-weight:800;margin-top:6px}
  .starter .sd{font-size:12px;color:var(--txt-dim);line-height:1.6;margin-top:6px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(40px);background:#0b1026;border:1px solid var(--accent);
    color:#fff;padding:11px 20px;border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transition:.3s;z-index:300;font-size:13.5px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 打击感 / 经验值 / 像素特效层 ===== */
  .b-scene{will-change:transform}
  .fx-canvas,.pf-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
    image-rendering:pixelated;image-rendering:crisp-edges;z-index:3}
  .hitstop .b-sprite,.hitstop .fx-canvas,.hitstop .pf-canvas{animation-play-state:paused}
  .b-sprite.lunge-r{animation:lungeR .24s ease-out}
  .b-sprite.lunge-l{animation:lungeL .24s ease-out}
  @keyframes lungeR{0%,100%{transform:translate(0,0)}45%{transform:translate(18px,-10px) scale(1.05)}}
  @keyframes lungeL{0%,100%{transform:translate(0,0)}45%{transform:translate(-18px,10px) scale(1.05)}}
  .b-sprite.hurt{animation:hurtFlash .3s ease-out}
  @keyframes hurtFlash{0%{filter:brightness(4.5) saturate(0)}60%{filter:brightness(1.8)}100%{filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}}
  .b-sprite.faint{animation:faintFall .7s ease-in forwards}
  @keyframes faintFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(46px) rotate(-22deg) scale(.78)}}
  .bexp{height:4px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:5px}
  .bexp i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#7c5cff);
    transition:width .55s ease-out;box-shadow:0 0 8px rgba(34,211,238,.85)}
  .bexptext{font-size:10px;color:#7bd4ee;margin-top:3px;text-align:right;letter-spacing:.3px;font-weight:700}
  .tier-badge{font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:999px;color:#0b1026;margin-left:5px}

/* ---------------- 几何工具 ---------------- */
function _hx(c){ return parseInt(c.slice(1),16); }
function _rgb(n){ return [(n>>16)&255,(n>>8)&255,n&255]; }
function _mix(a,b,t){ const A=_rgb(_hx(a)),B=_rgb(_hx(b)); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function _n(s){ return String(s).trim().split(/\s+/).map(q=>q.split(',').map(Number)); }
function _st(a){ return a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '); }
function _bbp(a){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; a.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}); return {x0,y0,x1,y1,w:x1-x0,h:y1-y0}; }
function _area(p){ let s=0; for(let i=0;i<p.length;i++){ const a=p[i],b=p[(i+1)%p.length]; s+=a[0]*b[1]-b[0]*a[1]; } return s/2; }
function _clip(sub,cl){
  let C=cl.slice(); if(_area(C)<0) C.reverse();
  let out=sub.slice();
  for(let i=0;i<C.length;i++){
    if(!out.length) break;
    const a=C[i], b=C[(i+1)%C.length];
    const side=p=>((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]));
    const cut=(p,q)=>{ const x1=p[0],y1=p[1],x2=q[0],y2=q[1],x3=a[0],y3=a[1],x4=b[0],y4=b[1];
      const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4); if(!d) return q;
      const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
      return [x1+t*(x2-x1),y1+t*(y2-y1)]; };
    const inp=out; out=[];
    for(let j=0;j<inp.length;j++){
      const cur=inp[j], prv=inp[(j+inp.length-1)%inp.length];
      const ci=side(cur)>=0, pi=side(prv)>=0;
      if(ci){ if(!pi) out.push(cut(prv,cur)); out.push(cur); }
      else if(pi) out.push(cut(prv,cur));
    }
  }
  return out;
}

function el(cx,cy,rx,ry,n,rot,irr){
  n=n||10; rot=rot||0; const P=[];

function taper(ax,ay,bx,by,w0,w1,bow,N){
  N=N||8; const mx=(ax+bx)/2,my=(ay+by)/2,dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, cx=mx+nx*(bow||0), cy=my+ny*(bow||0);

  for(let i=0;i<=N;i++){
    const t=i/N,u=1-t;
    const x=u*u*ax+2*u*t*cx+t*t*bx, y=u*u*ay+2*u*t*cy+t*t*by;
    const w=(w0+(w1-w0)*t)/2;

    const tl=Math.hypot(tx,ty)||1;
    top.push([x-ty/tl*w, y+tx/tl*w]); bot.push([x+ty/tl*w, y-tx/tl*w]);

/* 腿：髋 → 膝 → 踝 → 掌（带趾与爪），后腿压暗退后 */
function LEG(P,o){
  const hind=o.tone==='hind';
  const cb=hind?P.dark2:P.base, cl=hind?P.base:P.lite, cd=P.dark;
  const [hx,hy]=o.hip,[kx,ky]=o.knee,[ax,ay]=o.ankle,[fx,fy]=o.foot;
  const w0=o.w0||11, w1=o.w1||8, w2=o.w2||6.4;
  let s='';
  s+=_facet(taper(hx,hy,kx,ky,w0,w1,o.bow||0,5),cb,cl,cd,1.8);
  s+=_facet(taper(kx,ky,ax,ay,w1*1.08,w2,o.bow2||0,5),cb,cl,cd,1.7);
  const pw=w2*2.55, ph=w2*1.02;
  s+=_facet(el(fx,fy-ph*.28,pw/2,ph*.8,8),cb,cl,cd,1.6);
  for(let i=-1;i<=1;i++){
    const tx=fx+i*pw*0.295;
    s+=_cir(tx,fy+ph*.34,pw*0.112,hind?P.dark:P.dark2,1,0);
  }
  if(o.claws){
    for(let i=-1;i<=1;i++){
      const tx=fx+i*pw*0.295;
      s+=_pp(`${(tx-1.1).toFixed(1)},${(fy+ph*.46).toFixed(1)} ${(tx+1.1).toFixed(1)},${(fy+ph*.46).toFixed(1)} ${tx.toFixed(1)},${(fy+ph*.46+2.4).toFixed(1)}`,ART_HI,.95,0);
    }
  }
  return s;
}
/* 臂：肩 → 肘 → 腕 → 手（带指） */
function ARM(P,o){
  const [sx,sy]=o.sh,[ex,ey]=o.elb,[wx,wy]=o.wr;
  const w0=o.w0||9, w1=o.w1||7, w2=o.w2||6;
  let s='';
  s+=_facet(taper(sx,sy,ex,ey,w0,w1,o.bow||0,5),P.base,P.lite,P.dark,1.8);
  s+=_facet(taper(ex,ey,wx,wy,w1*1.06,w2,o.bow2||0,5),P.base,P.lite,P.dark,1.7);
  s+=_facet(el(wx,wy+1.6,w2*1.06,w2*.92,8),P.base,P.lite,P.dark,1.6);
  for(let i=-1;i<=1;i++) s+=_cir(wx+i*w2*.62,wy+4.2,w2*.23,P.dark2,1,0);
  if(o.claw) for(let i=-1;i<=1;i++) s+=_pp(`${(wx+i*w2*.62-1).toFixed(1)},${(wy+6).toFixed(1)} ${(wx+i*w2*.62+1).toFixed(1)},${(wy+6).toFixed(1)} ${(wx+i*w2*.62).toFixed(1)},${(wy+8.2).toFixed(1)}`,ART_HI,.95,0);
  return s;
}
/* 躯干：肩窄胯宽的梨形，带肩帽/胯帽与浅色胸腹 */
function TORSO(P,o){
  const cx=o.cx||50, dx=o.dx||0, y0=o.y0, y1=o.y1, w0=o.w0, w1=o.w1, bow=o.bow||0;

  deerH(hx,hy,rx,ry,P,g){

  octoH(hx,hy,rx,ry,P,g){

  dragonH(hx,hy,rx,ry,P,g){

    s+=_pp(`${(hx+rx*.18).toFixed(1)},${(hy+ry*.58).toFixed(1)} ${(hx+rx*.30).toFixed(1)},${(hy+ry*.58).toFixed(1)} ${(hx+rx*.24).toFixed(1)},${(hy+ry*.94).toFixed(1)}`,ART_HI,.95,1.1);
    s+=_cir(hx-rx*.12,hy+ry*.3,rx*.07,ART_INK,1,0)+_cir(hx+rx*.12,hy+ry*.3,rx*.07,ART_INK,1,0);
    /* 额鳞 */
    if(!P.mini) s+=_pp(`${hx.toFixed(1)},${(hy-ry*.7).toFixed(1)} ${(hx+rx*.2).toFixed(1)},${(hy-ry*.34).toFixed(1)} ${hx.toFixed(1)},${(hy-ry*.06).toFixed(1)} ${(hx-rx*.2).toFixed(1)},${(hy-ry*.34).toFixed(1)}`,P.lite,.4,1.2);

  demonH(hx,hy,rx,ry,P,g){
    let s=_facet(el(hx,hy,rx*1.04,ry*.94,11),P.base,P.lite,P.dark,2.1);
    /* 裂隙发光眼 */
    s+=_pp(`${(hx-rx*.72).toFixed(1)},${(hy-ry*.24).toFixed(1)} ${(hx-rx*.18).toFixed(1)},${(hy-ry*.42).toFixed(1)} ${(hx-rx*.18).toFixed(1)},${(hy-ry*.02).toFixed(1)} ${(hx-rx*.72).toFixed(1)},${(hy-ry*.06).toFixed(1)}`,P.C,.95,1.2);
    s+=_pp(`${(hx+rx*.18).toFixed(1)},${(hy-ry*.42).toFixed(1)} ${(hx+rx*.72).toFixed(1)},${(hy-ry*.24).toFixed(1)} ${(hx+rx*.72).toFixed(1)},${(hy-ry*.06).toFixed(1)} ${(hx+rx*.18).toFixed(1)},${(hy-ry*.02).toFixed(1)}`,P.C,.95,1.2);
    if(!P.mini){
      s+=_pl(`M${(hx-rx*.66).toFixed(1)},${(hy-ry*.2).toFixed(1)} L${(hx-rx*.26).toFixed(1)},${(hy-ry*.32).toFixed(1)}`,ART_HI,1.3,.9);
      s+=_pl(`M${(hx+rx*.26).toFixed(1)},${(hy-ry*.32).toFixed(1)} L${(hx+rx*.66).toFixed(1)},${(hy-ry*.2).toFixed(1)}`,ART_HI,1.3,.9);
    }
    /* 咧嘴 */
    s+=_facet(`${(hx-rx*.44).toFixed(1)},${(hy+ry*.34).toFixed(1)} ${(hx+rx*.44).toFixed(1)},${(hy+ry*.34).toFixed(1)} ${(hx+rx*.3).toFixed(1)},${(hy+ry*.74).toFixed(1)} ${(hx-rx*.3).toFixed(1)},${(hy+ry*.74).toFixed(1)}`,ART_INK,.9,1.2);
    let t='';
    for(let i=0;i<5;i++){ const x=hx-rx*.3+i*rx*.15; t+=`${x.toFixed(1)},${(hy+ry*.36).toFixed(1)} ${(x+rx*.08).toFixed(1)},${(hy+ry*.36).toFixed(1)} ${(x+rx*.04).toFixed(1)},${(hy+ry*.56).toFixed(1)} `; }
    s+=_pp(t.trim(),ART_HI,.9,0);
    return s;
  },
  frogH(hx,hy,rx,ry,P,g){
    let s=_facet(el(hx,hy,rx*1.22,ry*.9,11),P.base,P.lite,P.dark,2.1);
    /* 头顶双凸眼 */
    const ex=rx*.62, ey=hy-ry*.72;
    s+=_cir(hx-ex,ey,rx*.38,P.base,1,1.7)+_cir(hx+ex,ey,rx*.38,P.base,1,1.7);
    s+=_cir(hx-ex,ey,rx*.24,ART_INK,1,0)+_cir(hx+ex,ey,rx*.24,ART_INK,1,0);
    s+=_cir(hx-ex-rx*.07,ey-rx*.08,rx*.09,ART_HI,.95,0)+_cir(hx+ex-rx*.07,ey-rx*.08,rx*.09,ART_HI,.95,0);
    /* 宽嘴 */
    s+=_pl(`M${(hx-rx*1.0).toFixed(1)},${(hy+ry*.22).toFixed(1)} Q${hx.toFixed(1)},${(hy+ry*.72).toFixed(1)} ${(hx+rx*1.0).toFixed(1)},${(hy+ry*.22).toFixed(1)}`,ART_INK,2.2,.95);
    s+=_facet(el(hx,hy+ry*.42,rx*.6,ry*.28,9),P.belly,P.hi,P.dark,1.2);
    return s;

  batH(hx,hy,rx,ry,P,g){
    let s=_facet(el(hx,hy,rx*.98,ry*.94,11),P.base,P.lite,P.dark,2.1);
    s+=_facet(el(hx,hy-ry*.16,rx*.62,ry*.54,9),P.belly,P.hi,P.dark,1.2);
    s+=_facet(`${(hx-rx*.2).toFixed(1)},${(hy+ry*.3).toFixed(1)} ${(hx+rx*.2).toFixed(1)},${(hy+ry*.3).toFixed(1)} ${hx.toFixed(1)},${(hy+ry*.5).toFixed(1)}`,P.dark,.95,1.2);
    s+=_pp(`${(hx-rx*.22).toFixed(1)},${(hy+ry*.6).toFixed(1)} ${(hx-rx*.12).toFixed(1)},${(hy+ry*.6).toFixed(1)} ${(hx-rx*.16).toFixed(1)},${(hy+ry*.86).toFixed(1)}`,ART_HI,.95,1);
    s+=_pp(`${(hx+rx*.12).toFixed(1)},${(hy+ry*.6).toFixed(1)} ${(hx+rx*.22).toFixed(1)},${(hy+ry*.6).toFixed(1)} ${(hx+rx*.16).toFixed(1)},${(hy+ry*.86).toFixed(1)}`,ART_HI,.95,1);
    return s+EYE(hx-rx*.44,hy-ry*.12,rx*.28,P,g)+EYE(hx+rx*.44,hy-ry*.12,rx*.28,P,g);
  }
};

/* ---------------- 耳（正面两侧） ---------------- */
const EAR={
  roundBig(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const R=rx*.38*k+rx*.16;
    let o=_facet(el(hx-rx*.76,hy-ry*.78,R,R*1.02,9),P.dark2,P.base,P.dark,1.6);
    o+=_facet(el(hx+rx*.76,hy-ry*.78,R,R*1.02,9),P.base,P.lite,P.dark,1.6);
    o+=_cir(hx-rx*.76,hy-ry*.78,R*.5,P.C,.4,0)+_cir(hx+rx*.76,hy-ry*.78,R*.5,P.C,.45,0);
    return o;
  },
  roundSmall(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const R=rx*.28*k+rx*.12;
    let o=_facet(el(hx-rx*.72,hy-ry*.76,R,R,8),P.dark2,P.base,P.dark,1.5);
    o+=_facet(el(hx+rx*.72,hy-ry*.76,R,R,8),P.base,P.lite,P.dark,1.5);
    o+=_cir(hx+rx*.72,hy-ry*.76,R*.48,P.C,.45,0);
    return o;
  },
  foxPoint(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const H=ry*(.62+.42*k), W=rx*.34;
    const one=(dir,base,lite)=>{
      const bx=hx+dir*rx*.70, by=hy-ry*.66;
      const tx=bx+dir*rx*.16, ty=by-H;
      let s=_facet(`${(bx-W).toFixed(1)},${by.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} ${(bx+W).toFixed(1)},${by.toFixed(1)}`,base,lite,P.dark,1.6);
      s+=_pl(`M${bx.toFixed(1)},${(by-2).toFixed(1)} L${(tx-dir*1).toFixed(1)},${(ty+7).toFixed(1)}`,P.C,2,.55);
      return s;
    };
    return one(-1,P.dark2,P.base)+one(1,P.base,P.lite);
  },
  leafLong(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const H=ry*(1.15+.75*k), W=rx*.22;
    const one=(dir,base,lite)=>{
      const bx=hx+dir*rx*.42, by=hy-ry*.82;
      const tx=bx+dir*rx*.12, ty=by-H;
      let s=_facet(taper(bx,by,tx,ty,W*2,W*.7,dir*4,5),base,lite,P.dark,1.7);
      s+=_pl(`M${bx.toFixed(1)},${(by-4).toFixed(1)} L${(tx+dir*1).toFixed(1)},${(ty+8).toFixed(1)}`,P.C,2.2,.5);
      return s;
    };
    return one(-1,P.dark2,P.base)+one(1,P.base,P.lite);
  },
  tuft(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const one=(dx,h,base)=>{
      const bx=hx+dx*rx*.5, by=hy-ry*.86;
      return _facet(`${(bx-3).toFixed(1)},${by.toFixed(1)} ${(bx+dx*2).toFixed(1)},${(by-h).toFixed(1)} ${(bx+3).toFixed(1)},${by.toFixed(1)}`,base,P.lite,P.dark,1.4);
    };
    return one(-1,ry*(1.0+.4*k),P.dark2)+one(-.2,ry*(.7+.28*k),P.base)+one(.85,ry*(.9+.36*k),P.base);
  },
  fin(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const one=(dir,base,lite)=>{
      const bx=hx+dir*rx*.72, by=hy-ry*.5;
      return _facet(`${bx.toFixed(1)},${by.toFixed(1)} ${(bx+dir*rx*.72).toFixed(1)},${(by-ry*(.7+.4*k)).toFixed(1)} ${(bx+dir*rx*.2).toFixed(1)},${(by-ry*.02).toFixed(1)}`,base,lite,P.dark,1.5);
    };
    return one(-1,P.dark2,P.base)+one(1,P.base,P.lite);
  }
};

/* ---------------- 角（正面头顶两侧） ---------------- */
const HORN={
  mini(P,c,g,a){
    const [hx,hy,rx,ry]=a.head;
    return _pp(`${(hx-rx*.42).toFixed(1)},${(hy-ry*.94).toFixed(1)} ${(hx-rx*.52).toFixed(1)},${(hy-ry*1.32).toFixed(1)} ${(hx-rx*.24).toFixed(1)},${(hy-ry*.96).toFixed(1)}`,P.C,.9,1.5)
         + _pp(`${(hx+rx*.42).toFixed(1)},${(hy-ry*.94).toFixed(1)} ${(hx+rx*.52).toFixed(1)},${(hy-ry*1.32).toFixed(1)} ${(hx+rx*.24).toFixed(1)},${(hy-ry*.96).toFixed(1)}`,P.C,.9,1.5);
  },
  curved(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const one=(dir,base)=>{
      const bx=hx+dir*rx*.44, by=hy-ry*.92;
      return _facet(taper(bx,by,bx+dir*rx*(.34+.5*k),by-ry*(1.0+1.0*k),7*k+4,2.4,dir*8*k,5),P.C,ART_HI,P.dark,1.5);
    };
    return one(-1)+one(1);
  },
  antler(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, st=g.eye, L=[.8,1.12,1.42][st]*ry;
    const lit=_mix(P.C,"#ffffff",.4);
    let o="";
    [-1,1].forEach((dir)=>{
      const bx=hx+dir*rx*.38, by=hy-ry*.9;
      const tx=bx+dir*rx*.44, ty=by-L;
      o+=_facet(taper(bx,by,tx,ty,6.5,2.6,dir*7,6),P.C,lit,P.dark,1.5);
      const forks=st+1;
      for(let f=0;f<forks;f++){
        const t=.22+f*.3;
        const px=bx+(tx-bx)*t, py=by+(ty-by)*t;
        const dx=dir*rx*(.32+.06*f), dy=-L*(.46-.05*f);
        o+=_pl("M"+px.toFixed(1)+","+py.toFixed(1)+" L"+(px+dx).toFixed(1)+","+(py+dy).toFixed(1),P.C,1.9,.95);
        o+=_cir(px+dx,py+dy,1.5,P.C,.85,0);
      }
    });
    return o;
  },
  bull(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const lit=_mix(P.C,"#ffffff",.35);
    const one=(dir)=>{
      const bx=hx+dir*rx*.62, by=hy-ry*.62;
      return _facet(taper(bx,by,bx+dir*rx*(.5+.34*k),by-ry*(.34+.3*k),9*k+5,3.4,dir*6,5),P.C,lit,P.dark,1.6);
    };
    return one(-1)+one(1);
  },
  crystal(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    return _pp(`${(hx-rx*.5).toFixed(1)},${(hy-ry*.9).toFixed(1)} ${(hx-rx*.62).toFixed(1)},${(hy-ry*(1.4+.55*k)).toFixed(1)} ${(hx-rx*.2).toFixed(1)},${(hy-ry*.92).toFixed(1)}`,P.C,.9,1.5)
         + _pp(`${(hx+rx*.5).toFixed(1)},${(hy-ry*.9).toFixed(1)} ${(hx+rx*.62).toFixed(1)},${(hy-ry*(1.4+.55*k)).toFixed(1)} ${(hx+rx*.2).toFixed(1)},${(hy-ry*.92).toFixed(1)}`,P.C,.9,1.5)
         + _pl(`M${hx.toFixed(1)},${(hy-ry*.96).toFixed(1)} L${hx.toFixed(1)},${(hy-ry*(1.3+.4*k)).toFixed(1)}`,P.C,2.2,.7)
         + _pp(`${(hx-rx*.14).toFixed(1)},${(hy-ry*.94).toFixed(1)} ${hx.toFixed(1)},${(hy-ry*(1.42+.4*k)).toFixed(1)} ${(hx+rx*.14).toFixed(1)},${(hy-ry*.94).toFixed(1)}`,P.C,.85,1.4);
  },
  flame(P,c,g,a){
    const [hx,hy,rx,ry]=a.head, k=g.feat;
    const f=(x,base,h)=>_pp(`${(x-base*.5).toFixed(1)},${hy.toFixed(1)} ${(x-base*.3).toFixed(1)},${(hy-h*.5).toFixed(1)} ${(x+base*.1).toFixed(1)},${(hy-h*.86).toFixed(1)} ${(x+base*.5).toFixed(1)},${(hy-h*.4).toFixed(1)} ${(x+base*.6).toFixed(1)},${hy.toFixed(1)}`,P.C,.85,1.3);
    const y=hy-ry*.9, h=ry*(1.2+.6*k);
    return _pp(`${(hx-rx*.56).toFixed(1)},${y.toFixed(1)} ${(hx-rx*.34).toFixed(1)},${(y-h*.72).toFixed(1)} ${(hx-rx*.14).toFixed(1)},${(y-h).toFixed(1)} ${(hx-rx*.02).toFixed(1)},${y.toFixed(1)}`,P.C,.88,1.3)
         + _pp(`${(hx+rx*.02).toFixed(1)},${y.toFixed(1)} ${(hx+rx*.2).toFixed(1)},${(y-h*1.1).toFixed(1)} ${(hx+rx*.44).toFixed(1)},${(y-h*.76).toFixed(1)} ${(hx+rx*.58).toFixed(1)},${y.toFixed(1)}`,P.C,.88,1.3);
  }
};

/* ---------------- 翼（正面，双侧展开） ---------------- */
const WING={
  /* 鸟翼：一整片翼面（前缘直、后缘羽状齿）+ 羽线 */
  bird(P,c,g,a,side){
    const sx=(side<0?a.sh:a.sh2)[0], sy=a.shY, k=g.feat;
    const sp=13+k*12, up=12+k*12;
    const tx=sx+side*sp, ty=sy-up;
    const bx=sx+side*sp*.86, by=sy+up*.78;
    const base=side<0?P.dark2:P.base, lite=side<0?P.base:P.lite;
    let poly=sx.toFixed(1)+","+(sy-4).toFixed(1)+" "+tx.toFixed(1)+","+ty.toFixed(1);
    const N=4;
    for(let i=1;i<=N;i++){
      const t=i/N;
      const ex=tx+(bx-tx)*t, ey=ty+(by-ty)*t;
      poly+=" "+(ex+side*3.5).toFixed(1)+","+(ey-1).toFixed(1)+" "+ex.toFixed(1)+","+(ey+4.5).toFixed(1);
    }
    poly+=" "+(sx+side*1).toFixed(1)+","+(sy+7).toFixed(1);
    let s=_facet(poly,base,lite,P.dark,1.8);
    for(let i=1;i<=3;i++){
      const t=i/4, ex=tx+(bx-tx)*t, ey=ty+(by-ty)*t;
      s+=_pl("M"+(sx+side*2).toFixed(1)+","+(sy+2).toFixed(1)+" L"+ex.toFixed(1)+","+ey.toFixed(1),P.C,1.3,.6);
    }
    s+=_pl("M"+sx.toFixed(1)+","+(sy-2).toFixed(1)+" L"+tx.toFixed(1)+","+ty.toFixed(1),P.C,1.7,.85);
    return s;

  /* 蝠膜翼：三段指骨撑起的整片膜 */
  bat(P,c,g,a,side){

    const sp=15+k*14, up=12+k*11;
    const ox=sx+side*2, oy=sy;
    const wx=ox+side*sp, wy=oy-up;

  /* 蝶翼：上大下小两片，带翅脉与圆斑 */

  bugSmall(P,c,g,a,side){

  dragon(P,c,g,a,side){

  /* 隼刀翅：细长后掠整片 */
  blade(P,c,g,a,side){
    const sx=(side<0?a.sh:a.sh2)[0], sy=a.shY, k=g.feat, sp=16+k*14;
    const p=sx.toFixed(1)+","+(sy-3).toFixed(1)+" "+(sx+side*sp*.45).toFixed(1)+","+(sy-15).toFixed(1)+" "+(sx+side*sp).toFixed(1)+","+(sy+1).toFixed(1)+" "+(sx+side*sp*.5).toFixed(1)+","+(sy+10).toFixed(1);

    for(let i=0;i<2;i++){
      const t=.45+i*.25, x=sx+side*sp*t, y=sy-15+t*16;
      s+=_pl("M"+x.toFixed(1)+","+y.toFixed(1)+" L"+(x+side*sp*.12).toFixed(1)+","+(y+9).toFixed(1),P.C,1.2,.55);

  },
  /* 鳍翼（水/风） */
  fin(P,c,g,a,side){
    const sx=(side<0?a.sh:a.sh2)[0], sy=a.shY;
    const p=sx.toFixed(1)+","+sy.toFixed(1)+" "+(sx+side*15).toFixed(1)+","+(sy-17).toFixed(1)+" "+(sx+side*19).toFixed(1)+","+(sy-2).toFixed(1)+" "+(sx+side*13).toFixed(1)+","+(sy+11).toFixed(1);

};

function spiritSVG(id,stage,o){
  o=o||{}; const sp=SPIRITS.find(x=>x.id===id); if(!sp) return '';
  const st=Math.max(0,Math.min(2,stage|0));
  const A=ART_TYPE[sp.type]||ART_TYPE.dragon, C=A.c, tech=A.line==='tech';
  const g=STG[st], base=SA[id]||SA.s1;
  const c=Object.assign({},base,(base.alt&&base.alt[st])||{});
  /* 身体真正吃进属性色：同属性成一族，跨属性一眼可分 */
  const AC=SPAL[sp.id]||C;
  const P={
    C, AC, tech, st, mini:!!o.mini,
    base:_mix(_mix(ART_BASE,C,.28),AC,.54), lite:_mix(_mix(ART_LITE,C,.34),AC,.48), dark:_mix(_mix(ART_DARK,C,.16),AC,.20),
    dark2:_mix(_mix(_mix(ART_DARK,C,.12),AC,.16),'#000000',.30), belly:_mix(_mix('#A8B8D8',C,.28),AC,.40), hi:ART_HI
  };
  c.crownKind=_crownKind(sp.type,c.head);
  const Q=QK[sp.id]||{}; const qk=Q[st]||Q.all; const R=(SK[qk||c.sk]||SK.quad)(P,c,g,c.sko||{});
  let body='';
  /* 后层：双翼（背后展开） */
  if(c.wing&&WING[c.wing]) body+=WING[c.wing](P,c,g,R.a,-1)+WING[c.wing](P,c,g,R.a,1);
  /* 尾（从体侧伸出） */
  if(c.tail&&TAIL[c.tail]) body+=TAIL[c.tail](P,c,g,R.a);
  /* 身体 */
  body+=R.d.join('');
  /* 背饰（在背上表面） */
  if(c.back&&BACK[c.back]) body+=BACK[c.back](P,c,g,R.a);
  /* 头 */
  if(HD[c.head]) body+=HD[c.head](R.a.head[0],R.a.head[1],R.a.head[2],R.a.head[3],P,g);
  /* 耳 / 角 */
  if(c.ear&&EAR[c.ear]) body+=EAR[c.ear](P,c,g,R.a);
  if(c.horn&&HORN[c.horn]) body+=HORN[c.horn](P,c,g,R.a);
  /* 专属件 */
  (c.fx||[]).forEach(k=>{ if(FX[k]) body+=FX[k](P,c,g,R.a); });
  /* 三阶才有脚下灵阵（不是每阶都套一圈特效） */
  if(!P.mini&&g.aura>=2){
    body+=`<g class="spr-ring"><ellipse cx="50" cy="88" rx="30" ry="6" fill="none" stroke="${C}" stroke-width="1.6" opacity=".45" stroke-dasharray="7 6"/></g>`;
  }
  const flip=o.flip?' transform="scale(-1 1) translate(-100 0)"':'';
  const sc=g.s.toFixed(3);
  return `<svg class="spr${o.static?' spr-static':''}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="${sp.stages[st]}"><g transform="translate(50 88) scale(${sc}) translate(-50 -88)"><g${flip}>${body}</g></g></svg>`;
}

function shadeHEX(hex,amt){ // amt∈[-1,1]，正提亮、负压暗
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=> amt>=0 ? Math.round(v+(255-v)*amt) : Math.round(v*(1+amt));
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1).padStart(6,'0');
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function inBounds(x,y){ return x>=0&&y>=0&&x<MAP_W&&y<MAP_H; }
function tileAt(x,y){ return inBounds(x,y)?map[y][x]:T.TREE; }
function walkable(x,y){ return WALKABLE.has(tileAt(x,y)) && !blockingEntityAt(x,y); }
function biomeAt(x,y){
  if(inBounds(x,y) && biomeMap[y][x]) return biomeMap[y][x];
  let best=null,bd=1e9;
  for(const b of BIOMES){ const d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
  return best;
}

function buildWorld(){
  const rng=mulberry32(20261104);
  map=[]; biomeMap=[];
  for(let y=0;y<MAP_H;y++){ map.push(new Array(MAP_W).fill(T.GRASS)); biomeMap.push(new Array(MAP_W).fill(null)); }

  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) map[y][x]=T.TREE;
  }

  for(let y=2;y<MAP_H-2;y++)for(let x=2;x<MAP_W-2;x++){
    let best=null,bd=1e9;
    for(const b of BIOMES){ const d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
    if(!best) continue;
    if(bd>best.r){ biomeMap[y][x]=null; continue; }
    biomeMap[y][x]=best;
    const rel=bd/best.r;
    const r=rng();
    switch(best.key){
      case 'plains': map[y][x]= r<.72?T.TALL:T.GRASS; break;
      case 'forest': map[y][x]= (rel>.72||r<.38)?T.TREE:T.TALL; break;
      case 'lake':   map[y][x]= rel<.55?T.WATER : rel<.78?T.SAND : T.TALL; break;
      case 'volcano':map[y][x]= rel<.34?T.LAVA : rel<.6?T.ROCK : (r<.28?T.ROCK:T.TALL); break;
      case 'snow':   map[y][x]= rel<.85?T.SNOW:T.TALL; break;
      case 'desert': map[y][x]= r<.18?T.TALL:T.SAND; break;
      case 'ruins':  map[y][x]= r<.2?T.ROCK:T.RUIN; break;
      case 'ridge':  map[y][x]= r<.4?T.ROCK : (r<.62?T.TALL:T.PATH); break;
    }
  }

  for(let y=HUB.y-4;y<=HUB.y+4;y++)for(let x=HUB.x-4;x<=HUB.x+4;x++){
    if(!inBounds(x,y)) continue;
    if(x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) continue;
    map[y][x]=T.PATH; biomeMap[y][x]=null;
  }

  const carveTo=(tx,ty)=>{
    let x=HUB.x, y=HUB.y;
    while(x!==tx){ x+=Math.sign(tx-x); if(inBounds(x,y)&&x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ map[y][x]=T.PATH; biomeMap[y][x]=null; } }
    while(y!==ty){ y+=Math.sign(ty-y); if(inBounds(x,y)&&x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ map[y][x]=T.PATH; biomeMap[y][x]=null; } }
  };
  BIOMES.forEach(b=>carveTo(b.cx,b.cy));
}

/* ===================== 数值 ===================== */
function stageScale(stage){ return 1+stage*0.18; }
/* 等级对数值的影响：Lv.20 为基准 1.0，上限 1.55 */
function lvScale(lv){ return Math.max(.7, Math.min(1.55, 1+((lv||20)-20)*0.012)); }
/* 等级对 HP 的影响更明显（Lv.20 为基准 1.0） */
function lvHpScale(lv){ return Math.max(.78, Math.min(1.85, 1+((lv||20)-20)*0.022)); }

/* 技能随等级解锁：撞击(1) / 本系轻招(1) / 本系中招(8) / 本系重招(16) */
const MOVE_LV=[1,8,16];
function movesFor(s,lv){
  const L=lv||20;
  const pool=TYPE_MOVES[s.type]||[];
  const list=[{name:'撞击',power:40,acc:100,type:'none',lv:1}];
  pool.forEach((m,i)=>{
    const need=MOVE_LV[i]||1;
    if(L>=need) list.push({name:m.name,power:m.power,acc:m.acc,type:s.type,lv:need});
  });
  return list;
}
function buildStats(species,nature,stage,lv){
  const sc=stageScale(stage)*lvScale(lv);
  const hpSc=stageScale(stage)*lvHpScale(lv);
  let hp=(species.base.hp*2+60)*hpSc, atk=species.base.atk*sc, def=species.base.def*sc, spd=species.base.spd*sc;
  const apply=(s,m)=>{ if(s==='atk')atk*=m; else if(s==='def')def*=m; else if(s==='spd')spd*=m; else if(s==='hp')hp*=m; };
  if(nature.up)apply(nature.up,1.1);
  if(nature.down)apply(nature.down,0.9);
  const t=species.talentObj;
  if(t.kind==='stat')apply(t.stat,t.mult);
  if(species.ability.kind==='bulk')def*=1.1;
  if(species.ability.kind==='swift')spd*=1.1;
  return {hp:Math.floor(hp),atk:Math.floor(atk),def:Math.floor(def),spd:Math.floor(spd)};
}
function buildFighter(species,stage,nature,lv){
  const L=lv||20;
  const stats=buildStats(species,nature,stage,L);
  return {species,stage,nature,lv:L,name:species.stages[stage],stats,hp:stats.hp,maxHp:stats.hp,moves:movesFor(species,L)};
}
function maxHpOf(inst){
  const s=SPIRITS.find(x=>x.id===inst.id); if(!s) return 1;
  return buildStats(s,findNature(inst.nature),inst.stage,inst.lv||20).hp;
}
function hpOf(inst){ return (inst.hp==null)?maxHpOf(inst):Math.max(0,Math.min(inst.hp,maxHpOf(inst))); }
function fighterFromInstance(inst){
  const s=SPIRITS.find(x=>x.id===inst.id);
  const f=buildFighter(s,inst.stage,findNature(inst.nature),inst.lv||20);
  if(inst.hp==null||inst.hp>f.maxHp) inst.hp=f.maxHp;
  f.hp=inst.hp;
  return f;
}

/* 获得经验（会自动升级、涨上限、解锁招式）。返回变化摘要 */
function gainExp(inst,amount){
  const empty={ups:0,learned:[],gain:amount,from:0,to:0};
  if(!inst||!amount) return empty;
  const s=SPIRITS.find(x=>x.id===inst.id); if(!s) return empty;
  if(typeof inst.lv!=='number') inst.lv=20;
  if(typeof inst.exp!=='number') inst.exp=0;
  const from=inst.lv, beforeMoves=movesFor(s,inst.lv).length;
  inst.exp+=amount;
  let ups=0;
  while(inst.lv<MAX_LV && inst.exp>=expNeed(inst.lv)){
    inst.exp-=expNeed(inst.lv);
    const oldMax=maxHpOf(inst);
    inst.lv++; ups++;
    const newMax=maxHpOf(inst);
    if(inst.hp!=null) inst.hp=Math.min(newMax, inst.hp+Math.max(0,newMax-oldMax));
  }
  if(inst.lv>=MAX_LV) inst.exp=0;
  const learned=movesFor(s,inst.lv).slice(beforeMoves).map(m=>m.name);
  return {ups,learned,gain:amount,from,to:inst.lv};
}
function calcDamage(atk,def,move){
  const lvl=50;
  let base=Math.floor(((2*lvl/5+2)*move.power*(atk.stats.atk/def.stats.def))/50)+2;
  const stab=(move.type===atk.species.type)?1.5:1;
  const tm=mult(move.type,def.species.type);
  let boost=1;
  if(atk.species.ability.kind==='boost'&&move.type===atk.species.type)boost*=1.1;
  if(atk.species.talentObj.kind==='elem'&&tm===2)boost*=1.1;
  let crit=1;
  if(atk.species.talentObj.kind==='crit'&&Math.random()<.15)crit=1.5;
  const rnd=.85+Math.random()*.15;
  /* 0.62 全局伤害系数 + 单次不超过目标 52% 最大 HP，避免被一发带走、也保证战斗有来有回 */
  let dmg=Math.floor(base*stab*tm*boost*crit*rnd*0.62);
  if(tm===0) dmg=0;
  const cap=Math.max(6,Math.ceil((def.maxHp||120)*0.52));
  dmg=Math.min(dmg,cap);
  if(tm>0) dmg=Math.max(Math.round(move.power*0.1),dmg);   // 保底伤害，避免被硬抗拖成拉锯
  return {dmg:Math.max(0,dmg),tm,crit:crit>1};
}

/* ===================== 地图实体 ===================== */
function snapWalkable(x,y){
  if(!inBounds(x,y)) return {x:HUB.x,y:HUB.y};
  for(let r=0;r<16;r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const nx=x+dx, ny=y+dy;
      if(nx<2||ny<2||nx>=MAP_W-2||ny>=MAP_H-2) continue;
      if(!WALKABLE.has(tileAt(nx,ny))) continue;
      if(occupied.has(keyOf(nx,ny))) continue;
      if(reachable.size && !reachable.has(keyOf(nx,ny))) continue;
      return {x:nx,y:ny};
    }
  }
  return {x:HUB.x,y:HUB.y};
}
/* 从城镇出生点做 BFS，标记所有可行走且连通的格子 */
let reachable=new Set();
function computeReachable(){
  reachable=new Set();
  const sx=HUB.x, sy=HUB.y+2;
  if(!WALKABLE.has(tileAt(sx,sy))) return;
  const q=[{x:sx,y:sy}]; reachable.add(keyOf(sx,sy));
  while(q.length){
    const {x,y}=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, k=keyOf(nx,ny);
      if(reachable.has(k)) continue;
      if(!inBounds(nx,ny)) continue;
      if(!WALKABLE.has(tileAt(nx,ny))) continue;
      reachable.add(k); q.push({x:nx,y:ny});
    }
  }
}
function buildEntities(){
  occupied=new Set(); entities={trainers:[],items:[],heal:null};
  computeReachable();
  const healPos=snapWalkable(HUB.x-1,HUB.y-1); occupied.add(keyOf(healPos.x,healPos.y));
  entities.heal={x:healPos.x,y:healPos.y,emoji:'🏥'};
  TRAINER_DEFS.forEach(def=>{
    const b=BIOME_BY_KEY[def.key];
    const p=snapWalkable(b.cx+2,b.cy+2); occupied.add(keyOf(p.x,p.y));
    const lead=SPIRITS.find(x=>x.id===def.pool[0]);
    const tint=(ART_TYPE[lead&&lead.type]||ART_TYPE.dragon).c;
    entities.trainers.push({key:def.key,name:def.name,emoji:def.emoji,pool:def.pool,stage:def.stage,boss:!!def.boss,
      color:def.cloth,cloth:def.cloth,cloth2:def.cloth2,hair:def.hair,acc:def.acc,
      x:p.x,y:p.y,defeated:game.defeated.includes(def.key)});
  });
  const spots=[];
  BIOMES.forEach(b=>{ spots.push([b.cx-2,b.cy-2]); spots.push([b.cx+2,b.cy-3]); });
  spots.push([HUB.x+3,HUB.y+2]); spots.push([HUB.x-3,HUB.y+3]);
  const kinds=['balls','candy','stone','balls','candy','stone','balls','candy','stone','balls','candy','stone','balls','candy','stone','balls','candy','stone'];
  entities.items=[];
  spots.forEach((sp,i)=>{
    const p=snapWalkable(sp[0],sp[1]); occupied.add(keyOf(p.x,p.y));
    entities.items.push({x:p.x,y:p.y,kind:kinds[i%kinds.length],taken:false,emoji:'🔴'});
  });
}
function blockingEntityAt(x,y){
  return entities.trainers.some(t=>!t.defeated&&t.x===x&&t.y===y);
}

function tryMove(dx,dy){
  if(mode!=='overworld'||moving) return;
  if(!collection.length){ toast('先选择你的初始伙伴'); return; }
  const nx=player.x+dx, ny=player.y+dy;
  if(!inBounds(nx,ny)) return;
  if(!WALKABLE.has(tileAt(nx,ny))) return;
  const trainer=entities.trainers.find(t=>!t.defeated&&t.x===nx&&t.y===ny);
  if(trainer){ startTrainerBattle(trainer); return; }
  moveTo(nx,ny);
}
function moveTo(nx,ny){
  moving=true;
  player.x=nx; player.y=ny;
  renderPlayer(); updateCamera(); updateBiomeTag();
  setTimeout(()=>{ moving=false; onStep(); },110);
}
function onStep(){
  saveGame();
  const it=entities.items.find(o=>!o.taken&&o.x===player.x&&o.y===player.y);
  if(it){
    it.taken=true; renderEntities();
    if(it.kind==='balls'){ game.balls+=3; toast('🎒 捡到 精灵球 ×3'); }
    else if(it.kind==='candy'){ game.candy++; toast('🍬 捡到 亲密度糖果 ×1'); }
    else { game.stone++; toast('💎 捡到 进化石 ×1'); }
    saveGame(); updateHUD();
    return;
  }
  if(entities.heal&&entities.heal.x===player.x&&entities.heal.y===player.y){
    healParty(); toast('🏥 队伍已完全恢复！'); return;
  }
  const code=tileAt(player.x,player.y);
  const chance=ENC_CHANCE[code]||0;
  if(chance>0 && Math.random()<chance){ startWildBattle(); return; }
}
function healParty(){
  collection.forEach(c=>{ c.hp=maxHpOf(c); });
  saveColl(); updateHUD();
}
function setActive(i){
  if(!collection[i]) return;
  if(hpOf(collection[i])<=0){ toast('这只精灵已经失去战斗力，去 🏥 恢复吧'); return; }
  activeIdx=i; renderParty();
}

}
function resetFx(){
  pfItems=[]; fxParts=[]; shakeLeft=0; shakeAmp=0;
  const sc=document.getElementById('bScene'); if(sc) sc.style.transform='';
  if(pfCtx) pfCtx.clearRect(0,0,FXW,FXH);
  if(fxCtx) fxCtx.clearRect(0,0,FXW,FXH);
  document.body.classList.remove('hitstop');
  fxPaused=false;
}
async function ensurePFX(){
  if(pfState==='ready') return pfCore;
  if(pfState==='failed') return null;
  if(pfPromise) return pfPromise;
  pfState='loading';
  pfPromise=(async()=>{
    try{
      const core=await import(PF_BASE+'core/index.js');
      pfCore=core;
      pfFrame=core.createFrame(FXW,FXH);
      pfImg=new ImageData(FXW,FXH);
      pfState='ready';
      return core;
    }catch(e){
      pfState='failed';
      console.warn('[pixelfx] 无法加载，已切换为内置像素特效：',e&&e.message);
      return null;
    }
  })();
  return pfPromise;
}
async function pfLoad(id){
  if(pfMods[id]) return pfMods[id];
  const mod=await import(PF_BASE+'fx/'+id+'.js');
  pfMods[id]=mod;
  return mod;
}
/* 在画布坐标 pos 处播放一个 pixelfx 特效 */
function pfAt(id,pos,opt){
  opt=opt||{};
  if(pfState==='failed') return false;
  ensurePFX();
  if(pfState!=='ready') return false;
  (async()=>{
    try{
      const mod=await pfLoad(id);
      if(pfState!=='ready') return;
      const fx=pfCore.createFx(mod,{
        x:Math.round(pos.x), y:Math.round(pos.y),
        flip:!!opt.flip,
        palette:opt.palette||PAL.none,
        seed:(Math.random()*99999)|0
      });
      pfItems.push(fx);
      kickLoop();
    }catch(e){/* 单个特效失败不影响游戏 */}
  })();
  return true;
}
/* 内置粒子（始终可用，作为底噪与降级方案） */
function burstPixels(x,y,pal,n,power){
  power=power||1;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(50+Math.random()*190)*power;
    fxParts.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,
      life:0,ttl:.26+Math.random()*.44,
      r:1+((Math.random()*2)|0),
      c:pal[3+((Math.random()*4)|0)]||'#fff',g:430
    });
  }
  kickLoop();
}
function kickLoop(){
  if(loopRAF) return;
  const scr=document.getElementById('battleScreen');
  if(!scr||scr.hidden) return;
  loopLast=0;
  loopRAF=requestAnimationFrame(fxTick);
}
function fxTick(ts){
  const dt=loopLast?Math.min(.05,(ts-loopLast)/1000):.016;
  loopLast=ts;

  /* 震屏 */
  const scene=document.getElementById('bScene');
  if(shakeLeft>0){
    shakeLeft-=dt;
    const k=Math.max(0,shakeLeft);
    if(scene) scene.style.transform=
      `translate(${(Math.random()-.5)*2*shakeAmp*k*3.4}px,${(Math.random()-.5)*2*shakeAmp*k*3.4}px)`;
    if(shakeLeft<=0&&scene) scene.style.transform='';
  }

  if(!fxPaused){
    if(fxCtx){
      fxCtx.clearRect(0,0,FXW,FXH);
      for(let i=fxParts.length-1;i>=0;i--){
        const p=fxParts[i]; p.life+=dt;
        if(p.life>=p.ttl){ fxParts.splice(i,1); continue; }
        p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.985;
        const k=1-p.life/p.ttl, sz=Math.max(1,Math.round(p.r*k+1));
        fxCtx.globalAlpha=Math.max(0,k);
        fxCtx.fillStyle=p.c;
        fxCtx.fillRect(Math.round(p.x),Math.round(p.y),sz,sz);
      }
      fxCtx.globalAlpha=1;
    }
    if(pfState==='ready'&&pfItems.length){
      const c=pfCore;
      c.clearFrame(pfFrame);
      for(const fx of pfItems) fx.draw(pfFrame,'back');
      for(const fx of pfItems) fx.draw(pfFrame,'front');
      c.composite(pfFrame,pfImg.data,null);
      if(pfCtx) pfCtx.putImageData(pfImg,0,0);
      for(const fx of pfItems) fx.update(dt);
      pfItems=pfItems.filter(fx=>!fx.done());
    } else if(pfCtx){
      pfCtx.clearRect(0,0,FXW,FXH);
    }
  }

  if(fxParts.length||pfItems.length||shakeLeft>0){
    loopRAF=requestAnimationFrame(fxTick);
  } else {
    loopRAF=0;
    if(pfCtx) pfCtx.clearRect(0,0,FXW,FXH);
    if(fxCtx) fxCtx.clearRect(0,0,FXW,FXH);
  }
}
function shakeCam(amp,dur){ shakeAmp=amp; shakeLeft=dur; kickLoop(); }
/* 顿帧：命中瞬间冻结画面（打感的来源） */
async function hitStop(ms){
  if(ms<=0) return;
  fxPaused=true;
  document.body.classList.add('hitstop');
  await sleep(ms);
  document.body.classList.remove('hitstop');
  fxPaused=false;
}
function elCenter(el){
  const scene=document.getElementById('bScene');
  if(!el||!scene) return {x:FXW/2,y:FXH/2};
  const r=el.getBoundingClientRect(), s=scene.getBoundingClientRect();
  if(!s.width||!s.height) return {x:FXW/2,y:FXH/2};
  return {
    x:Math.max(10,Math.min(FXW-10,(r.left+r.width/2-s.left)/s.width*FXW)),
    y:Math.max(10,Math.min(FXH-10,(r.top+r.height/2-s.top)/s.height*FXH))
  };
}
function hurtSprite(el){

function lungeSprite(el,dir){

/* 一次命中的全部表现：特效 + 粒子 + 震屏 + 顿帧 + 音效 */
async function impactFx(type,pos,power,isPlayer,r){
  const pal=PAL[type]||PAL.none;
  pfAt(FX_HIT[type]||'impacts/hit-spark',pos,{palette:pal,flip:!isPlayer});
  if(r&&r.crit) pfAt('impacts/crit-hit',pos,{palette:PAL.fire,flip:!isPlayer});
  burstPixels(pos.x,pos.y,pal,Math.round(14+16*power),power);
  shakeCam(2.6*power,.24);
  sfx(r&&r.crit?'crit':(r&&r.tm>1)?'super':(r&&r.tm>0&&r.tm<1)?'weak':'hit');
  await hitStop(Math.round(60+70*power));
}

/* ===================== 合成音效（WebAudio，无外部音频文件） ===================== */
let actx=null;
let muted=localStorage.getItem('sr_mute')==='1';
function audio(){
  if(!actx){
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state==='suspended') actx.resume().catch(()=>{});
  return actx;
}
function beep(freq,dur,type,vol,to,delay){
  const a=audio(); if(!a||muted) return;
  type=type||'square'; vol=vol==null?.12:vol; delay=delay||0;
  const t0=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t0+dur);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0+dur+.03);
}
function noiseBurst(dur,vol,freq,q,delay){
  const a=audio(); if(!a||muted) return;
  dur=dur||.16; vol=vol==null?.22:vol; freq=freq||1200; q=q||1;
  const len=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(); g.gain.value=vol;
  src.connect(f).connect(g).connect(a.destination);
  src.start(a.currentTime+(delay||0));
}
function sfx(name){
  if(muted) return;
  switch(name){
    case 'hit':     noiseBurst(.15,.24,1800,1); beep(150,.13,'sine',.16,60); break;
    case 'crit':    noiseBurst(.2,.3,3400,1.2); beep(430,.2,'square',.13,90); break;
    case 'super':   noiseBurst(.19,.27,2600,1); beep(310,.16,'square',.12,80); break;
    case 'weak':    noiseBurst(.1,.12,700,.8); break;
    case 'miss':    noiseBurst(.16,.1,5200,.7); break;
    case 'faint':   beep(320,.45,'triangle',.15,60); break;
    case 'levelup': [523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',.13,null,i*.09)); break;
    case 'catch':   [659,880,1175].forEach((f,i)=>beep(f,.18,'sine',.12,null,i*.1)); break;
    case 'coin':    beep(988,.08,'square',.1); beep(1319,.12,'square',.1,null,.08); break;
    case 'boss':    beep(90,.55,'sawtooth',.14,45); noiseBurst(.4,.16,400,.6); break;
    case 'heal':    [523,784].forEach((f,i)=>beep(f,.22,'sine',.1,null,i*.1)); break;
    case 'ui':      beep(660,.05,'sine',.07); break;
  }
}

async function bMove(idx){
  if(!B||B.over||B.busy) return;
  B.busy=true; B.menuState='moves'; renderBattleMenu();
  const pm=B.player.moves[idx];
  const em=pick(B.enemy.moves);
  const first=B.player.stats.spd>=B.enemy.stats.spd;
  const seq=first?[['p',pm],['e',em]]:[['e',em],['p',pm]];
  for(const [who,mv] of seq){
    if(!B||B.over||B.force) break;
    if(who==='p') await execMove(B.player,B.enemy,mv,true);
    else if(B) await execMove(B.enemy,B.player,mv,false);
  }
  if(B && !B.over && !B.force){ B.busy=false; B.menuState='root'; renderBattleMenu(); }
}
async function execMove(atk,def,mv,isPlayer){
  const srcEl=document.getElementById(isPlayer?'bPlayerSprite':'bEnemySprite');
  const dstEl=document.getElementById(isPlayer?'bEnemySprite':'bPlayerSprite');

  /* 起手：攻击方前冲 */
  lungeSprite(srcEl, isPlayer?1:-1);
  await sleep(120);

  if(Math.random()*100>mv.acc){
    bSetMsg(`${atk.name} 的「${mv.name}」没有命中！`);
    sfx('miss');
    await sleep(500);
    return;
  }

  const r=calcDamage(atk,def,mv);
  def.hp=Math.max(0,def.hp-r.dmg);
  const immune=r.tm===0, strong=r.tm>1, weak=r.tm>0&&r.tm<1;
  const power=immune?0:(strong?1.35:weak?.7:1)*(r.crit?1.45:1);

  /* 命中：特效 + 震动 + 顿帧 + 音效 + 受击闪烁 */
  if(!immune){
    const pos=elCenter(dstEl);
    await impactFx(mv.type,pos,power,isPlayer,r);
    hurtSprite(dstEl);
  } else {
    sfx('miss');
  }

  floatNumber(dstEl, immune?'0':'-'+r.dmg, r);

  let msg=`${atk.name} 使用「${mv.name}」，造成 ${r.dmg} 伤害`;
  if(strong)msg+=' · 效果拔群！';
  else if(weak)msg+=' · 效果不佳…';
  else if(immune)msg+=' · 没有效果…';
  if(r.crit)msg+=' · 暴击！';
  bSetMsg(msg);
  updateBattleUI();
  await sleep(immune?460:520);
  if(def.hp<=0) await onFaint(isPlayer?'enemy':'player');
}

  const d=document.createElement('div'); d.className='float-dmg'; d.textContent=text; d.style.color=color;
  d.style.left=(rc.left+rc.width/2)+'px'; d.style.top=(rc.top+rc.height/2)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),850);

async function onFaint(who){
  if(!B) return;
  if(who==='enemy'){
    const el=document.getElementById('bEnemySprite');
    el.classList.add('faint');
    pfAt('spawn/poof',elCenter(el),{palette:PAL.dark});
    burstPixels(elCenter(el).x,elCenter(el).y,PAL.none,16,1.1);
    sfx('faint');
    await sleep(560);
    /* 先结算经验，再处理换人/胜利 */
    await awardExp(B.enemy,B.tier);
    if(!B) return;
    if(B.isTrainer && B.enemyTeam && B.enemyIdx<B.enemyTeam.length-1){
      B.enemyIdx++;
      bSetMsg(`${B.trainerName} 派出了 ${B.enemyTeam[B.enemyIdx].name}！`);
      await sleep(700);
      if(!B) return;
      B.enemy=B.enemyTeam[B.enemyIdx];
      el.classList.remove('faint');
      updateBattleUI();
      return;
    }
    el.classList.remove('faint');
    await winBattle();
  } else {
    const el=document.getElementById('bPlayerSprite');
    el.classList.add('faint'); sfx('faint');
    const inst=collection[B.activeIdx];
    if(inst) inst.hp=0;
    saveColl();
    const alive=collection.map((c,i)=>i).filter(i=>i!==B.activeIdx&&hpOf(collection[i])>0);
    if(alive.length>0){
      B.busy=true; B.force=true; B.menuState='party';
      bSetMsg(`${B.player.name} 倒下了！请选择下一只精灵。`);
      renderParty(); renderBattleMenu();
      setTimeout(()=>el.classList.remove('faint'),400);
    } else {
      await loseBattle();
    }
  }
}

/* 经验结算：出战精灵全额，队伍其余存活精灵获得 50%（经验共享）
   经验量 = 种族基础经验 × 敌方等级 × 层级倍率 × 等级差修正 */
function expGain(enemy,inst,tierKey){
  const t=TIERS[tierKey]||TIERS.wild;
  const base=baseExp(enemy.species);
  const diff=((inst&&inst.lv)||20)-(enemy.lv||20);
  const k=Math.max(.35,Math.min(1.3,1-diff*.03));   // 打低级怪收益递减，越级挑战加成
  return Math.max(1,Math.round(base*enemy.lv*0.45*t.mult*k));
}
async function awardExp(enemy,tierKey){
  if(!B||!enemy) return;
  const t=TIERS[tierKey]||TIERS.wild;
  const inst=collection[B.activeIdx];
  const gain=expGain(enemy,inst,tierKey);
  if(inst) inst.hp=B.player.hp;
  const r=gainExp(inst,gain);

  const side=[];
  collection.forEach((c,i)=>{
    if(i===B.activeIdx) return;
    if(hpOf(c)<=0) return;
    const rr=gainExp(c,Math.max(1,Math.round(gain*0.5)));
    if(rr.ups){ const sp=SPIRITS.find(x=>x.id===c.id); side.push(`${sp.stages[c.stage]} Lv.${c.lv}`); }
  });
  saveColl();

  if(inst&&B){
    B.player=fighterFromInstance(inst);
    B.player.hp=inst.hp;
  }
  updateBattleUI();

  const spName=inst?SPIRITS.find(x=>x.id===inst.id).stages[inst.stage]:'队伍';
  const bonus=tierKey==='boss'?`（霸主 ×${t.mult}）`:tierKey==='rare'?`（稀有 ×${t.mult}）`:tierKey==='trainer'?`（训练家 ×${t.mult}）`:'';
  bSetMsg(`${spName} 获得了 ${gain} 点经验值！${bonus}`);
  await sleep(r.ups?820:520);

  if(r.ups){
    sfx('levelup');
    const pel=document.getElementById('bPlayerSprite');
    pfAt('ui/level-up',elCenter(pel),{palette:PAL.electric});
    burstPixels(elCenter(pel).x,elCenter(pel).y,PAL.light,22,1.1);
    lvBanner(`${spName} 升级！Lv.${inst.lv}`);
    updateBattleUI();
    await sleep(1050);
    if(r.learned.length&&B) bSetMsg(`Lv.${inst.lv}！学会了新招式：${r.learned.join('、')}`);
    await sleep(r.learned.length?780:0);
  }
  if(side.length) toast('经验共享 → '+side.join('、'));
}
function bSwitch(i){
  if(!B||B.over) return;
  if(B.busy&&!B.force) return;
  if(i===B.activeIdx) return;
  const inst=collection[i]; if(!inst) return;
  if(hpOf(inst)<=0){ bSetMsg('这只精灵已经没有战斗力了！'); return; }
  const cur=collection[B.activeIdx]; if(cur) cur.hp=B.player.hp;
  B.activeIdx=i; activeIdx=i;
  B.player=fighterFromInstance(inst);
  updateBattleUI();
  if(B.force){
    B.force=false; B.busy=false; B.menuState='root';
    bSetMsg(`上吧，${B.player.name}！`); renderBattleMenu(); renderParty();
  } else {
    B.busy=true; bSetMsg(`回来吧！上吧，${B.player.name}！`);
    setTimeout(async()=>{
      if(!B) return;
      await enemyFreeAttack();
      if(B && !B.over){ B.busy=false; B.menuState='root'; renderBattleMenu(); }
    },650);
  }
}
async function enemyFreeAttack(){
  if(!B||B.over) return;
  await execMove(B.enemy,B.player,pick(B.enemy.moves),false);
}
async function bCatch(){
  if(!B||B.over||B.busy) return;
  if(B.isTrainer){ bSetMsg('不能捕捉别人的精灵！'); return; }
  if(game.balls<=0){ bSetMsg('精灵球用完了！去草丛或道具球找找吧。'); return; }
  const owned=collection.some(c=>c.id===B.enemy.species.id);
  if(!owned && collection.length>=MAX_PARTY){ bSetMsg('队伍已满（6 只），无法再捕捉！'); return; }
  B.busy=true; B.menuState='root';
  game.balls--; saveGame(); updateHUD();
  const ball=document.getElementById('bBall');
  ball.innerHTML=markSVG('ball');
  ball.classList.remove('throw'); void ball.offsetWidth; ball.classList.add('throw');
  bSetMsg('你投出了精灵球！');
  sfx('ui');
  renderBattleMenu();
  await sleep(850);
  if(!B||B.over) return;
  const ratio=B.enemy.hp/B.enemy.maxHp;
  let chance=0.20+(1-ratio)*0.62;
  if(B.enemy.stage>=2) chance*=0.85;
  if(Math.random()<chance){
    B.over=true;
    const nm=B.enemy.name;
    sfx('catch');
    pfAt('ui/achievement',elCenter(document.getElementById('bEnemySprite')),{palette:PAL.light});
    const inst={id:B.enemy.species.id,stage:B.enemy.stage,bond:1,count:1,
      nature:B.enemy.nature.name,hp:B.enemy.hp,lv:B.enemy.lv,exp:0};
    const ex=collection.find(c=>c.id===inst.id);
    if(ex){ ex.count++; ex.bond=Math.min(MAX_BOND,ex.bond+1); }
    else collection.push(inst);
    saveColl();
    bSetMsg(`太好了！${nm}（Lv.${inst.lv}）被抓住了！`);
    await sleep(1300);
    if(B) closeBattle();
    toast(`🎉 收服了 ${nm} · Lv.${inst.lv}`);
  } else {
    bSetMsg('可恶！它从精灵球里挣脱了！');
    await sleep(850);
    if(!B||B.over) return;
    await enemyFreeAttack();
    if(B&&!B.over){ B.busy=false; renderBattleMenu(); }
  }
}
async function bFlee(){
  if(!B||B.over||B.busy) return;
  if(B.isTrainer){ bSetMsg('不能从训练家对战中逃走！'); return; }
  B.busy=true;
  const chance=Math.min(.95, Math.max(.3, .5+(B.player.stats.spd-B.enemy.stats.spd)/160));
  if(Math.random()<chance){
    bSetMsg('成功逃走了！');
    await sleep(700);
    if(B) closeBattle();
  } else {
    bSetMsg('没能逃掉！');
    await sleep(650);
    if(!B||B.over) return;
    await enemyFreeAttack();
    if(B&&!B.over){ B.busy=false; renderBattleMenu(); }
  }
}
async function winBattle(){
  if(!B) return;
  B.over=true; B.busy=true;
  const inst=collection[B.activeIdx];
  if(inst){ inst.hp=B.player.hp; inst.bond=Math.min(MAX_BOND,(inst.bond||0)+2); }
  saveColl();
  bSetMsg('战斗胜利！羁绊提升了。');
  sfx('coin');
  if(B.isTrainer){
    const t=B.trainerRef;
    if(t){
      t.defeated=true;
      if(!game.defeated.includes(t.key)) game.defeated.push(t.key);
    }
    game.stone++;
    saveGame();
    renderEntities();
    toast('🏆 战胜训练家！获得 进化石 ×1');
    await sleep(900);
  }
  if(B.tier==='boss'){
    game.stone++; game.candy++;
    saveGame();
    toast('👑 击败霸主！获得 进化石 ×1、亲密度糖果 ×1');
    await sleep(700);
  }
  await sleep(600);
  if(B) closeBattle();
  updateHUD();
}
async function loseBattle(){
  if(!B) return;
  B.over=true; B.busy=true;
  bSetMsg('你的精灵全部失去了战斗力…眼前一黑！');
  await sleep(1200);
  collection.forEach(c=>{ c.hp=maxHpOf(c); });
  saveColl();
  B=null;
  ['bPlayerSprite','bEnemySprite'].forEach(id=>{const e=document.getElementById(id); if(e) e.classList.remove('faint','hit','hurt','lunge-r','lunge-l');});

  mode='overworld';
  player.x=HUB.x; player.y=HUB.y+2;
  renderPlayer(); updateCamera(); updateBiomeTag();
  updateHUD();

}

/* ===================== 道具 ===================== */
function useItem(kind){
  if(kind==='candy'&&game.candy<=0) return toast('没有亲密度糖果');
  if(kind==='stone'&&game.stone<=0) return toast('没有进化石');
  if(!collection.some(c=>hpOf(c)>0)) return toast('没有可使用的精灵');
  let target=null,minBond=999;
  collection.forEach(c=>{ if(hpOf(c)>0&&c.bond<MAX_BOND&&c.bond<minBond){ minBond=c.bond; target=c; } });
  if(!target) return toast('所有精灵羁绊已满');
  const amt=kind==='candy'?2:3;
  if(kind==='candy')game.candy--; else game.stone--;
  target.bond=Math.min(MAX_BOND,target.bond+amt);
  saveGame(); saveColl(); updateHUD();
  const s=SPIRITS.find(x=>x.id===target.id);
  toast(`✨ ${s.stages[target.stage]} 羁绊 +${amt}（${target.bond}/${MAX_BOND}）`);
}

/* ===================== 进化 ===================== */
function evolveInst(idx){
  const inst=collection[idx]; if(!inst) return;
  if(inst.stage>=2){ toast('已是最终形态'); return; }
  const need=EVO_BOND[inst.stage+1];
  if(inst.bond<need){ toast(`羁绊不足，需要 ${need}`); return; }
  const s=SPIRITS.find(x=>x.id===inst.id);
  inst.stage++;
  inst.hp=maxHpOf(inst);
  saveColl(); updateHUD();
  toast(`🦋 进化！${s.stages[inst.stage-1]} → ${s.stages[inst.stage]}`);
  closeModal(); openDetail(s.id, idx);
}

  document.getElementById('starterChoices').innerHTML=opts.map(s=>{
    const t=TYPES[s.type];
    return `<div class="starter" onclick="pickStarter('${s.id}')">
      <div class="sm">${spiritSVG(s.id,0,{static:true})}</div>
      <div class="sn">${s.stages[0]} <span class="ty" style="background:${t.color};font-size:10px">${t.name}</span></div>
      <div class="sd">${s.desc}<br><span style="color:var(--txt-dim)">最终进化：${s.stages[2]}</span></div>
    </div>`;
  }).join('');
  document.getElementById('starterOverlay').classList.add('show');
}
function pickStarter(id){
  const s=SPIRITS.find(x=>x.id===id);
  const inst={id,stage:0,bond:3,count:1,nature:randomNature().name,hp:null,lv:10,exp:0};
  inst.hp=maxHpOf(inst);
  collection.push(inst); activeIdx=collection.length-1;
  saveColl(); updateHUD();
  document.getElementById('starterOverlay').classList.remove('show');
  toast(`✨ ${s.stages[0]} 加入了你的队伍！`);
  renderPlayer(); updateCamera();
}

/* ===================== 输入 ===================== */
window.addEventListener('keydown',e=>{
  if(mode!=='overworld') return;
  if(document.getElementById('overlay').classList.contains('show')) return;
  if(document.getElementById('starterOverlay').classList.contains('show')) return;
  let dx=0,dy=0; const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')dy=-1;
  else if(k==='arrowdown'||k==='s')dy=1;
  else if(k==='arrowleft'||k==='a')dx=-1;
  else if(k==='arrowright'||k==='d')dx=1;
  if(dx||dy){ e.preventDefault(); tryMove(dx,dy); }
});
window.addEventListener('resize',()=>{ if(map.length) updateCamera(); });

/* ===================== 手杆（虚拟摇杆）操控 ===================== */
const joy={el:null,knob:null,active:false,dx:0,dy:0,raf:0};
function joyInit(){
  joy.el=document.getElementById('joystick'); joy.knob=document.getElementById('joyKnob');
  if(!joy.el) return;
  const pt=(e)=> (e.touches&&e.touches[0])?{x:e.touches[0].clientX,y:e.touches[0].clientY}
    :(e.changedTouches&&e.changedTouches[0])?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}
    :{x:e.clientX,y:e.clientY};
  const apply=(cx,cy)=>{
    const r=joy.el.getBoundingClientRect();
    let x=cx-(r.left+r.width/2), y=cy-(r.top+r.height/2);
    const rad=r.width/2-joy.knob.offsetWidth/2;
    const d=Math.hypot(x,y)||1, k=Math.min(d,rad)/d;
    joy.knob.style.transform=`translate(${x*k}px,${y*k}px)`;
    const dead=r.width*0.16;
    if(d<dead){ joy.dx=0; joy.dy=0; }
    else if(Math.abs(x)>=Math.abs(y)){ joy.dx=x>0?1:-1; joy.dy=0; }
    else { joy.dx=0; joy.dy=y>0?1:-1; }
  };
  const start=(e)=>{ if(mode!=='overworld') return; e.preventDefault(); joy.active=true; joy.el.classList.add('on'); const p=pt(e); apply(p.x,p.y); if(!joy.raf) joy.raf=requestAnimationFrame(joyLoop); };
  const move=(e)=>{ if(!joy.active) return; e.preventDefault(); const p=pt(e); apply(p.x,p.y); };
  const end=()=>{ if(!joy.active) return; joy.active=false; joy.el.classList.remove('on'); joy.dx=0; joy.dy=0; joy.knob.style.transform='translate(0,0)'; };
  joy.el.addEventListener('touchstart',start,{passive:false});
  joy.el.addEventListener('touchmove',move,{passive:false});
  joy.el.addEventListener('touchend',end);
  joy.el.addEventListener('touchcancel',end);
  joy.el.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}
function joyLoop(){
  if(!joy.active){ joy.raf=0; return; }
  if(joy.dx||joy.dy) tryMove(joy.dx,joy.dy);   // tryMove 自带 moving 锁，仅在可移动时步进
  joy.raf=requestAnimationFrame(joyLoop);
}

/* ===================== 启动 ===================== */
function boot(){
  loadAll();
  document.getElementById('player').innerHTML=charSVG({cloth:'#D24BA8',cloth2:'#922E72',hair:'#2A2A3A',acc:'hero',mini:true});
  buildWorld();
  buildEntities();
  buildTileDOM();
  joyInit();
  if(!inBounds(player.x,player.y)||!WALKABLE.has(tileAt(player.x,player.y))||!reachable.has(keyOf(player.x,player.y))){
    player.x=HUB.x; player.y=HUB.y+2;
  }
  renderEntities(); renderPlayer(); updateCamera(); updateBiomeTag();
  updateHUD();
  if(!collection.length) showStarter();
}
boot();
</script>
