    this.scene.resume('world');
    this.scene.stop();
    if (w && w.closeUI) w.closeUI();
  };

  // 不描边的小字（格子内文字用，描边会糊成一团）
  UIScene.prototype.utext = function(x,y,text,size,color,origin,depth){
    var t = this.add.text(x,y,text,{
      fontFamily:FONT, fontSize:size+'px', color:color||'#c9d6ff'
    }).setDepth(depth||7);
    t.setOrigin(origin===undefined?0.5:origin, 0.5);
    return this.track(t);
  };
  // 透明点击区
  UIScene.prototype.hit = function(x,y,w,h,fn){
    var r = this.add.rectangle(x+w/2, y+h/2, w, h, 0x000000, 0.001)
      .setDepth(40).setInteractive({ useHandCursor:true });
    r.on('pointerup', function(){ AUDIO.sfx('click'); fn(); });
    return this.track(r);
  };

  /* ---------------- 主渲染 ---------------- */
  UIScene.prototype.render = function(){
    var w = this.scale.width, h = this.scale.height;
    this.clearUI();
    var fz = this.fz.bind(this);

    // 遮罩：吃掉点击，避免穿透到下面的世界
    this.track(this.add.rectangle(w/2, h/2, w, h, 0x04060f, 0.88).setDepth(1).setInteractive());

    var pad = Math.max(10, Math.min(w,h)*0.028);
    var P = { x:pad, y:pad, w:w-pad*2, h:h-pad*2 };
    this.panel(P.x, P.y, P.w, P.h, 2);

    var ip    = Math.max(10, Math.min(w,h)*0.026);
    var headH = Math.max(34, Math.round(fz(36)));
    var footH = Math.max(36, Math.round(fz(42)));
    var gap   = Math.max(6, Math.round(Math.min(w,h)*0.015));

    var head = { x:P.x+ip, y:P.y+ip, w:P.w-ip*2, h:headH };
    var foot = { x:P.x+ip, y:P.y+P.h-ip-footH, w:P.w-ip*2, h:footH };
    var body = { x:P.x+ip, y:head.y+headH+gap, w:P.w-ip*2,
                 h:Math.max(60, foot.y-gap-(head.y+headH+gap)) };
    this.gap = gap;

    if (this.page === 'dex' && this.selId)  return this.renderDexDetail(head, body, foot);
    if (this.page === 'dex')                return this.renderDex(head, body, foot);
    if (this.page === 'team' && this.selMon !== null) return this.renderMonDetail(head, body, foot);
    if (this.page === 'team')               return this.renderTeam(head, body, foot);
    if (this.page === 'badge')              return this.renderBadge(head, body, foot);
    return this.renderBag(head, body, foot);
  };

  // 页头：标题 + 副标题 + 关闭（或返回）
  UIScene.prototype.header = function(head, title, sub, backFn){
    var fz = this.fz.bind(this);
    var t = this.label(head.x, head.y+head.h*0.5, title, fz(19), '#eaf0ff', 6);
    if (sub) this.label(head.x + t.width + fz(13), head.y+head.h*0.5+1, sub, fz(12), '#9fb0dd', 6);
    var bh = Math.min(head.h, Math.max(30, Math.round(fz(34))));
    var bw = bh + Math.round(fz(16));
    var label = backFn ? '← 返回' : '✕';
    this.makeBtn(head.x+head.w-bw, head.y+(head.h-bh)/2, bw, bh, label,
      backFn || this.close.bind(this), { size: fz(backFn?13:16) });
  };

  /* ---------------- 图鉴：列表 ---------------- */
  UIScene.prototype.renderDex = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    var tok = ++this._tok;
    var dt = dexTotals();
    this.header(head, '精灵图鉴', '收服 '+dt.got+'/'+dt.total+' · 见过 '+dt.seen+'/'+dt.total);

    var cols = body.w > 720 ? 7 : body.w > 560 ? 6 : body.w > 430 ? 5 : 4;
    var gap  = Math.max(5, Math.round(Math.min(body.w,body.h)*0.012));
    var cellW = (body.w - gap*(cols-1)) / cols;
    var cellH = cellW * 1.16;
    var rows  = Math.max(2, Math.floor((body.h + gap) / (cellH + gap)));
    var per   = cols * rows;
    var pages = Math.max(1, Math.ceil(SR.SPIRITS.length / per));
    if (this.dexPage >= pages) this.dexPage = pages - 1;
    if (this.dexPage < 0) this.dexPage = 0;

    var start = this.dexPage * per;
    var list  = SR.SPIRITS.slice(start, start + per);

    // 先加载本页立绘，避免出现空白格
    var keys = [];
    list.forEach(function(sp){
      var d = dexSum(sp.id);
      var st = d.topGot >= 0 ? d.topGot : (d.topSee >= 0 ? d.topSee : -1);
      if (st >= 0) keys.push(sp.id + '_' + st);
    });
    await Promise.all(keys.map(function(k){ return loadTex(self, k); }));
    if (tok !== this._tok) return;

    var cellH2 = Math.min(cellH, (body.h - gap*(rows-1)) / rows);
    for (var i=0;i<list.length;i++){
      var sp = list[i], d = dexSum(sp.id);
      var c = i % cols, r = Math.floor(i / cols);
      var cx = body.x + c*(cellW+gap);
      var cy = body.y + r*(cellH2+gap);
      var known = d.seeCount > 0, got = d.gotCount > 0;

      var g = this.add.graphics().setDepth(5);
      g.fillStyle(got ? 0x1c2f52 : 0x141a2e, 0.96);
      g.fillRoundedRect(cx, cy, cellW, cellH2, 7);
      g.lineStyle(2, got ? 0x5a86d6 : (known ? 0x46557f : 0x2b3352), 0.92);
      g.strokeRoundedRect(cx, cy, cellW, cellH2, 7);
      if (got){ g.fillStyle(0xffffff, 0.10); g.fillRoundedRect(cx+2, cy+2, cellW-4, cellH2*0.16, 6); }
      this.track(g);

      var artSize = cellW * 0.58;
      var artY = cy + cellH2*0.44;
      var st = got ? d.topGot : (known ? d.topSee : -1);
      if (st >= 0 && this.textures.exists(sp.id+'_'+st)){
        var im = this.add.image(cx+cellW/2, artY, sp.id+'_'+st).setDepth(6);
        im.setScale(artSize/256);
        if (!got){   // 见过但未收服：暗色剪影
          if (im.setTintFill) im.setTintFill(0x101a30); else im.setTint(0x18203a);
        }
        this.track(im);
      } else {
        this.utext(cx+cellW/2, artY, '?', Math.round(artSize*0.5), '#37436b');
      }

      var no = String(start+i+1);
      while (no.length < 2) no = '0'+no;
      this.utext(cx+cellW*0.12, cy+cellH2*0.085, 'No.'+no, Math.max(8, Math.round(fz(9))),
                 got ? '#8fb0e8' : '#5a6690', 0);
      this.utext(cx+cellW/2, cy+cellH2*0.845, got ? sp.stages[d.topGot] : '？？？',
                 Math.max(9, Math.round(fz(11))), got ? '#dfe8ff' : '#6b78a0');
      // 三阶进度小点
      for (var q=0;q<3;q++){
        var dotC = d.got[q] ? 0x74d4a0 : (d.see[q] ? 0x5a86d6 : 0x2b3352);
        var dg = this.add.graphics().setDepth(7);
        dg.fillStyle(dotC, 1);
        dg.fillCircle(cx + cellW*0.36 + q*Math.max(5, cellW*0.075), cy+cellH2*0.935, Math.max(1.6, cellW*0.028));
        this.track(dg);
      }

      (function(sid, kn){
        var hx = cx, hy = cy, hw = cellW, hh = cellH2;
        self.hit(hx, hy, hw, hh, function(){
          if (!kn){ self.flashNote('还没发现过这只精灵'); return; }
          self.selId = sid; self.render();
        });
      })(sp.id, known);
    }

    // 底部：翻页
    var bw = Math.min(foot.w*0.22, fz(110));
    var bh = foot.h;
    this.makeBtn(foot.x, foot.y, bw, bh, '◀ 上一页', function(){
      if (self.dexPage > 0){ self.dexPage--; self.render(); }
    }, { size: fz(13), disabled: this.dexPage === 0 });
    this.makeBtn(foot.x+bw+gap, foot.y, Math.min(foot.w*0.2, fz(96)), bh,
      (this.dexPage+1)+' / '+pages, function(){}, { size: fz(13), disabled: true });
    this.makeBtn(foot.x+bw*2+gap*2, foot.y, bw, bh, '下一页 ▶', function(){
      if (self.dexPage < pages-1){ self.dexPage++; self.render(); }
    }, { size: fz(13), disabled: this.dexPage >= pages-1 });

    var tipW = foot.w - bw*2 - gap*2 - Math.min(foot.w*0.2, fz(96)) - gap;
    if (tipW > fz(90)){
      this.utext(foot.x+foot.w-tipW/2, foot.y+foot.h*0.5,
        '● 收服  ● 见过  ● 未知', Math.max(9, Math.round(fz(10))), '#7c88ad', 0.5);
    }
  };

  /* ---------------- 图鉴：单只详情 ---------------- */
  UIScene.prototype.renderDexDetail = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    var tok = ++this._tok;
    var sp = spOf(this.selId);
    if (!sp){ this.selId = null; return this.render(); }
    var d = dexSum(sp.id);
    var no = String(SR.SPIRITS.indexOf(sp)+1); while (no.length<2) no='0'+no;

    this.header(head, 'No.'+no+' '+sp.name, null, function(){ self.selId=null; self.render(); });

    var tall = this.mode() === 'P' || body.w < 520;
    // 立绘用「已收服的最高阶」，没有就用见过的最高阶（剪影）
    var showSt = d.topGot >= 0 ? d.topGot : Math.max(0, d.topSee);
    var isGot  = d.topGot >= 0;
    await loadTex(this, sp.id+'_'+showSt);
    if (tok !== this._tok) return;

    var artBox = tall
      ? { x:body.x+body.w*0.5-body.h*0.26, y:body.y, w:body.h*0.52, h:body.h*0.52 }
      : { x:body.x, y:body.y, w:body.w*0.34, h:Math.min(body.h*0.86, body.w*0.34) };
    var info = tall
      ? { x:body.x, y:body.y+artBox.h+this.gap*1.5, w:body.w, h:body.h-artBox.h-this.gap*1.5 }
      : { x:body.x+artBox.w+this.gap*2, y:body.y, w:body.w-artBox.w-this.gap*2, h:body.h };

    // 立绘卡
    var cg = this.add.graphics().setDepth(5);
    cg.fillStyle(0x101830, 0.9); cg.fillRoundedRect(artBox.x, artBox.y, artBox.w, artBox.h, 10);
    cg.lineStyle(2, isGot ? 0x5a86d6 : 0x40506f, 0.9);
    cg.strokeRoundedRect(artBox.x, artBox.y, artBox.w, artBox.h, 10);
    this.track(cg);
    if (this.textures.exists(sp.id+'_'+showSt)){
      var size = Math.min(artBox.w, artBox.h)*0.86;
      var im = this.add.image(artBox.x+artBox.w/2, artBox.y+artBox.h*0.5, sp.id+'_'+showSt).setDepth(6);
      im.setScale(size/256);
      if (!isGot){ if (im.setTintFill) im.setTintFill(0x121c34); else im.setTint(0x18203a); }
      this.track(im);
    }

    // 名称 / 属性
    var y = info.y;
    var lh = Math.max(16, Math.round(fz(20)));
    var nm = this.label(info.x, y+lh*0.5, isGot ? sp.stages[d.topGot] : sp.name, fz(20), '#eaf0ff', 6);
    y += lh*1.15;
    var types = sp.types || [sp.type];
    var bx = info.x;
    for (var i=0;i<types.length;i++){
      var r = this.badge(bx, y+lh*0.42, (SR.TYPES[types[i]]?SR.TYPES[types[i]].name:'—'), types[i], 8);
      bx += (r.t.width + fz(16)) + fz(6);
    }
    y += lh;
    if (!isGot) this.utext(info.x, y+lh*0.4, '尚未收服 · 显示为见过的形态', fz(11), '#7c88ad', 0);
    y += isGot ? lh*0.2 : lh*0.9;

    // 三阶进度
    var stageLine = '';
    for (var s2=0;s2<3;s2++){
      var nmS = d.got[s2] ? sp.stages[s2] : (d.see[s2] ? '？？？' : '未知');
      stageLine += (s2? '  →  ':'') + nmS;
    }
    var st = this.utext(info.x, y+lh*0.5, '形态  '+stageLine, fz(12),
                        d.gotCount ? '#9ee6b8' : '#7c88ad', 0, 6);
    st.setWordWrapWidth(info.w, true);
    y += Math.max(lh, st.height) + this.gap;

    // 图鉴描述
    var desc = isGot ? sp.desc : '收服后解锁介绍。';
    var dt2 = this.utext(info.x, 0, desc, fz(13), '#c9d6ff', 0, 6);
    dt2.setWordWrapWidth(info.w, true);
    dt2.setY(y + dt2.height*0.5);
    y += dt2.height + this.gap*1.4;

    // 基础数值
    var b = sp.base;
    var rows = [['HP', b.hp], ['攻击', b.atk], ['防御', b.def], ['速度', b.spd]];
    var cellW = (info.w - this.gap*(rows.length-1)) / rows.length;
    var barH = Math.max(5, Math.round(fz(6)));
    for (var k=0;k<rows.length;k++){
      var rx = info.x + k*(cellW+this.gap);
      this.utext(rx+cellW/2, y+lh*0.42, rows[k][0], fz(11), '#8fa0cc');
      this.utext(rx+cellW/2, y+lh*0.42+lh, String(rows[k][1]), fz(15), '#dfe8ff');
      var ratio = clamp(rows[k][1]/90, 0.05, 1);
      var bg = this.add.graphics().setDepth(6);
      var by = y+lh*0.42+lh*1.85;
      bg.fillStyle(0x1a2140, 1); bg.fillRoundedRect(rx, by, cellW, barH, barH/2);
      bg.fillStyle(0x6b8cff, 1); bg.fillRoundedRect(rx, by, Math.max(barH, cellW*ratio), barH, barH/2);
      this.track(bg);
    }
    y += lh*2.6;

    // 栖息地（从群系遇敌池反查，说明在哪能找到）
    var homes = [];
    BIOMES.forEach(function(bm){
      if (bm.pools.indexOf(sp.id) >= 0) homes.push(bm.name + (bm.rare===sp.id?'（稀有）':''));
      else if (bm.rare === sp.id) homes.push(bm.name + '（稀有）');
    });
    var homeTxt = homes.length ? homes.join('、') : '本作暂未在野外发现';
    var ht = this.utext(info.x, 0, '栖息地  '+homeTxt, fz(12),
                        homes.length ? '#9fb0dd' : '#d98f8f', 0, 6);
    ht.setWordWrapWidth(info.w, true);
    ht.setY(y + ht.height*0.5);
    y += ht.height + this.gap;

    // 底部
    this.makeBtn(foot.x, foot.y, Math.min(foot.w*0.34, fz(160)), foot.h, '← 返回图鉴', function(){
      self.selId = null; self.render();
    }, { size: fz(13) });
  };

  /* ---------------- 队伍 ---------------- */
  UIScene.prototype.renderTeam = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    var tok = ++this._tok;
    var alive = 0;
    G.party.forEach(function(c){ if (hpOf(c) > 0) alive++; });
    this.header(head, '我的队伍', G.party.length + '/' + SR.CFG.MAX_PARTY + ' · 可战斗 ' + alive);

    var keys = G.party.map(function(c){ return c.id + '_' + (c.stage||0); });
    await Promise.all(keys.map(function(k){ return loadTex(self, k); }));
    if (tok !== this._tok) return;

    var n = G.party.length;
    var cols = (this.mode() === 'P' || body.w < 520) ? 1 : 2;
    var rows = Math.ceil(Math.max(1,n) / cols);
    var gap = this.gap;
    var cw = (body.w - gap*(cols-1)) / cols;
    var ch = Math.min((body.h - gap*(rows-1)) / Math.max(1,rows), fz(96));

    for (var i=0;i<n;i++){
      var c = G.party[i], sp = spOf(c.id);
      var col = i % cols, row = Math.floor(i / cols);
      var cx = body.x + col*(cw+gap), cy = body.y + row*(ch+gap);
      var hp = hpOf(c), mh = maxHpOf(c), ratio = mh ? hp/mh : 0;
      var isActive = i === G.activeIdx;
      var fainted = hp <= 0;

      var g = this.add.graphics().setDepth(5);
      g.fillStyle(fainted ? 0x241a24 : 0x18223c, 0.96);
      g.fillRoundedRect(cx, cy, cw, ch, 9);
      g.lineStyle(2, fainted ? 0x6b3b4a : (isActive ? 0xffd166 : 0x46557f), isActive ? 1 : 0.9);
      g.strokeRoundedRect(cx, cy, cw, ch, 9);
      this.track(g);

      var artS = Math.min(ch*0.78, cw*0.26);
      if (this.textures.exists(c.id+'_'+(c.stage||0))){
        var im = this.add.image(cx + ch*0.10 + artS*0.5, cy+ch*0.5, c.id+'_'+(c.stage||0)).setDepth(6);
        im.setScale(artS/256);
        if (fainted) im.setAlpha(0.35);
        this.track(im);
      }

      var tx = cx + ch*0.10 + artS + this.gap;
      var tw = cw - (tx-cx) - this.gap;
      var nmT = this.utext(tx, cy+ch*0.24, (isActive?'▶ ':'')+sp.stages[c.stage||0], fz(14),
                           fainted ? '#a08a94' : '#eaf0ff', 0, 7);
      this.utext(tx+tw, cy+ch*0.24, 'Lv.'+c.lv, fz(12), '#9fb0dd', 1, 7);

      // HP 条
      var barY = cy+ch*0.52, barW = tw, barH = Math.max(6, Math.round(ch*0.10));
      var hg = this.add.graphics().setDepth(6);
      hg.fillStyle(0x0e1428, 1); hg.fillRoundedRect(tx, barY, barW, barH, barH/2);
      var hc = ratio > 0.5 ? 0x4ade80 : ratio > 0.2 ? 0xfbbf24 : 0xef4444;
      if (ratio > 0){ hg.fillStyle(hc, 1); hg.fillRoundedRect(tx, barY, Math.max(barH, barW*ratio), barH, barH/2); }
      hg.lineStyle(1, 0x0b1026, 0.8); hg.strokeRoundedRect(tx, barY, barW, barH, barH/2);
      this.track(hg);
      this.utext(tx+barW, barY+barH+Math.max(7,fz(9))*0.7, hp+' / '+mh,
                 Math.max(8, Math.round(fz(10))), '#9fb0dd', 1, 7);

      // 经验条（细线，贴在卡片底部）
      var need = expNeed(c.lv), eRatio = clamp((c.exp||0)/need, 0, 1);
      var eg = this.add.graphics().setDepth(6);
      eg.fillStyle(0x0e1428, 1); eg.fillRoundedRect(cx+4, cy+ch-Math.max(4,ch*0.055)-2, cw-8, Math.max(3,ch*0.055), 3);
      eg.fillStyle(0x6b8cff, 1); eg.fillRoundedRect(cx+4, cy+ch-Math.max(4,ch*0.055)-2, Math.max(3,(cw-8)*eRatio), Math.max(3,ch*0.055), 3);
      this.track(eg);

      (function(idx){
        self.hit(cx, cy, cw, ch, function(){ self.selMon = idx; self.render(); });
      })(i);
    }

    // 空位提示
    if (n < SR.CFG.MAX_PARTY){
      var emptyTxt = '还有 '+(SR.CFG.MAX_PARTY-n)+' 个空位 · 在草丛削弱野生精灵后投球捕捉';
      this.utext(body.x+body.w/2, foot.y-foot.h*0.55, emptyTxt,
                 Math.max(9, Math.round(fz(11))), '#6b78a0', 0.5);
    }

    this.makeBtn(foot.x, foot.y, Math.min(foot.w*0.34, fz(160)), foot.h, '关闭', this.close.bind(this),
      { size: fz(13) });
  };

  /* ---------------- 队伍：单只详情 ---------------- */
  UIScene.prototype.renderMonDetail = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    var idx = this.selMon;
    var c = G.party[idx];
    if (!c){ this.selMon = null; return this.render(); }
    var sp = spOf(c.id), tok = ++this._tok;
    await loadTex(this, c.id+'_'+(c.stage||0));
    if (tok !== this._tok) return;

    this.header(head, sp.stages[c.stage||0], 'Lv.'+c.lv+' · 羁绊 '+c.bond+'/'+SR.CFG.MAX_BOND,
      function(){ self.selMon = null; self.render(); });

    var tall = this.mode() === 'P' || body.w < 520;
    var artBox = tall
      ? { x:body.x+body.w*0.5-body.h*0.24, y:body.y, w:body.h*0.48, h:body.h*0.48 }
      : { x:body.x, y:body.y, w:body.w*0.32, h:Math.min(body.h*0.9, body.w*0.32) };
    var info = tall
      ? { x:body.x, y:body.y+artBox.h+this.gap*1.5, w:body.w, h:body.h-artBox.h-this.gap*1.5 }
      : { x:body.x+artBox.w+this.gap*2, y:body.y, w:body.w-artBox.w-this.gap*2, h:body.h };

    var cg = this.add.graphics().setDepth(5);
    cg.fillStyle(0x101830, 0.9); cg.fillRoundedRect(artBox.x, artBox.y, artBox.w, artBox.h, 10);
    cg.lineStyle(2, 0x5a86d6, 0.9); cg.strokeRoundedRect(artBox.x, artBox.y, artBox.w, artBox.h, 10);
    this.track(cg);
    if (this.textures.exists(c.id+'_'+(c.stage||0))){
      var size = Math.min(artBox.w, artBox.h)*0.86;
      var im = this.add.image(artBox.x+artBox.w/2, artBox.y+artBox.h*0.5, c.id+'_'+(c.stage||0)).setDepth(6);
      im.setScale(size/256);
      if (hpOf(c) <= 0) im.setAlpha(0.4);
      this.track(im);
    }

    var lh = Math.max(16, Math.round(fz(20)));
    var y = info.y;
    var types = sp.types || [sp.type];
    var bx = info.x;
    for (var i=0;i<types.length;i++){
      var r = this.badge(bx, y+lh*0.42, (SR.TYPES[types[i]]?SR.TYPES[types[i]].name:'—'), types[i], 8);
      bx += (r.t.width + fz(16)) + fz(6);
    }
    this.utext(info.x+info.w, y+lh*0.42, '羁绊 '+c.bond+'/'+SR.CFG.MAX_BOND, fz(12), '#9fb0dd', 1, 7);
    y += lh;

    // HP + 经验
    var hp = hpOf(c), mh = maxHpOf(c), ratio = mh ? hp/mh : 0;
    var barH = Math.max(7, Math.round(fz(9)));
    var hg = this.add.graphics().setDepth(6);
    hg.fillStyle(0x0e1428, 1); hg.fillRoundedRect(info.x, y, info.w, barH, barH/2);
    var hc = ratio > 0.5 ? 0x4ade80 : ratio > 0.2 ? 0xfbbf24 : 0xef4444;
    if (ratio > 0){ hg.fillStyle(hc,1); hg.fillRoundedRect(info.x, y, Math.max(barH, info.w*ratio), barH, barH/2); }
    this.track(hg);
    y += barH + Math.max(9, Math.round(fz(11)));
    var need = expNeed(c.lv);
    this.utext(info.x, y, 'HP '+hp+' / '+mh, fz(11), '#c9d6ff', 0, 7);
    this.utext(info.x+info.w, y, '经验 '+(c.exp||0)+' / '+need, fz(11), '#8fa0cc', 1, 7);
    y += Math.max(9, Math.round(fz(11)))*1.2;
    var eg = this.add.graphics().setDepth(6);
    var ebH = Math.max(4, Math.round(fz(5)));
    eg.fillStyle(0x0e1428, 1); eg.fillRoundedRect(info.x, y, info.w, ebH, ebH/2);
    eg.fillStyle(0x6b8cff, 1);
    eg.fillRoundedRect(info.x, y, Math.max(ebH, info.w*clamp((c.exp||0)/need,0,1)), ebH, ebH/2);
    this.track(eg);
    y += ebH + this.gap*1.6;

    // 招式（与原版 movesFor 一致：按等级解锁 1/8/16）
    var mv = movesFor(sp, c.lv);
    this.utext(info.x, y+lh*0.35, '招式', fz(12), '#8fa0cc', 0, 7);
    y += lh*0.8;
    var mCols = info.w > 400 ? 2 : 1;
    var mw = (info.w - this.gap*(mCols-1)) / mCols;
    var mh2 = Math.max(24, Math.round(fz(30)));
    for (var m=0;m<mv.length;m++){
      var mo = mv[m], cc = m % mCols, rr = Math.floor(m / mCols);
      var mx = info.x + cc*(mw+this.gap), my = y + rr*(mh2+this.gap*0.5);
      var tc = typeC(mo.type), col = Array.isArray(tc)?tc[0]:tc;
      var mg = this.add.graphics().setDepth(6);
      mg.fillStyle(0x141c33, 1); mg.fillRoundedRect(mx, my, mw, mh2, 6);
      mg.fillStyle(col, 1); mg.fillRoundedRect(mx, my, Math.max(3, mw*0.02), mh2, 3);
      this.track(mg);
      var sw = Math.max(8, Math.round(fz(9)));
      var tn = (mo.type==='none') ? '普通' : (SR.TYPES[mo.type]?SR.TYPES[mo.type].name:'—');
      this.utext(mx+this.gap*0.9, my+mh2*0.5, mo.name+' · '+tn+' · 威力 '+mo.power,
                 Math.max(9, Math.round(fz(11))), '#dfe8ff', 0, 7);
    }
    y += Math.ceil(mv.length/mCols)*(mh2+this.gap*0.5) + this.gap*1.2;

    // 进化条件（只看羁绊，与原版 evolveInst 完全一致）
    var canEvo = (c.stage||0) < 2 && c.bond >= EVO_BOND[(c.stage||0)+1];
    var evoTxt = (c.stage||0) >= 2
      ? '已是最终形态'
      : (canEvo ? '可以进化！' : '进化需羁绊 '+EVO_BOND[(c.stage||0)+1]+'（当前 '+c.bond+'）');
    this.utext(info.x, y, '进化  '+evoTxt, fz(12), canEvo ? '#9ee6b8' : '#8fa0cc', 0, 7);

    // 底部：出战 / 调整位置
    var gap = this.gap;
    var isActive = idx === G.activeIdx;
    var bw3 = (foot.w - gap*2) / 3;
    this.makeBtn(foot.x, foot.y, bw3, foot.h, isActive ? '★ 当前出战' : '设为出战', function(){
      if (hpOf(G.party[idx]) <= 0){ self.flashNote('失去战斗力的精灵不能出战'); return; }
      if (idx === G.activeIdx) return;
      G.activeIdx = idx; saveG();
      self.flashNote('出战精灵已切换'); self.selMon = null; self.render();
    }, { size: fz(13), disabled: isActive || hpOf(c) <= 0, accent: 0xffd166 });

    this.makeBtn(foot.x+bw3+gap, foot.y, bw3, foot.h, '↑ 前移', function(){
      if (idx <= 0) return;
      var t = G.party[idx-1]; G.party[idx-1] = G.party[idx]; G.party[idx] = t;
      if (G.activeIdx === idx) G.activeIdx = idx-1; else if (G.activeIdx === idx-1) G.activeIdx = idx;
      saveG(); self.selMon = idx-1; self.render();
    }, { size: fz(13), disabled: idx <= 0 });

    this.makeBtn(foot.x+(bw3+gap)*2, foot.y, bw3, foot.h, '↓ 后移', function(){
      if (idx >= G.party.length-1) return;
      var t = G.party[idx+1]; G.party[idx+1] = G.party[idx]; G.party[idx] = t;
      if (G.activeIdx === idx) G.activeIdx = idx+1; else if (G.activeIdx === idx+1) G.activeIdx = idx;
      saveG(); self.selMon = idx+1; self.render();
    }, { size: fz(13), disabled: idx >= G.party.length-1 });
  };

  /* ---------------- 背包 ---------------- */
  /* ---------------- 徽章盒：八大道馆 ----------------
     8 个格子固定对应 GYMS 顺序，不按获得顺序排 ——
     玩家需要一眼看出「还差哪几个」，按获得顺序排会看不出来。
     ================================================= */
  UIScene.prototype.renderBadge = function(head, body, foot){
    var fz = this.fz.bind(this);
    this.header(head, '徽章盒', '八大道馆 · '+G.badges.length+'/'+GYMS.length);

    // 宽屏 4×2、竖屏 2×4：格子必须接近正方形，徽章图案才不会被压扁
    var cols = body.w > body.h*1.1 ? 4 : 2;
    var rows = Math.ceil(GYMS.length/cols);
    var gap  = Math.max(6, Math.round(Math.min(body.w,body.h)*0.014));
    var cw   = (body.w - gap*(cols-1)) / cols;
    var ch   = (body.h - gap*(rows-1)) / rows;

    for (var i=0;i<GYMS.length;i++){
      var g = GYMS[i];
      var got = G.badges.indexOf(g.key) >= 0;
      var cx = body.x + (i%cols)*(cw+gap);
      var cy = body.y + Math.floor(i/cols)*(ch+gap);

      var panel = this.add.graphics().setDepth(4);
      panel.fillStyle(got ? 0x172a4a : 0x111629, 0.96);
      panel.fillRoundedRect(cx, cy, cw, ch, 9);
      panel.lineStyle(2, got ? 0x6f8fd8 : 0x2b3352, 0.92);
      panel.strokeRoundedRect(cx, cy, cw, ch, 9);
      this.track(panel);

      var size = Math.min(cw*0.40, ch*0.44);
      this.track(this.add.image(cx+cw*0.5, cy+ch*0.38,
        'badge_'+g.key+(got ? '' : '_dim')).setDisplaySize(size, size).setDepth(6));

      this.utext(cx+cw*0.5, cy+ch*0.70, g.badge,
                 Math.max(10, Math.round(fz(12.5))), got ? '#ffd98a' : '#5f6b8c', 0.5, 7);
      this.utext(cx+cw*0.5, cy+ch*0.86, g.leader.replace(/^\S+\s+/, ''),
                 Math.max(9, Math.round(fz(10.5))), got ? '#9fb8e8' : '#454f6e', 0.5, 7);
    }

    var msg;
    if (G.cleared) msg = '已通关 · 冠军 曜';
    else if (G.badges.length >= GYMS.length) msg = '徽章已集齐 · 去广场东侧挑战冠军';
    else msg = '再获得 '+(GYMS.length-G.badges.length)+' 枚即可挑战冠军 曜';
    var note = this.utext(foot.x, foot.y+foot.h*0.5, msg,
                          Math.max(10, Math.round(fz(11.5))), '#9fb0dd', 0, 7);
    note.setWordWrapWidth(Math.max(60, foot.w - Math.min(foot.w*0.34, fz(160)) - fz(14)), true);

    var bw = Math.min(foot.w*0.32, fz(160));
    this.makeBtn(foot.x+foot.w-bw, foot.y, bw, foot.h, '关闭', this.close.bind(this), { size: fz(13) });
  };

  UIScene.prototype.renderBag = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    // 正在选使用对象时，整页交给选择界面（避免页头被画两遍）
    if (this.bagSel) return this.renderBagPick(head, body, foot);
    this.header(head, '背包', '精灵球 '+G.balls+' · 糖果 '+G.bag.candy+' · 进化石 '+G.bag.stone);

    var items = [
      { key:'ball',  icon:'⚪', name:'精灵球',       n:G.balls,      desc:'战斗中点「捕捉」消耗，野生精灵残血时成功率更高' },
      { key:'candy', icon:'🍬', name:'亲密度糖果',   n:G.bag.candy,  desc:'给一只精灵 +2 羁绊，加快进化；羁绊是进化的唯一条件' },
      { key:'stone', icon:'💎', name:'进化石',       n:G.bag.stone,  desc:'让满足羁绊条件的精灵立刻进化（羁绊不够会被拒绝）' }
    ];

    var rowH = Math.min((body.h - this.gap*2) / items.length, fz(84));
    var y = body.y;
    for (var i=0;i<items.length;i++){
      var it = items[i];
      var usable = it.key !== 'ball' && it.n > 0;
      var g = this.add.graphics().setDepth(5);
      g.fillStyle(usable ? 0x1c2f52 : 0x141a2e, 0.96);
      g.fillRoundedRect(body.x, y, body.w, rowH, 9);
      g.lineStyle(2, usable ? 0x5a86d6 : 0x2b3352, 0.9);
      g.strokeRoundedRect(body.x, y, body.w, rowH, 9);
      this.track(g);

      this.utext(body.x+rowH*0.5, y+rowH*0.5, it.icon, Math.round(rowH*0.42), '#fff');
      var nx = body.x + rowH*0.95;
      this.utext(nx, y+rowH*0.33, it.name, fz(14), '#eaf0ff', 0, 7);
      var ds = this.utext(nx, 0, it.desc, Math.max(9, Math.round(fz(10.5))), '#8fa0cc', 0, 7);
      ds.setWordWrapWidth(body.w - (nx-body.x) - fz(70), true);
      ds.setY(y+rowH*0.48+ds.height*0.5);

      this.utext(body.x+body.w-rowH*0.35, y+rowH*0.42, '×'+it.n,
                 Math.max(11, Math.round(fz(15))), it.n>0 ? '#ffd166' : '#5a6690', 1, 7);

      (function(key, can){
        self.hit(body.x, y, body.w, rowH, function(){
          if (!can){ self.flashNote(key==='ball' ? '精灵球在战斗中直接使用' : '数量不足'); return; }
          self.bagSel = key; self.render();
        });
      })(it.key, usable);

      y += rowH + this.gap;
    }

    this.makeBtn(foot.x, foot.y, Math.min(foot.w*0.34, fz(160)), foot.h, '关闭', this.close.bind(this),
      { size: fz(13) });
  };

  // 选择使用对象
  UIScene.prototype.renderBagPick = async function(head, body, foot){
    var self = this, fz = this.fz.bind(this);
    var kind = this.bagSel;
    var tok = ++this._tok;
    var label = kind === 'candy' ? '亲密度糖果' : '进化石';
    this.header(head, '使用 '+label, '选一只精灵', function(){ self.bagSel = null; self.render(); });

    var keys = G.party.map(function(c){ return c.id+'_'+(c.stage||0); });
    await Promise.all(keys.map(function(k){ return loadTex(self, k); }));
    if (tok !== this._tok) return;

    var rowH = Math.min((body.h - this.gap*5) / Math.max(1,G.party.length), fz(70));
    var y = body.y;
    for (var i=0;i<G.party.length;i++){
      var c = G.party[i], sp = spOf(c.id);
      var g = this.add.graphics().setDepth(5);
      g.fillStyle(0x1a2440, 0.96); g.fillRoundedRect(body.x, y, body.w, rowH, 9);
      g.lineStyle(2, 0x46557f, 0.9); g.strokeRoundedRect(body.x, y, body.w, rowH, 9);
      this.track(g);

      var artS = rowH*0.76;
      if (this.textures.exists(c.id+'_'+(c.stage||0))){
        var im = this.add.image(body.x+rowH*0.5, y+rowH*0.5, c.id+'_'+(c.stage||0)).setDepth(6);
        im.setScale(artS/256); this.track(im);
      }
      var nx = body.x + rowH*0.95;
      this.utext(nx, y+rowH*0.36, sp.stages[c.stage||0]+'  Lv.'+c.lv, fz(14), '#eaf0ff', 0, 7);
      var evoNeed = (c.stage||0) < 2 ? EVO_BOND[(c.stage||0)+1] : 0;
      var info = (c.stage||0) >= 2
        ? '最终形态 · 羁绊 '+c.bond
        : '羁绊 '+c.bond+' / 进化需 '+evoNeed;
      this.utext(nx, y+rowH*0.68, info, fz(11), '#8fa0cc', 0, 7);

      (function(idx){
        self.hit(body.x, y, body.w, rowH, function(){ self.useItem(idx, kind); });
      })(i);

      y += rowH + this.gap;
    }

    this.makeBtn(foot.x, foot.y, Math.min(foot.w*0.34, fz(160)), foot.h, '← 返回背包', function(){
      self.bagSel = null; self.render();
    }, { size: fz(13) });
  };

  // 道具效果：糖果 +2 羁绊；进化石在羁绊够时进化（规则同原版 evolveInst）
  UIScene.prototype.useItem = function(idx, kind){
    var c = G.party[idx];
    if (!c) return;
    if (kind === 'candy'){
      if (G.bag.candy <= 0){ this.flashNote('糖果不够了'); return; }
      if (c.bond >= SR.CFG.MAX_BOND){ this.flashNote('羁绊已满'); return; }
      G.bag.candy--;
      c.bond = Math.min(SR.CFG.MAX_BOND, c.bond + 2);
      saveG(); AUDIO.sfx('levelup');
      this.flashNote(spOf(c.id).stages[c.stage||0]+' 羁绊 +2（'+c.bond+'/'+SR.CFG.MAX_BOND+'）');
      this.render();
      return;
    }
    // stone
    if (G.bag.stone <= 0){ this.flashNote('进化石不够了'); return; }
    if ((c.stage||0) >= 2){ this.flashNote('已是最终形态'); return; }
    var need = EVO_BOND[(c.stage||0)+1];
    if (c.bond < need){ this.flashNote('羁绊不足，需要 '+need+'（当前 '+c.bond+'）'); return; }
    G.bag.stone--;
    var sp = spOf(c.id);
    var from = sp.stages[c.stage||0];
    c.stage = (c.stage||0) + 1;
    c.hp = maxHpOf(c);
    dexGot(c.id, c.stage);
    saveG();
    AUDIO.sfx('levelup');
    this.flashNote('🦋 进化！'+from+' → '+sp.stages[c.stage]);
    this.bagSel = null;
    this.render();
  };

  UIScene.prototype.flashNote = function(msg){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, 1700);
  };

  // ===== 启动 =====
  bindTalkInput();
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', backgroundColor: '#101018', pixelArt: true,
    scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
    scene: [WorldScene, BattleScene, UIScene]
  });
})();
</script>
</body>
