<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灵契大陆 · Phaser 4 真实地图原型 (batch 1)</title>
<style>
  html,body{margin:0;height:100%;background:#101018;overflow:hidden;font-family:system-ui,"PingFang SC",sans-serif}
  #game{width:100vw;height:100vh}
  #hud{position:fixed;left:8px;top:8px;color:#fff;font-size:13px;line-height:1.55;
       background:rgba(0,0,0,.5);padding:8px 12px;border-radius:9px;pointer-events:none;
       text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #hint{position:fixed;left:8px;bottom:8px;color:#fff;opacity:.72;font-size:12px;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ff6b6b;
       font-size:16px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">加载中…</div>
<div id="hint">方向键 / WASD 移动 · 位置自动存档(测试键) · 刷新后恢复</div>
<div id="err"></div>

<script src="phaser.min.js"></script>
<script>
(function () {
  if (typeof Phaser === 'undefined') {
    var e = document.getElementById('err');
    e.style.display = 'flex';
    e.textContent = 'Phaser 4 未能加载：请确认 phaser.min.js 与本 HTML 在同一文件夹。';
    return;
  }

  // ===== 数据（来自 src/data/tiles.js，真实地图配置）=====
  var TILE = 32, MAP_W = 48, MAP_H = 34;
  var T = { GRASS:0, TALL:1, PATH:2, TREE:3, WATER:4, ROCK:5, SNOW:6, SAND:7, LAVA:8, RUIN:9 };
  var TNAME = ['草地','高草','道路','树木','水面','岩石','雪地','沙地','熔岩','遗迹'];
  var WALK = [true,true,true,false,false,false,true,true,false,true]; // 按瓦片索引；false=阻挡
  var HUB = { x:25, y:17 };
  var BIOMES = [
    { key:'plains',  name:'微风草原', cx:8,  cy:8,  r:7 },
    { key:'forest',  name:'低语森林', cx:8,  cy:26, r:7 },
    { key:'lake',    name:'碧波湖',   cx:22, cy:7,  r:7 },
    { key:'volcano', name:'灰烬火山', cx:41, cy:8,  r:7 },
    { key:'snow',    name:'霜白雪原', cx:41, cy:26, r:7 },
    { key:'desert',  name:'流沙荒漠', cx:22, cy:27, r:6 },
    { key:'ruins',   name:'遗忘遗迹', cx:13, cy:17, r:4 },
    { key:'ridge',   name:'龙脊山道', cx:35, cy:17, r:4 }
  ];

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  // 与 index.html buildWorld() 完全一致（同种子 20261104，同规则）
  function buildWorld(){
    var rng = mulberry32(20261104);
    var grid = [], biomeMap = [];
    for (var y=0;y<MAP_H;y++){ grid.push(new Array(MAP_W).fill(T.GRASS)); biomeMap.push(new Array(MAP_W).fill(null)); }
    for (var y=0;y<MAP_H;y++) for (var x=0;x<MAP_W;x++){
      if (x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) grid[y][x]=T.TREE;
    }
    for (var y=2;y<MAP_H-2;y++) for (var x=2;x<MAP_W-2;x++){
      var best=null, bd=1e9;
      for (var i=0;i<BIOMES.length;i++){ var b=BIOMES[i]; var d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
      if(!best) continue;
      if(bd>best.r){ biomeMap[y][x]=null; continue; }
      biomeMap[y][x]=best;
      var rel=bd/best.r, r=rng();
      switch(best.key){
        case 'plains': grid[y][x]= r<.72?T.TALL:T.GRASS; break;
        case 'forest': grid[y][x]= (rel>.72||r<.38)?T.TREE:T.TALL; break;
        case 'lake':   grid[y][x]= rel<.55?T.WATER : rel<.78?T.SAND : T.TALL; break;
        case 'volcano':grid[y][x]= rel<.34?T.LAVA : rel<.6?T.ROCK : (r<.28?T.ROCK:T.TALL); break;
        case 'snow':   grid[y][x]= rel<.85?T.SNOW:T.TALL; break;
        case 'desert': grid[y][x]= r<.18?T.TALL:T.SAND; break;
        case 'ruins':  grid[y][x]= r<.2?T.ROCK:T.RUIN; break;
        case 'ridge':  grid[y][x]= r<.4?T.ROCK : (r<.62?T.TALL:T.PATH); break;
      }
    }
    for (var y=HUB.y-4;y<=HUB.y+4;y++) for (var x=HUB.x-4;x<=HUB.x+4;x++){
      if (x<0||y<0||x>=MAP_W||y>=MAP_H) continue;
      if (x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) continue;
      grid[y][x]=T.PATH; biomeMap[y][x]=null;
    }
    function carveTo(tx,ty){
      var x=HUB.x, y=HUB.y;
      while(x!==tx){ x+=Math.sign(tx-x); if(x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ grid[y][x]=T.PATH; biomeMap[y][x]=null; } }
      while(y!==ty){ y+=Math.sign(ty-y); if(x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ grid[y][x]=T.PATH; biomeMap[y][x]=null; } }
    }
    for (var j=0;j<BIOMES.length;j++) carveTo(BIOMES[j].cx, BIOMES[j].cy);
    return { grid:grid, biomeMap:biomeMap };
  }

  function biomeAt(x,y,biomeMap){
    if (x>=0&&y>=0&&x<MAP_W&&y<MAP_H && biomeMap[y][x]) return biomeMap[y][x];
    var best=null, bd=1e9;
    for (var i=0;i<BIOMES.length;i++){ var b=BIOMES[i]; var d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
    return best;
  }

  var SAVE_KEY = 'sr_phaser_test_v1'; // 独立测试键，绝不碰真实存档 sr_game_v2

  // ===== Phaser 场景 =====
  function WorldScene(){ Phaser.Scene.call(this, { key:'world' }); }
  WorldScene.prototype = Object.create(Phaser.Scene.prototype);
  WorldScene.prototype.constructor = WorldScene;

  var TILE_COLORS = [
    [0x6abe5a,0x4f9e44], // GRASS
    [0x4a9a3f,0x357a2f], // TALL
    [0xd9c08a,0xc2a86e], // PATH
    [0x2f6b2e,0x1f4d20], // TREE
    [0x4aa3df,0x3a86c0], // WATER
    [0x9a8f80,0x7d7263], // ROCK
    [0xeef4f8,0xd2deea], // SNOW
    [0xe8d8a0,0xd8c888], // SAND
    [0xd4482a,0xa83218], // LAVA
    [0x8a8a9a,0x6a6a78]  // RUIN
  ];
  var TKEYS = ['t0','t1','t2','t3','t4','t5','t6','t7','t8','t9'];

  WorldScene.prototype.preload = function(){
    for (var i=0;i<TILE_COLORS.length;i++){
      var base=TILE_COLORS[i][0], edge=TILE_COLORS[i][1];
      var g=this.add.graphics();
      g.fillStyle(base,1); g.fillRect(0,0,TILE,TILE);
      g.fillStyle(edge,1); g.fillRect(0,TILE-4,TILE,4);
      g.generateTexture(TKEYS[i],TILE,TILE); g.destroy();
    }
    // 玩家：圆头小角色（batch1 占位，batch2 换四向行走动画）
    var p=this.add.graphics();
    p.fillStyle(0x2b2b3a,1); p.fillRoundedRect(6,10,20,18,5);
    p.fillStyle(0xffd9b0,1); p.fillCircle(16,9,8);
    p.fillStyle(0x222222,1); p.fillCircle(13,9,1.6); p.fillCircle(19,9,1.6);
    p.generateTexture('hero',32,32); p.destroy();
  };

  WorldScene.prototype.create = function(){
    var world = buildWorld();
    this.grid = world.grid;
    this.biomeMap = world.biomeMap;

    // 渲染真实地形（1632 格）
    for (var y=0;y<MAP_H;y++) for (var x=0;x<MAP_W;x++){
      this.add.image(x*TILE+TILE/2, y*TILE+TILE/2, TKEYS[this.grid[y][x]]);
    }

    // 出生点 HUB.x, HUB.y+2（与原版一致）
    var sx=HUB.x, sy=HUB.y+2;
    try { var s=JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Number.isInteger(s.x) && Number.isInteger(s.y)) { sx=s.x; sy=s.y; } } catch(e){}

    this.player = this.add.image(sx*TILE+TILE/2, sy*TILE+TILE/2, 'hero').setDepth(10);
    this.cameras.main.setBounds(0,0,MAP_W*TILE,MAP_H*TILE);
    this.cameras.main.startFollow(this.player, true, 0.15, 0.15);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
    this.moving = false;
    this.hud = document.getElementById('hud');
    this.refreshHud(sx, sy, false);
  };

  WorldScene.prototype.blocked = function(x,y){
    if (x<0||y<0||x>=MAP_W||y>=MAP_H) return true;
    return !WALK[this.grid[y][x]];
  };
  WorldScene.prototype.gx = function(){ return Math.round(this.player.x/TILE - 0.5); };
  WorldScene.prototype.gy = function(){ return Math.round(this.player.y/TILE - 0.5); };

  WorldScene.prototype.step = function(dx,dy){
    if (this.moving) return;
    var nx=this.gx()+dx, ny=this.gy()+dy, self=this;
    if (this.blocked(nx,ny)){
      this.tweens.add({ targets:this.player, x:this.player.x+dx*3, y:this.player.y+dy*3, duration:55, yoyo:true });
      return;
    }
    this.moving = true;
    this.tweens.add({
      targets:this.player, x:nx*TILE+TILE/2, y:ny*TILE+TILE/2, duration:120,
      onComplete:function(){ self.moving=false; self.save(nx,ny); }
    });
  };

  WorldScene.prototype.save = function(gx,gy){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ x:gx, y:gy })); } catch(e){}
    this.refreshHud(gx, gy, true);
  };

  WorldScene.prototype.refreshHud = function(gx,gy,saved){
    var tile=this.grid[gy] ? this.grid[gy][gx] : 0;
    var bio=biomeAt(gx,gy,this.biomeMap);
    this.hud.innerHTML =
      '灵契大陆 · Phaser 4 原型 (batch 1)<br>' +
      '坐标 ('+gx+', '+gy+') · 地形 '+TNAME[tile]+'<br>' +
      '区域 '+(bio?bio.name:'—') + (saved?' · 已存档 ✓':'');
  };

  WorldScene.prototype.update = function(){
    if (this.moving) return;
    var c=this.cursors, k=this.keys;
    if (c.left.isDown  || k.A.isDown)  this.step(-1,0);
    else if (c.right.isDown || k.D.isDown) this.step(1,0);
    else if (c.up.isDown    || k.W.isDown) this.step(0,-1);
    else if (c.down.isDown  || k.S.isDown) this.step(0,1);
  };

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#101018',
    pixelArt: true,
    scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
    scene: [WorldScene]
  });
})();
</script>
</body>
</html>
