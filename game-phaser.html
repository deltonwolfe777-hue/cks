<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灵契大陆 · Phaser 4 (batch 10 浮动摇杆/双击全屏)</title>
<style>
  html,body{margin:0;height:100%;background:#101018;overflow:hidden;font-family:system-ui,"PingFang SC",sans-serif;
            -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #game{width:100vw;height:100vh}
  #hud{position:fixed;left:8px;top:8px;color:#fff;font-size:13px;line-height:1.55;
       background:rgba(0,0,0,.5);padding:8px 12px;border-radius:9px;pointer-events:none;
       text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #hint{position:fixed;left:8px;bottom:8px;color:#fff;opacity:.72;font-size:12px;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(0,0,0,.72);
         color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;
         pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ff6b6b;
       font-size:16px;text-align:center;padding:24px;white-space:pre-line;line-height:1.7}
  /* 浮动摇杆：平时完全不可见，按住屏幕后出现在手指下方。
     left/top 由 JS 写成按下坐标，translate(-50%,-50%) 把自身中心对准那一点，
     这样小屏改尺寸时不用同步改 margin。四向刻度只作视觉参照，永不接收事件 */
  #pad{position:fixed;z-index:20;width:142px;height:142px;border-radius:50%;
       left:0;top:0;transform:translate(-50%,-50%);
       opacity:0;pointer-events:none;transition:opacity .13s ease-out;
       touch-action:none;
       background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.10),rgba(255,255,255,.05) 64%,rgba(255,255,255,.02));
       border:2px solid rgba(255,255,255,.28)}
  #pad.on{opacity:.85}
  #pad u{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.30}
  #pad u[data-t="u"]{left:50%;top:6px;margin-left:-6px;border-top-width:0;border-bottom-color:#fff}
  #pad u[data-t="d"]{left:50%;bottom:6px;margin-left:-6px;border-bottom-width:0;border-top-color:#fff}
  #pad u[data-t="l"]{top:50%;left:6px;margin-top:-6px;border-left-width:0;border-right-color:#fff}
  #pad u[data-t="r"]{top:50%;right:6px;margin-top:-6px;border-right-width:0;border-left-color:#fff}
  /* 摇杆头：位移由 JS 写 transform；过渡只给颜色，避免跟手迟滞 */
  #pad i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
         border-radius:50%;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.58);
         box-shadow:0 4px 14px rgba(0,0,0,.38);
         transition:background .12s,border-color .12s;will-change:transform}
  #pad i.on{background:rgba(120,170,255,.60);border-color:rgba(196,220,255,.95)}

  /* 设置入口与面板（音乐/音效独立音量 + 静音） */
  #gear{position:fixed;z-index:30;width:40px;height:40px;border-radius:12px;cursor:pointer;
        right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
        background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.26);color:#fff;font-size:19px;
        display:flex;align-items:center;justify-content:center;user-select:none}
  #gear:active{background:rgba(120,170,255,.5)}
  #cfg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
       background:rgba(4,6,16,.74);backdrop-filter:blur(4px)}
  #cfg.on{display:flex}
  #cfgBox{width:min(330px,88vw);background:#151b34;border:2px solid #4a5d94;border-radius:14px;
          padding:18px 18px 14px;color:#dfe7ff;box-shadow:0 18px 48px rgba(0,0,0,.62)}
  #cfgBox h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:1px}
  #cfgBox .sub{font-size:11px;opacity:.6;margin-bottom:12px}
  .cfgRow{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}
  .cfgRow b{width:44px;font-weight:400;opacity:.92}
  .cfgRow input[type=range]{flex:1;accent-color:#6b8cff;height:24px}
  .cfgRow span{width:38px;text-align:right;font-variant-numeric:tabular-nums;opacity:.8}
  #cfgMute{margin:4px 0 0;padding:9px;text-align:center;border-radius:10px;cursor:pointer;
           border:1px solid #5a7bd6;background:#1e2a48;color:#dfe7ff;font-size:13px}
  #cfgMute.on{background:#7a2b3a;border-color:#d1596f}
  #cfgClose{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:1px solid #5a7bd6;
            background:#243358;color:#e8eeff;font-size:14px;cursor:pointer}
  #cfgClose:active{background:#31456f}

  /* 区域地名条：跨越群系边界时滑入滑出 */
  #zone{position:fixed;left:50%;top:15%;transform:translate(-50%,-14px);z-index:18;
        padding:11px 30px 10px;border-radius:13px;pointer-events:none;text-align:center;
        background:linear-gradient(180deg,rgba(11,16,38,.94),rgba(11,16,38,.70));
        border:2px solid rgba(122,150,220,.85);box-shadow:0 10px 34px rgba(0,0,0,.5);
        color:#eaf0ff;font-size:21px;letter-spacing:4px;font-weight:600;
        opacity:0;transition:opacity .34s ease,transform .34s ease;white-space:nowrap}
  #zone.on{opacity:1;transform:translate(-50%,0)}
  #zone small{display:block;font-size:11px;letter-spacing:1.5px;color:#9fb0dd;
              margin-top:4px;font-weight:400}

  /* 时段 / 天气胶囊：昼夜与区域天气都从这儿读，不占画面 */
  #clock{position:fixed;z-index:17;right:calc(10px + env(safe-area-inset-right,0px));
         bottom:calc(12px + env(safe-area-inset-bottom,0px));
         padding:5px 13px;border-radius:20px;color:#dfe7ff;font-size:12px;letter-spacing:1px;
         background:rgba(11,16,38,.80);border:1px solid rgba(88,106,158,.85);
         pointer-events:none;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.55)}

  /* 任务导引：指向下一个道馆，但只是指路，不限制你去哪（保留自由探索） */
  #quest{position:fixed;z-index:18;left:50%;top:calc(10px + env(safe-area-inset-top,0px));
         transform:translateX(-50%);display:flex;align-items:center;gap:9px;
         max-width:min(560px,calc(100vw - 240px));
         padding:8px 16px;border-radius:24px;
         background:rgba(11,16,38,.86);border:1.5px solid rgba(122,150,220,.72);
         box-shadow:0 6px 22px rgba(0,0,0,.45);backdrop-filter:blur(6px);
         color:#dbe6ff;font-size:13px;white-space:nowrap;pointer-events:none}
  #quest b{color:#ffd98a;font-weight:700;letter-spacing:1px;flex:0 0 auto}
  #quest span{overflow:hidden;text-overflow:ellipsis}
  #quest em{font-style:normal;color:#8fb8ff;font-variant-numeric:tabular-nums;flex:0 0 auto}

  /* 剧情对话框：底部横条，点任意处推进 */
  #dlg{position:fixed;z-index:45;display:none;left:50%;transform:translateX(-50%);
       bottom:calc(18px + env(safe-area-inset-bottom,0px));
       width:min(740px,calc(100vw - 28px));
       background:rgba(8,12,28,.965);border:2px solid #5b6fa8;border-radius:15px;
       padding:13px 17px 11px;box-shadow:0 14px 46px rgba(0,0,0,.68);cursor:pointer}
  #dlg.on{display:block}
  #dlgWho{font-size:12.5px;font-weight:700;color:#ffd98a;letter-spacing:1.5px;margin-bottom:7px}
  #dlgTxt{font-size:15px;line-height:1.66;color:#eaf0ff;min-height:1.66em}
  #dlgNext{margin-top:9px;text-align:right;font-size:11.5px;color:#7f95c8;letter-spacing:1px}
  /* 对话中收起摇杆与菜单：避免边读字边误触走位 */
  body.talk #pad{opacity:0!important}
  body.talk #menuBar{opacity:.22;pointer-events:none}

  /* 通关结算 */
  #ending{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
          background:radial-gradient(circle at 50% 38%,rgba(24,36,72,.92),rgba(4,6,16,.97));
          backdrop-filter:blur(6px)}
  #ending.on{display:flex}
  #endBox{width:min(430px,88vw);text-align:center;color:#eaf0ff;
          background:rgba(13,19,40,.92);border:2px solid #7a8fd0;border-radius:18px;
          padding:26px 22px 20px;box-shadow:0 22px 70px rgba(0,0,0,.7)}
  #endBox h2{margin:0 0 6px;font-size:24px;letter-spacing:7px;color:#ffd98a}
  #endBox .sub{font-size:12px;color:#9fb0dd;letter-spacing:2px;margin-bottom:18px}
  #endBox .row{display:flex;justify-content:space-between;font-size:13px;padding:7px 4px;
               border-bottom:1px solid rgba(120,145,200,.22)}
  #endBox .row b{color:#c8d8ff;font-weight:500}
  #endBox .row span{color:#ffd98a;font-variant-numeric:tabular-nums}
  #endBtn{margin-top:20px;width:100%;padding:12px;border-radius:11px;cursor:pointer;
          border:1px solid #5a7bd6;background:#243358;color:#e8eeff;font-size:14px;letter-spacing:2px}
  #endBtn:active{background:#31456f}

  /* 右上角菜单入口：图鉴 / 队伍 / 背包 / 徽章 */  #menuBar{position:fixed;z-index:19;display:flex;flex-direction:column;gap:7px;
           right:calc(10px + env(safe-area-inset-right,0px));
           top:calc(58px + env(safe-area-inset-top,0px))}
  #menuBar b{width:44px;height:44px;border-radius:12px;cursor:pointer;user-select:none;
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             background:rgba(11,16,38,.84);border:2px solid rgba(88,106,158,.92);color:#e8eeff;
             font-size:17px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.34);
             -webkit-tap-highlight-color:transparent}
  #menuBar b i{font-size:9px;font-style:normal;color:#9fb0dd;margin-top:2px;letter-spacing:0}
  #menuBar b:active{background:rgba(58,90,154,.96);transform:scale(.95)}
  #menuBar b.off{opacity:.42}

  /* 竖屏 / 窄屏：收起文字提示，压缩 HUD，避免遮挡画面 */
  @media (max-width:600px),(orientation:portrait){
    #hint{display:none}
    #hud{font-size:11px;padding:6px 9px;line-height:1.5;max-width:52vw}
    #toast{bottom:calc(190px + env(safe-area-inset-bottom,0px));font-size:13px;padding:7px 14px}
    #gear{width:34px;height:34px;font-size:16px;top:calc(6px + env(safe-area-inset-top,0px))}
    #menuBar{top:calc(46px + env(safe-area-inset-top,0px));gap:6px}
    #menuBar b{width:38px;height:38px;border-radius:10px;font-size:15px}
    #menuBar b i{font-size:8px}
    #zone{font-size:17px;letter-spacing:2px;padding:9px 22px 8px;top:12%}
    #clock{font-size:11px;padding:4px 10px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
    /* 小屏：任务条落到摇杆正上方左侧，不再跟 HUD / 设置键抢顶部空间 */
    #quest{left:calc(10px + env(safe-area-inset-left,0px));top:auto;transform:none;
           bottom:calc(136px + env(safe-area-inset-bottom,0px));
           max-width:calc(100vw - 24px);font-size:11.5px;padding:6px 12px;gap:7px}
    #dlg{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 13px 8px}
    #dlgTxt{font-size:13.5px}
    #dlgWho{font-size:11.5px;margin-bottom:5px}
    /* 小屏摇杆缩到 118px，摇杆头同步缩小；半径由 JS 按实际宽度换算，仍跟手 */
    #pad{width:118px;height:118px}
    #pad i{width:50px;height:50px;margin:-25px 0 0 -25px}
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">加载中…</div>
<div id="hint">按住屏幕任意位置朝一个方向拖 → 走路（不按不动） · 双击屏幕切全屏 · 撞上馆主挑战道馆 · 集齐 8 枚徽章挑战冠军 · 右上 🏅 看徽章盒 · 方向键/WASD · Q/E/B 开图鉴/队伍/背包</div>
<div id="toast"></div>
<div id="zone"></div>
<div id="clock"></div>
<div id="quest"><b>任务</b><span id="questTxt"></span><em id="questNum"></em></div>
<div id="dlg"><div id="dlgWho"></div><div id="dlgTxt"></div><div id="dlgNext">点击继续 ▸</div></div>
<div id="ending"><div id="endBox">
  <h2>通 关</h2>
  <div class="sub">灵契大陆 · 新的冠军</div>
  <div id="endRows"></div>
  <button id="endBtn">继续自由探索</button>
</div></div>
<div id="err"></div>
<div id="gear" title="设置">⚙</div>
<div id="menuBar">
  <b data-page="dex" title="精灵图鉴 (Q)">📖<i>图鉴</i></b>
  <b data-page="team" title="我的队伍 (E)">🐾<i>队伍</i></b>
  <b data-page="bag" title="背包 (B)">🎒<i>背包</i></b>
  <b data-page="badge" title="徽章盒">🏅<i>徽章</i></b>
</div>
<div id="cfg">
  <div id="cfgBox">
    <h3>设置</h3>
    <div class="sub">音乐与音效由 WebAudio 实时合成，无外部音频素材</div>
    <div class="cfgRow"><b>音乐</b><input type="range" id="vMusic" min="0" max="100" step="1"><span id="vMusicN">55</span></div>
    <div class="cfgRow"><b>音效</b><input type="range" id="vSfx" min="0" max="100" step="1"><span id="vSfxN">75</span></div>
    <div id="cfgMute">全部静音</div>
    <button id="cfgClose">关闭</button>
  </div>
</div>
<div id="pad"><u data-t="u"></u><u data-t="d"></u><u data-t="l"></u><u data-t="r"></u><i></i></div>

<script src="phaser.min.js"></script>
<script src="phaser-assets.js"></script>
<script>
(function () {
  var errEl = document.getElementById('err');
  function fatal(msg){ errEl.style.display='flex'; errEl.textContent=msg; }
  if (typeof Phaser === 'undefined'){ fatal('Phaser 4 未能加载：请确认 phaser.min.js 与本 HTML 在同一文件夹。'); return; }
  if (!window.SR){ fatal('资源数据包未能加载：请确认 phaser-assets.js 与本 HTML 在同一文件夹。'); return; }

  var SR = window.SR;
  var FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif';

  // ===== 基础常量（与 src/data/tiles.js 一致）=====
  var TILE = 32, MAP_W = 48, MAP_H = 34;
  var T = SR.T;
  var TNAME = ['草地','高草','道路','树木','水面','岩石','雪地','沙地','熔岩','遗迹'];
  var WALK = [true,true,true,false,false,false,true,true,false,true];
  var ENC = SR.ENC_CHANCE;
  var HUB = { x:25, y:17 };

  // 遇敌池：40 只精灵必须全部至少出现在一个池里。
  // batch5 时有 6 只（s5/s26/s27/s28/s31/s37）不在任何池 —— 图鉴永远收不齐。
  // 这批按属性归位补进对应群系，并用 test_story 断言覆盖率达到 40/40。
  var BIOMES = [
    { key:'plains',  name:'微风草原', cx:8,  cy:8,  r:7, pools:['s1','s3','s11','s9','s18','s23','s35','s28'], rare:'s18', sub:'开阔草场 · 微风掠过芒草',
      sky:[0.62,0.80,0.96], ground:[0.48,0.74,0.44], hill:[0.36,0.58,0.36] },
    { key:'forest',  name:'低语森林', cx:8,  cy:26, r:7, pools:['s3','s12','s1','s10','s22','s24','s39'], rare:'s39', sub:'密林深处 · 树影与孢子',
      sky:[0.34,0.52,0.44], ground:[0.26,0.44,0.32], hill:[0.16,0.30,0.22] },
    { key:'lake',    name:'碧波湖',   cx:22, cy:7,  r:7, pools:['s2','s9','s4','s19','s20','s21'],       rare:'s20', sub:'碧水岸边 · 潮湿沙洲',
      sky:[0.53,0.76,0.94], ground:[0.36,0.66,0.72], hill:[0.30,0.52,0.62] },
    { key:'volcano', name:'灰烬火山', cx:41, cy:8,  r:7, pools:['s1','s11','s13','s7','s16','s17','s33'], rare:'s17', sub:'熔岩地貌 · 灼热岩层',
      sky:[0.42,0.26,0.22], ground:[0.30,0.20,0.18], hill:[0.22,0.14,0.14] },
    { key:'snow',    name:'霜白雪原', cx:41, cy:26, r:7, pools:['s8','s13','s7','s33','s34'],            rare:'s33', sub:'极寒高原 · 霜与冰晶',
      sky:[0.72,0.84,0.94], ground:[0.84,0.90,0.95], hill:[0.64,0.75,0.85] },
    { key:'desert',  name:'流沙荒漠', cx:22, cy:27, r:6, pools:['s7','s13','s4','s32','s25','s31','s26'], rare:'s25', sub:'流沙之地 · 干热风蚀',
      sky:[0.90,0.76,0.50], ground:[0.86,0.72,0.46], hill:[0.74,0.58,0.34] },
    { key:'ruins',   name:'遗忘遗迹', cx:13, cy:17, r:4, pools:['s10','s6','s14','s29','s30','s38','s5','s27'], rare:'s38', sub:'上古石阵 · 无人的守夜',
      sky:[0.36,0.34,0.46], ground:[0.40,0.39,0.46], hill:[0.26,0.25,0.34] },
    { key:'ridge',   name:'龙脊山道', cx:35, cy:17, r:4, pools:['s14','s15','s7','s40','s36','s37'], rare:'s40', sub:'龙脊山道 · 高处强风',
      sky:[0.56,0.60,0.68], ground:[0.48,0.48,0.52], hill:[0.32,0.33,0.40] }
  ];
  var BIOME_BY_KEY = {}; BIOMES.forEach(function(b){ BIOME_BY_KEY[b.key]=b; });

  /* =====================================================================
     主线骨架：八大道馆 · 徽章 · 冠军（batch 9）

     - 八个群系各一座道馆，馆主站在该群系地标旁（摆放见 placeGyms）
     - **不设硬锁**：玩家想去哪个道馆就去哪个，等级差本身形成劝退。
       用户要求「保留一定自由探索」，所以除了冠军（需 8 徽章）之外没有门槛。
     - 队伍每只写死 [物种id, 阶, 等级]，不走全局等级公式 ——
       公式会把后两馆压成同一水平，难度曲线立不住。
     - 阶：0=一阶 1=二阶 2=三阶，影响形象与属性倍率（stageScale）
     ===================================================================== */
  var GYMS = [
    { key:'plains',  badge:'萌芽徽章', icon:'leaf',    color:0x6BD36B,
      leader:'草原少年 阿澈', title:'风语学徒', el:'草',
      cloth:'#6BBF59', cloth2:'#3E8E41', hair:'#6B4A2B',
      intro:'草会记住每一次风的方向。让我看看你听得懂多少。',

      cloth:'#2E8B6B', cloth2:'#1C5E47', hair:'#3A2A1A',
      intro:'林子里每片叶子都在说话，你听见了吗？',
      win:'森林把你的脚步声记下来了。苔痕徽章归你。',
      team:[['s12',1,13],['s22',1,13],['s24',1,14]] },

    { key:'desert',  badge:'砂砾徽章', icon:'sand',    color:0xD8A84A,
      leader:'沙盗 漠', title:'流沙之手', el:'岩',
      cloth:'#D9A441', cloth2:'#A8762A', hair:'#3A2A1A',
      intro:'沙子从不站队，它只站在赢的人脚边。',
      win:'啧，你踩过的沙子比我稳。砂砾徽章，拿去。',
      team:[['s7',1,16],['s32',1,17]] },

    { key:'ruins',   badge:'夜辉徽章', icon:'moon',    color:0x8A78D8,

      for (var i=0;i<BIOMES.length;i++){ var b=BIOMES[i], d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
      if(!best) continue;
      if(bd>best.r){ biomeMap[y][x]=null; continue; }
      biomeMap[y][x]=best;
      var rel=bd/best.r, r=rng();
      switch(best.key){
        case 'plains': grid[y][x]= r<.72?T.TALL:T.GRASS; break;
        case 'forest': grid[y][x]= (rel>.72||r<.38)?T.TREE:T.TALL; break;
        case 'lake':   grid[y][x]= rel<.55?T.WATER : rel<.78?T.SAND : T.TALL; break;
        case 'volcano':grid[y][x]= rel<.34?T.LAVA : rel<.6?T.ROCK : (r<.28?T.ROCK:T.TALL); break;
        case 'snow':   grid[y][x]= rel<.85?T.SNOW:T.TALL; break;
        case 'desert': grid[y][x]= r<.18?T.TALL:T.SAND; break;
        case 'ruins':  grid[y][x]= r<.2?T.ROCK:T.RUIN; break;
        case 'ridge':  grid[y][x]= r<.4?T.ROCK : (r<.62?T.TALL:T.PATH); break;
      }
    }
    for (var y=HUB.y-4;y<=HUB.y+4;y++) for (var x=HUB.x-4;x<=HUB.x+4;x++){
      if (x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) continue;
      grid[y][x]=T.PATH; biomeMap[y][x]=null;
    }
    function carveTo(tx,ty){
      var x=HUB.x, y=HUB.y;
      while(x!==tx){ x+=Math.sign(tx-x); if(x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ grid[y][x]=T.PATH; biomeMap[y][x]=null; } }
      while(y!==ty){ y+=Math.sign(ty-y); if(x>=2&&x<MAP_W-2&&y>=2&&y<MAP_H-2){ grid[y][x]=T.PATH; biomeMap[y][x]=null; } }
    }
    for (var j=0;j<BIOMES.length;j++) carveTo(BIOMES[j].cx, BIOMES[j].cy);
    return { grid:grid, biomeMap:biomeMap };
  }
  function biomeAt(x,y,biomeMap){
    if (x>=0&&y>=0&&x<MAP_W&&y<MAP_H && biomeMap[y][x]) return biomeMap[y][x];
    var best=null, bd=1e9;
    for (var i=0;i<BIOMES.length;i++){ var b=BIOMES[i], d=Math.hypot(x-b.cx,y-b.cy); if(d<bd){bd=d;best=b;} }
    return best;
  }

  /* =====================================================================
     枢纽镇域（batch 9）

     地图上有 849/1632 格没有群系归属 —— 那是十字商道和群系之间的荒野。
     biomeAt 对这类格子会「就近兜底」成最近的群系，于是灵契广场被念成
     「流沙荒漠」、天气下成沙暴。以前没人站在广场上，问题不明显；
     batch9 把长老和冠军都放进了广场，这个错位就影响剧情观感了。

     这里给枢纽一块显式镇域，显示与天气优先用它；biomeAt 本身不动，
     以免影响其他按群系走的逻辑（遇敌池、地表配色）。
     ===================================================================== */
  var HUB_R = 4;                                   // 9×9 的镇域，实测不侵占任何群系
  var TOWN_ZONE = { key:'town', name:'灵契镇', sub:'中央枢纽 · 十字商道' };
  function inHub(x,y){
    return Math.abs(x-HUB.x) <= HUB_R && Math.abs(y-HUB.y) <= HUB_R;
  }
  function zoneOf(x,y,biomeMap){
    if (inHub(x,y)) return TOWN_ZONE;
    return biomeAt(x,y,biomeMap) || TOWN_ZONE;
  }

  // ===== 可达性 + 实体放置 =====
  var kOf = function(x,y){ return x+','+y; };
  function computeReachable(grid){
    var reachable = new Set(), sx=HUB.x, sy=HUB.y+2;
    if(!WALK[grid[sy][sx]]) return reachable;
    var q=[{x:sx,y:sy}]; reachable.add(kOf(sx,sy));
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      var cur=q.shift();
      for(var i=0;i<4;i++){
        var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1], k=kOf(nx,ny);
        if(reachable.has(k)) continue;
        if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
        if(!WALK[grid[ny][nx]]) continue;
        reachable.add(k); q.push({x:nx,y:ny});
      }
    }
    return reachable;
  }
  function snapWalkable(grid, reachable, occupied, x, y){
    if(x<0||y<0||x>=MAP_W||y>=MAP_H) return {x:HUB.x,y:HUB.y};
    for(var r=0;r<16;r++){
      for(var dy=-r;dy<=r;dy++) for(var dx=-r;dx<=r;dx++){
        var nx=x+dx, ny=y+dy;
        if(nx<2||ny<2||nx>=MAP_W-2||ny>=MAP_H-2) continue;
        if(!WALK[grid[ny][nx]]) continue;
        if(occupied.has(kOf(nx,ny))) continue;
        if(reachable.size && !reachable.has(kOf(nx,ny))) continue;
        return {x:nx,y:ny};
      }
    }
    return {x:HUB.x,y:HUB.y};
  }
  function buildEntities(grid, reachable, lm){
    var occupied = new Set(), ent = { trainers:[], items:[], heal:null, npcs:[] };
    var hp = snapWalkable(grid, reachable, occupied, HUB.x-1, HUB.y-1);
    occupied.add(kOf(hp.x,hp.y)); ent.heal = {x:hp.x,y:hp.y};
    // 馆主站在自己地标的正下方：玩家一进群系就能看到「建筑 + 门口的人」，
    // 不需要额外找。找不到对应地标时退回原逻辑（群系中心右下方）
    TRAINER_DEFS.forEach(function(def){
      var b = BIOME_BY_KEY[def.key];
      var mark = null, i;
      for (i=0; i<(lm||[]).length; i++) if (lm[i].kind === MARK_FOR[def.key]) mark = lm[i];
      var ax = b.cx+2, ay = b.cy+2;
      if (mark){
        ax = Math.round(mark.x + mark.w/2);
        ay = Math.round(mark.y + mark.h) + 1;
      }
      var p = snapWalkable(grid, reachable, occupied, ax, ay);
      occupied.add(kOf(p.x,p.y));
      ent.trainers.push({ key:def.key, name:def.name, cloth:def.cloth, cloth2:def.cloth2,
                          hair:def.hair, x:p.x, y:p.y });
    });
    // 剧情 NPC：按 at 的大致坐标就近吸附到可走空格
    STORY_NPCS.forEach(function(def){
      var p = snapWalkable(grid, reachable, occupied, def.at[0], def.at[1]);
      occupied.add(kOf(p.x,p.y));
      ent.npcs.push({ key:def.key, name:def.name, role:def.role, x:p.x, y:p.y });
    });
    var spots=[];
    BIOMES.forEach(function(b){ spots.push([b.cx-2,b.cy-2]); spots.push([b.cx+2,b.cy-3]); });
    spots.push([HUB.x+3,HUB.y+2]); spots.push([HUB.x-3,HUB.y+3]);
    var kinds=['balls','candy','stone'];
    ent.items=[];
    spots.forEach(function(sp,i){
      var p = snapWalkable(grid, reachable, occupied, sp[0], sp[1]);
      occupied.add(kOf(p.x,p.y));
      ent.items.push({ x:p.x, y:p.y, kind:kinds[i%kinds.length], taken:false, spr:null });
    });
    return ent;
  }

  // ===== 立绘纹理（data URI -> 纹理，完全离线）=====
  function loadTex(scene, key){
    return new Promise(function(resolve){
      if (scene.textures.exists(key)) return resolve(true);
      var data = SR.ART[key];
      if (!data) return resolve(false);
      var img = new Image();
      img.onload = function(){
        try { scene.textures.addImage(key, img); resolve(true); }
        catch(e){ resolve(false); }
      };
      img.onerror = function(){ resolve(false); };
      img.src = data;
    });
  }
  function artKey(sp, stage){ return sp.id+'_'+stage; }

  // ===== 属性配色 =====
  var TYPEC = {
    none:[0xdfe6f2], fire:[0xff6b35,0xffb347,0xffe066], water:[0x4d96ff,0x7fc4ff,0xd6ecff],
    grass:[0x5fd068,0x9ae86f,0xd9f7a8], electric:[0xffd93d,0xfff3a0,0xfffbe0],
    light:[0xffe27a,0xfff6c8,0xffffff], dark:[0x9b6dff,0x6b45c9,0x2a1a4a],
    rock:[0xc08552,0xe0b080,0x8a5a2e], ice:[0x7fd8e8,0xd6f4fb,0xffffff],
    wind:[0x76e0a8,0xc6f7e0,0xffffff], psychic:[0xff8fd0,0xffc8e8,0xffffff],
    dragon:[0x6b5cff,0xa99bff,0xffd93d]
  };
  function typeC(t){ return TYPEC[t]||TYPEC.none; }

  /* =====================================================================
     音频系统：WebAudio 实时合成，零外部音频素材（无版权风险）
     - BGM：程序化音序器，按场景换曲；同一首不重播（切场景不重启）
     - SFX：合成音效（点击/属性命中/升级/捕捉/胜负…）
     - 音乐与音效独立音量，可全局静音，设置写入 localStorage
     - 手机自动播放限制：首次用户手势后 unlock()
     ===================================================================== */
  var AUDIO = (function(){
    var AC = window.AudioContext || window.webkitAudioContext;
    var SKEY = 'sr_phaser_audio_v1';
    var cfg = { music:0.55, sfx:0.75, muted:false };
    try {
      var raw = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if (raw && typeof raw === 'object'){
        if (typeof raw.music === 'number') cfg.music = clamp(raw.music,0,1);
        if (typeof raw.sfx   === 'number') cfg.sfx   = clamp(raw.sfx,0,1);
        cfg.muted = !!raw.muted;
      }
    } catch(e){}

    var ac=null, master=null, mBus=null, sBus=null, noiseBuf=null;
    var cur=null, timer=null, stepIdx=0, nextAt=0;

    function persist(){ try { localStorage.setItem(SKEY, JSON.stringify(cfg)); } catch(e){} }
    function mf(n){ return 440 * Math.pow(2, (n-69)/12); }

    function boot(){
      if (ac || !AC) return ac;
      try { ac = new AC(); } catch(e){ return null; }
      master = ac.createGain(); master.gain.value = cfg.muted ? 0 : 1; master.connect(ac.destination);
      mBus = ac.createGain(); mBus.gain.value = cfg.music * 0.5; mBus.connect(master);
      sBus = ac.createGain(); sBus.gain.value = cfg.sfx; sBus.connect(master);
      var n = Math.floor(ac.sampleRate * 0.7);
      noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i=0;i<n;i++) d[i] = Math.random()*2-1;
      return ac;
    }

    function tone(freq, at, dur, type, peak, bus, glideTo){
      if (!ac) return;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, at);
      if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), at + dur);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), at + Math.min(0.02, dur*0.3));
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(bus || sBus);
      o.start(at); o.stop(at + dur + 0.04);
    }
    function noise(at, dur, peak, f0, f1, kind, q){
      if (!ac || !noiseBuf) return;
      var s = ac.createBufferSource(); s.buffer = noiseBuf;
      var bp = ac.createBiquadFilter(); bp.type = kind || 'bandpass';
      bp.frequency.setValueAtTime(f0, at);
      bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), at + dur);
      bp.Q.value = (q === undefined) ? 1.2 : q;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), at + Math.min(0.015, dur*0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      s.connect(bp); bp.connect(g); g.connect(sBus);
      s.start(at); s.stop(at + dur + 0.04);
    }

    // 曲库：lead 为 16 步（八分音符）相对 root 的半音偏移，bass 为每 4 步一个音
    var TRACKS = {
      town:    { bpm:100, wave:'triangle', root:69, lead:[0,4,7,12, 7,4,2,4, 0,4,7,11, 9,7,4,2],      bass:[0,-5,-8,-5] },
      plains:  { bpm:106, wave:'triangle', root:67, lead:[0,4,7,9, 7,4,2,4, 0,4,7,12, 9,7,4,2],       bass:[0,-5,-7,-5] },
      forest:  { bpm:92,  wave:'triangle', root:64, lead:[0,3,7,10, 7,3,0,null, 5,7,10,12, 10,7,5,3], bass:[0,-5,-7,-5] },
      lake:    { bpm:84,  wave:'sine',     root:62, lead:[0,7,12,7, 5,9,12,9, 3,7,10,7, 2,5,9,5],     bass:[0,-5,-9,-7] },
      volcano: { bpm:124, wave:'sawtooth', root:50, lead:[0,0,3,0, 5,3,0,-2, 0,0,3,5, 7,5,3,0],       bass:[0,-2,-5,-2] },
      snow:    { bpm:80,  wave:'sine',     root:72, lead:[0,4,7,12, 11,7,4,2, 0,4,9,12, 14,12,9,7],   bass:[0,-7,-5,-7] },
      desert:  { bpm:104, wave:'triangle', root:65, lead:[0,1,5,7, 8,7,5,1, 0,1,5,10, 8,5,1,-2],      bass:[0,-5,-7,-5] },
      ruins:   { bpm:76,  wave:'sine',     root:60, lead:[0,3,7,10, 12,10,7,3, 0,3,8,10, 12,8,3,-2],  bass:[0,-4,-7,-4] },
      ridge:   { bpm:112, wave:'triangle', root:64, lead:[0,5,7,12, 10,7,5,3, 0,5,9,12, 14,12,9,5],   bass:[0,-5,-7,-5] },
      battle:  { bpm:150, wave:'square',   root:69, lead:[0,7,12,7, 3,10,12,10, 0,7,12,15, 14,12,10,7], bass:[0,0,-5,-3] }
    };
    function gainFor(w){ return w==='square' ? 0.042 : w==='sawtooth' ? 0.05 : 0.075; }

    function playStep(tr, i, at, sd){
      var lg = gainFor(tr.wave);
      var n = tr.lead[i];
      if (n !== null && n !== undefined){
        tone(mf(tr.root + n), at, sd*1.55, tr.wave, lg, mBus);
        tone(mf(tr.root + n + 12), at, sd*0.7, 'sine', lg*0.30, mBus);
      }
      if (i % 4 === 0){
        var bn = tr.bass[(i/4) % tr.bass.length];
        if (bn !== null && bn !== undefined) tone(mf(tr.root + bn), at, sd*3.2, 'sine', lg*1.45, mBus);
      }
    }
    function pump(){
      if (!ac || !cur) return;
      var tr = TRACKS[cur]; if (!tr) return;
      var sd = 60 / tr.bpm / 2, guard = 0;
      while (nextAt < ac.currentTime + 0.32 && guard++ < 64){
        playStep(tr, stepIdx % tr.lead.length, nextAt, sd);
        stepIdx++; nextAt += sd;
      }
    }
    function start(){
      if (!ac || ac.state === 'suspended' || timer) return;
      nextAt = ac.currentTime + 0.08;
      timer = setInterval(pump, 110);
      pump();
    }
    function setTrack(k){
      if (!k) return;
      if (cur === k && timer) return;          // 同曲不重播
      cur = k; stepIdx = 0;
      start();
    }
    function unlock(){
      boot();
      if (!ac) return;
      if (ac.state === 'suspended'){
        var p = ac.resume();
        if (p && p.then) p.then(start); else start();
      } else start();
    }

    function sfx(name){
      boot();
      if (!ac || cfg.muted || cfg.sfx <= 0) return;
      var t = ac.currentTime + 0.002;

      if (name.indexOf('hit_') === 0){
        var map = {
          hit_fire:[700,160,'sawtooth',140],  hit_water:[1500,340,'sine',260],
          hit_grass:[900,320,'triangle',200], hit_zap:[2600,900,'square',520],
          hit_ice:[2400,700,'sine',420],      hit_rock:[380,110,'sawtooth',90],
          hit_dark:[520,140,'triangle',120],  hit_light:[2200,1200,'sine',700],
          hit_wind:[1200,420,'triangle',300], hit_psychic:[1600,600,'sine',380],
          hit_dragon:[600,220,'sawtooth',160]
        };
        var m = map[name] || [1000,400,'triangle',180];
        noise(t, 0.26, 0.14, m[0], m[1], 'bandpass', 0.9);
        tone(m[3], t, 0.20, m[2], 0.055, null, m[3]*0.4);
        return;
      }

      switch(name){
        case 'click':    tone(1180, t, 0.045, 'square', 0.055); break;
        case 'select':   tone(880, t, 0.06, 'triangle', 0.085); tone(1320, t+0.05, 0.09, 'triangle', 0.065); break;
        case 'bump':     tone(190, t, 0.07, 'sine', 0.09, null, 120); break;
        case 'item':     tone(880, t, 0.09, 'triangle', 0.09); tone(1175, t+0.08, 0.12, 'triangle', 0.08); break;
        case 'heal':     [0,4,7,12].forEach(function(s,i){ tone(mf(76+s), t+i*0.09, 0.32, 'sine', 0.075, mBus); }); break;
        case 'encounter':[0,7,12].forEach(function(s,i){ tone(mf(69+s), t+i*0.11, 0.16, 'square', 0.055); });
                         noise(t+0.33, 0.5, 0.09, 300, 2600, 'bandpass'); break;
        case 'faint':    tone(440, t, 0.55, 'sawtooth', 0.07, null, 70); break;
        case 'levelup':  [0,4,7,12,16].forEach(function(s,i){ tone(mf(72+s), t+i*0.075, 0.26, 'triangle', 0.085); }); break;
        case 'win':      [0,4,7,12,7,12,16].forEach(function(s,i){ tone(mf(69+s), t+i*0.13, 0.30, 'triangle', 0.085); }); break;
        case 'lose':     [0,-3,-7,-12].forEach(function(s,i){ tone(mf(64+s), t+i*0.20, 0.42, 'sine', 0.095); }); break;
        case 'throw':    noise(t, 0.34, 0.085, 500, 2800, 'bandpass'); break;
        case 'shake':    tone(320, t, 0.055, 'square', 0.06); break;
        case 'caught':   [0,4,7,12,16,19].forEach(function(s,i){ tone(mf(72+s), t+i*0.075, 0.34, 'triangle', 0.09); }); break;
        case 'escape':   tone(300, t, 0.16, 'square', 0.065, null, 160); break;
        case 'land':     tone(150, t, 0.10, 'sine', 0.075, null, 90); break;
        default: break;
      }
    }

    return {
      unlock: unlock,
      track: setTrack,
      sfx: sfx,
      typeHit: function(tp){ sfx('hit_' + ((tp && tp !== 'none') ? tp : 'none')); },
      setMusic: function(v){ cfg.music = clamp(v,0,1); if (mBus) mBus.gain.value = cfg.music*0.5; persist(); },
      setSfx:   function(v){ cfg.sfx   = clamp(v,0,1); if (sBus) sBus.gain.value = cfg.sfx; persist(); },
      setMuted: function(b){ cfg.muted = !!b; if (master) master.gain.value = cfg.muted ? 0 : 1; persist(); },
      cfg: cfg
    };
  })();

  // 群系 → 曲目（城镇用 town）
  var BIO_TRACK = {
    town:'town',
    plains:'plains', forest:'forest', lake:'lake', volcano:'volcano',
    snow:'snow', desert:'desert', ruins:'ruins', ridge:'ridge'
  };

  // 设置面板（音乐/音效独立音量 + 静音），只绑定一次
  var _audioUI = false;
  function initAudioUI(){
    if (_audioUI) return; _audioUI = true;
    var gear = document.getElementById('gear');
    var box = document.getElementById('cfg');
    var vM = document.getElementById('vMusic'), vS = document.getElementById('vSfx');
    var nM = document.getElementById('vMusicN'), nS = document.getElementById('vSfxN');
    var mute = document.getElementById('cfgMute');
    if (!gear || !box || !vM || !vS) return;

    vM.value = Math.round(AUDIO.cfg.music*100); nM.textContent = vM.value;
    vS.value = Math.round(AUDIO.cfg.sfx*100);   nS.textContent = vS.value;
    function paintMute(){
      mute.classList.toggle('on', AUDIO.cfg.muted);
      mute.textContent = AUDIO.cfg.muted ? '已静音（点击恢复）' : '全部静音';
    }
    paintMute();

    gear.addEventListener('click', function(){ box.classList.add('on'); AUDIO.sfx('click'); });
    document.getElementById('cfgClose').addEventListener('click', function(){ box.classList.remove('on'); AUDIO.sfx('click'); });
    box.addEventListener('click', function(ev){ if (ev.target === box) box.classList.remove('on'); });
    vM.addEventListener('input', function(){ nM.textContent = vM.value; AUDIO.setMusic(vM.value/100); });
    vS.addEventListener('input', function(){ nS.textContent = vS.value; AUDIO.setSfx(vS.value/100); AUDIO.sfx('click'); });
    mute.addEventListener('click', function(){
      AUDIO.setMuted(!AUDIO.cfg.muted); paintMute(); AUDIO.sfx('select');
    });
  }

  /* =====================================================================
     虚拟摇杆数学（纯函数，与 DOM 无关，便于单测）
     · 格子上不允许对角移动，所以斜推时按位移大的那根轴取整
     · 死区内返回 null，避免手指轻微抖动导致连续走路
     ===================================================================== */
  function stickClamp(dx, dy, radius){
    var len = Math.sqrt(dx*dx + dy*dy);
    if (len > radius && len > 0){ dx = dx/len*radius; dy = dy/len*radius; }
    return { x:dx, y:dy, len:Math.min(len, radius) };
  }
  function stickDir(dx, dy, radius, dead){
    if (!(radius > 0)) return null;        // 底座还没布局（宽 0）时一律无输入，防"永远在上"
    var c = stickClamp(dx, dy, radius);
    if (c.len < dead) return null;
    return Math.abs(c.x) > Math.abs(c.y)
      ? (c.x > 0 ? 'right' : 'left')
      : (c.y > 0 ? 'down' : 'up');
  }

  /* ---------------- 点击 / 双击判定（纯函数） ----------------
     摇杆改成「按住任意位置拖动」之后，点击和拖动走的是同一套 pointer 事件，
     所以要能分清两者：按住时间短 + 最大位移小 = 点击；两次点击间隔短 + 落点近 = 双击。
     阈值集中在这里，测试直接打这几个数，避免调完参数忘了改断言。 */
  var TAP_HOLD = 260;    // 按住超过这么久算「长按」，不参与双击
  var TAP_MOVE = 14;     // 手指位移超过这个（px）就算拖动，不算点击
  var TAP_GAP  = 340;    // 两次点击的最大间隔（ms）
  var TAP_NEAR = 64;     // 两次点击落点允许的偏差（px）

  function isTap(holdMs, movedPx){
    return holdMs < TAP_HOLD && movedPx < TAP_MOVE;
  }
  function isDoubleTap(now, x, y, lastT, lastX, lastY){
    if (!lastT) return false;                       // 没有上一击
    var dt = now - lastT;
    if (dt < 0 || dt >= TAP_GAP) return false;       // 太慢；负值是系统时钟回拨，宁可不判
    return Math.abs(x - lastX) < TAP_NEAR && Math.abs(y - lastY) < TAP_NEAR;
  }

  /* =====================================================================
     主线剧情层（batch 9）：任务导引 / 对话 / 剧情角色

     三个设计取舍：

     1) 对话用 DOM 而不是 Phaser 场景。
        对话是纯文本 UI，不需要相机、resize、深度排序；DOM 版跨端最稳，
        而且与已有的 #hud / #toast / #zone 同一套视觉语言。

     2) 任务条只「指路」，不「拦路」。
        它永远指向第一个还没拿徽章的道馆，但玩家想去哪就去哪。
        用户要的是「保留一定自由探索」，硬锁会把这个做没。

     3) 剧情全部由 G.flags 驱动，不用单独的任务状态机。
        每段剧情只关心「这件事发生过没有」，读档写档只需一个对象。
     ===================================================================== */

  /* ---------------- 任务 ---------------- */
  function nextGym(){
    for (var i=0;i<GYMS.length;i++) if (G.badges.indexOf(GYMS[i].key) < 0) return GYMS[i];
    return null;
  }
  function questNow(){
    if (G.cleared)
      return { title:'旅程仍在继续', hint:'已通关 · 自由探索、收服全部精灵', num:'通关' };
    if (G.badges.length >= GYMS.length)
      return { title:'最终的挑战', hint:'回灵契广场东侧，挑战冠军 曜', num:'8/8' };
    if (!G.flags.metElder)
      return { title:'初入灵契', hint:'去灵契中心附近，找长老 岑 说话', num:'0/8' };
    var g = nextGym();
    return { title:'第 '+(G.badges.length+1)+' 枚徽章 · '+g.badge,
             hint:BIOME_BY_KEY[g.key].name+' · 挑战 '+g.leader,
             num:G.badges.length+'/'+GYMS.length };
  }
  function refreshQuest(){
    var q = questNow();
    var t = document.getElementById('questTxt'), n = document.getElementById('questNum');
    if (t) t.textContent = q.title + ' — ' + q.hint;
    if (n) n.textContent = q.num;
  }

  /* ---------------- 对话 ---------------- */
  var DLG = { open:false, lines:[], i:0, onDone:null, world:null };

  function renderTalk(){
    var ln = DLG.lines[DLG.i] || {};
    var who = document.getElementById('dlgWho');
    who.textContent = ln.who || '';
    who.style.display = ln.who ? '' : 'none';
    document.getElementById('dlgTxt').textContent = ln.text || '';
    document.getElementById('dlgNext').textContent =
      (DLG.i >= DLG.lines.length-1) ? '点击结束 ▸' : '点击继续 ▸';
  }
  function finishTalk(){
    var w = DLG.world, cb = DLG.onDone;
    DLG.open = false; DLG.lines = []; DLG.onDone = null; DLG.world = null;
    document.getElementById('dlg').classList.remove('on');
    document.body.classList.remove('talk');
    if (w){
      w.talking = false;
      if (w.setPad) w.setPad(true);
    }
    if (cb) cb();
  }
  function advanceTalk(){
    if (!DLG.open) return;
    DLG.i++;
    if (DLG.i >= DLG.lines.length){ finishTalk(); return; }
    renderTalk();
    AUDIO.sfx('click');
  }
  function say(lines, onDone, world){
    if (!lines || !lines.length){ if (onDone) onDone(); return; }
    DLG.lines = lines; DLG.i = 0; DLG.onDone = onDone || null; DLG.world = world || null;
    DLG.open = true;
    document.body.classList.add('talk');
    document.getElementById('dlg').classList.add('on');
    if (world){
      world.talking = true;
      if (world.setPad) world.setPad(false);
    }
    renderTalk();
    AUDIO.sfx('click');
  }
  function bindTalkInput(){
    var box = document.getElementById('dlg');
    if (!box) return;
    box.addEventListener('pointerup', function(ev){ ev.preventDefault(); advanceTalk(); });
    window.addEventListener('keydown', function(ev){
      if (!DLG.open) return;
      if (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Escape'){
        ev.preventDefault(); advanceTalk();
      }
    });
  }

  /* ---------------- 通关结算 ---------------- */
  function showEnding(){
    var dt = dexTotals();
    var rows = [
      ['徽章',      G.badges.length+' / '+GYMS.length],
      ['图鉴收服',  dt.got+' / '+dt.total],
      ['图鉴见过',  dt.seen+' / '+dt.total],
      ['队伍规模',  G.party.length+' 只'],
      ['精灵球',    String(G.balls)]
    ];
    document.getElementById('endRows').innerHTML = rows.map(function(r){
      return '<div class="row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';
    }).join('');
    document.getElementById('ending').classList.add('on');
    document.getElementById('endBtn').onclick = function(){
      document.getElementById('ending').classList.remove('on');
      refreshQuest();
      AUDIO.sfx('click');
    };
    AUDIO.sfx('win');
  }

  /* =====================================================================
     世界场景（地图 / 移动 / NPC / 道具 / 遇敌）
     ===================================================================== */
  function WorldScene(){ Phaser.Scene.call(this, { key:'world' }); }
  WorldScene.prototype = Object.create(Phaser.Scene.prototype);
  WorldScene.prototype.constructor = WorldScene;

  /* =====================================================================
     batch6 · 地表美术系统（瓦片 / 装饰 / 烘焙）
     风格锚点：扁平赛璐璐、每色区两个扁平色 + 一条干净阴影边、无渐变噪点颗粒、
               明度按 0.30 暗 / 0.55 中 / 0.78 亮 三等分拉开。
     一致性：8 群系各自从 BIOMES.ground/hill 派生一套地面色 —— 同图案不同色温，
             与立绘、UI 共用同一套色相来源，不会出现拼凑感。
     性能：全部离屏 canvas 绘制后烘焙成 1 张静态地图纹理，1632 个 image → 1 个 draw call。
     ===================================================================== */

  // ---- 色彩工具 ----
  function shade(c,k){
    if (k<=1) return [c[0]*k, c[1]*k, c[2]*k];
    var t=k-1;
    return [c[0]+(1-c[0])*t, c[1]+(1-c[1])*t, c[2]+(1-c[2])*t];
  }
  function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  function lum(c){ return c[0]*0.299+c[1]*0.587+c[2]*0.114; }
  var CSS_BAD = 0, CSS_BAD_LOG = [];
  function css(c,a){
    // 防御：非法色值会让 canvas 忽略赋值、沿用上一次的 fillStyle（表现为纯黑描边）。
    // 这里强制归一化，越界标洋红方便一眼发现。
    if (!c || c.length!==3) { CSS_BAD++; if (CSS_BAD_LOG.length<10) CSS_BAD_LOG.push(['shape',String(c),a]); c=[1,0,1]; }
    var r=Math.round(clamp(c[0],0,1)*255), g=Math.round(clamp(c[1],0,1)*255), b=Math.round(clamp(c[2],0,1)*255);
    if (isNaN(r)||isNaN(g)||isNaN(b)) { CSS_BAD++; if (CSS_BAD_LOG.length<10) CSS_BAD_LOG.push(['nan',JSON.stringify(c),a]); r=255; g=0; b=255; }
    return 'rgba('+r+','+g+','+b+','+(a==null?1:a)+')';
  }
  // 确定性哈希：同一坐标永远同一变体，保证每次打开地图完全一致
  function h2(x,y,s){ var n=Math.sin(x*127.1+y*311.7+(s||0)*74.7)*43758.5453; return n-Math.floor(n); }

  var ROAD_SEED=[0.80,0.72,0.54], WATER_SEED=[0.24,0.56,0.84], ROCK_SEED=[0.58,0.59,0.65];
  // 明度校准：BIOMES.ground 是远景氛围色（天空/山体），直接当地砖色会过暗，
  // 这里强制把可通行地面锁在中间调，水抬亮、岩压暗 —— 玩家一眼能分出哪里不能走。
  function forceLum(c,target){
    var L=lum(c);
    if (L<0.0001) return [target,target,target];
    if (L>target){ var k=target/L; return [c[0]*k,c[1]*k,c[2]*k]; }
    var t=(target-L)/(1-L);
    return [c[0]+(1-c[0])*t, c[1]+(1-c[1])*t, c[2]+(1-c[2])*t];
  }
  function setLadder(p,key,base){
    base=clamp(base,0.14,0.94);
    p[key]=[forceLum(p[key][0],base),
            forceLum(p[key][0],Math.max(0.10,base*0.70)),
            forceLum(p[key][0],Math.min(0.99,base*1.26))];
    return base;
  }
  var PAL = {};
  (function buildPalettes(){
    for (var i=0;i<BIOMES.length;i++){
      var b=BIOMES[i], g=b.ground, hh=b.hill, p={};
      // 先按群系派生，再用明度阶梯重排：草=中间调，路/水更亮，高草/林地/岩更暗
      p.grass=[shade(g,1.06),0,0]; p.tall=[shade(g,0.90),0,0];
      p.road=[mixc(g,ROAD_SEED,0.62),0,0]; p.water=[mixc(WATER_SEED,g,0.25),0,0];
      // 石头只带一点环境色，保持中性才能跟地面拉开色距
      p.rock=[mixc(ROCK_SEED,hh,0.16),0,0];
      p.tree=[mixc(g,hh,0.55),0,0];
      var gl = lum(p.grass[0]);
      gl = setLadder(p,'grass', clamp(gl, 0.40, 0.72));          // 可通行地面下限 0.40
      setLadder(p,'tall',  Math.max(0.34, gl-0.07));              // 高草比草暗一档
      setLadder(p,'road',  Math.min(0.88, gl+0.07));              // 土路比草亮一档
      setLadder(p,'water', Math.min(0.90, gl+0.11));              // 水面反射天空 → 更亮但不刺眼
      // 岩石有绝对下限：遗迹/龙脊这类高亮地面的群系里，岩石按草地基准压暗会变成黑洞
      setLadder(p,'rock',  clamp(gl-0.02, 0.42, 0.60));   // 靠形状/高光辨识，不靠压黑
      // 树格只比草暗一档：树冠由 sprite 负责，地面若压太黑会在整图上形成黑描边
      setLadder(p,'tree',  Math.max(0.32, gl-0.09));
      // 四类特征地表：固定色相，只按群系平均明度做 ±8% 色温偏移
      var bias=clamp((lum(g)-0.52)*0.18,-0.08,0.08);
      p.snow=[shade([0.90,0.93,0.97],1+bias), shade([0.72,0.79,0.90],1+bias), [0.97,0.98,1.00]];
      p.sand=[shade([0.91,0.82,0.57],1+bias), shade([0.78,0.66,0.40],1+bias), shade([0.97,0.90,0.68],1+bias)];
      p.lava=[[0.74,0.26,0.10],[0.40,0.12,0.07],[1.00,0.68,0.18]];
      p.ruin=[shade([0.74,0.73,0.78],1+bias), shade([0.54,0.53,0.61],1+bias), shade([0.88,0.87,0.91],1+bias)];
      PAL[b.key]=p;
    }
  })();
  function palOf(bio){ return (bio && PAL[bio.key]) ? PAL[bio.key] : PAL.plains; }
  function baseOf(kind,p){
    return kind===1?p.tall : kind===2?p.road : kind===3?p.tree : kind===4?p.water :
           kind===5?p.rock : kind===6?p.snow : kind===7?p.sand : kind===8?p.lava :
           kind===9?p.ruin : p.grass;
  }

  // ---- 单格瓦片绘制（原点已在格左上角）----
  function paintTile(ctx, kind, p, v, gx, gy){
    var T=TILE, i, b=baseOf(kind,p);
    ctx.fillStyle=css(b[0]); ctx.fillRect(0,0,T,T);

    if (kind===0 || kind===1){
      // 草 / 高草：一簇一簇的叶片，位置按坐标哈希散开，不排成网格
      var n = kind===1 ? 9 : 5;
      ctx.lineWidth=1.4; ctx.lineCap='round';
      for (i=0;i<n;i++){
        var bx=3+h2(gx,gy,i*7+v)*26, by=11+h2(gx,gy,i*11+v)*19;
        var hg=(kind===1? 8+h2(gx,gy,i*13+v)*5 : 4+h2(gx,gy,i*13+v)*3);
        var ln=(h2(gx,gy,i*17+v)-0.5)*5;
        ctx.strokeStyle=css(b[2], kind===1?0.78:0.62);
        ctx.beginPath(); ctx.moveTo(bx,by);
        ctx.quadraticCurveTo(bx+ln*0.35, by-hg*0.62, bx+ln, by-hg);
        ctx.stroke();
      }
      ctx.fillStyle=css(b[1],0.22); ctx.fillRect(0,T-3,T,3);
    }
    else if (kind===2){
      // 道路：土面 + 碎石粒，底部一条暗边压住明度
      for (i=0;i<15;i++){
        var sx=1+h2(gx,gy,i*5+v)*30, sy=1+h2(gx,gy,i*9+v)*30;
        ctx.fillStyle=css(i%2?b[1]:b[2], 0.58);
        ctx.beginPath(); ctx.arc(sx,sy,0.6+h2(gx,gy,i*3+v)*1.2, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle=css(b[1],0.18); ctx.fillRect(0,T-2,T,2);
    }
    else if (kind===3){
      // 林下地面：树冠会盖在上面，这里只画落叶与根系阴影
      for (i=0;i<7;i++){
        var lx=2+h2(gx,gy,i*7+v)*28, ly=2+h2(gx,gy,i*11+v)*28;
        ctx.fillStyle=css(i%2?b[2]:b[1], 0.40);
        ctx.beginPath(); ctx.ellipse(lx,ly,2.2,1.2,0,0,6.2832); ctx.fill();
      }
    }
    else if (kind===4){
      // 水面：上亮下暗 + 两道浪头高光
      var lg=ctx.createLinearGradient(0,0,0,T);
      lg.addColorStop(0,css(b[0])); lg.addColorStop(1,css(b[1]));
      ctx.fillStyle=lg; ctx.fillRect(0,0,T,T);
      ctx.lineWidth=1.6; ctx.lineCap='round';
      for (i=0;i<2;i++){
        var wy=7+i*13+h2(gx,gy,i+v)*4, wx=3+h2(gx,gy,i*3+v)*11;
        ctx.strokeStyle=css(b[2],0.58);
        ctx.beginPath(); ctx.moveTo(wx,wy);
        ctx.quadraticCurveTo(wx+6,wy-2.4,wx+13,wy);
        ctx.stroke();
      }
    }
    else if (kind===5){
      // 岩石：一块大多边形 + 左上高光边 + 右下暗面
      ctx.fillStyle=css(b[1]); ctx.fillRect(0,0,T,T);
      var rw=25+v*1.6, rh=22+v*1.6, rx=(T-rw)/2, ry=(T-rh)/2;
      ctx.fillStyle=css(b[0]);
      ctx.beginPath();
      ctx.moveTo(rx+rw*0.10, ry+rh*0.34);
      ctx.lineTo(rx+rw*0.36, ry+rh*0.02);
      ctx.lineTo(rx+rw*0.74, ry+rh*0.06);
      ctx.lineTo(rx+rw*0.98, ry+rh*0.40);
      ctx.lineTo(rx+rw*0.82, ry+rh*0.86);
      ctx.lineTo(rx+rw*0.30, ry+rh*0.96);
      ctx.lineTo(rx+rw*0.02, ry+rh*0.60);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle=css(b[2],0.7); ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(rx+rw*0.36, ry+rh*0.02);
      ctx.lineTo(rx+rw*0.74, ry+rh*0.06);
      ctx.lineTo(rx+rw*0.98, ry+rh*0.40);
      ctx.stroke();
      ctx.fillStyle=css(b[1],0.65);
      ctx.beginPath();
      ctx.moveTo(rx+rw*0.82, ry+rh*0.86);
      ctx.lineTo(rx+rw*0.30, ry+rh*0.96);
      ctx.lineTo(rx+rw*0.02, ry+rh*0.60);
      ctx.lineTo(rx+rw*0.34, ry+rh*0.70);
      ctx.closePath(); ctx.fill();
    }
    else if (kind===6){
      // 雪地：白底 + 淡蓝阴影丘
      for (i=0;i<3;i++){
        var ax=4+h2(gx,gy,i*7+v)*24, ay=4+h2(gx,gy,i*11+v)*24;
        ctx.fillStyle=css(b[1],0.58);
        ctx.beginPath(); ctx.ellipse(ax,ay,6.2,3.0,h2(gx,gy,i+v)*3,0,6.2832); ctx.fill();
      }
    }
    else if (kind===7){
      // 沙地：两道风蚀沙纹
      ctx.lineWidth=2; ctx.lineCap='round';
      for (i=0;i<2;i++){
        var yy=9+i*12+h2(gx,gy,i+v)*5;
        ctx.strokeStyle=css(b[1],0.52);
        ctx.beginPath(); ctx.moveTo(-2,yy);
        ctx.quadraticCurveTo(T*0.5,yy+4,T+2,yy-1.5);
        ctx.stroke();
      }
    }
    else if (kind===8){
      // 熔岩：暗壳 + 发光裂缝（lighter 叠加做自发光感）
      ctx.fillStyle=css(b[1]); ctx.fillRect(0,0,T,T);
      ctx.globalCompositeOperation='lighter';
      ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle=css(b[2],0.85);
      for (i=0;i<2;i++){
        var x0=7+h2(gx,gy,i*9+v)*9;
        ctx.beginPath(); ctx.moveTo(x0,1);
        ctx.quadraticCurveTo(x0+7,T*0.38,x0-2,T*0.68);
        ctx.quadraticCurveTo(x0+4,T*0.86,x0+1,T+1);
        ctx.stroke();
      }
      ctx.globalCompositeOperation='source-over';
    }
    else if (kind===9){
      // 遗迹：错位砖缝
      ctx.strokeStyle=css(b[1],0.78); ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(0,11); ctx.lineTo(T,11);
      ctx.moveTo(0,22); ctx.lineTo(T,22);
      ctx.moveTo(11,0); ctx.lineTo(11,11);
      ctx.moveTo(22,11); ctx.lineTo(22,22);
      ctx.moveTo(11,22); ctx.lineTo(11,T);
      ctx.stroke();
      ctx.fillStyle=css(b[1],0.16); ctx.fillRect(0,T-2,T,2);
    }
  }

  // ---- 地面装饰：每群系一套花纹，只撒在可通行地面上 ----
  function paintDecor(ctx, key, a, b){
    var px=6+b*20, py=7+a*17, i, an;
    if (key==='plains'){
      ctx.fillStyle='rgba(255,255,255,0.90)';
      for (i=0;i<3;i++){
        an=i*2.094+a*2.2;
        ctx.beginPath(); ctx.arc(px+Math.cos(an)*2.3, py+Math.sin(an)*2.3, 2.1, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle='rgba(250,205,80,0.95)';
      ctx.beginPath(); ctx.arc(px,py,1.8,0,6.2832); ctx.fill();
    } else if (key==='forest'){
      ctx.fillStyle='rgba(232,226,206,0.95)'; ctx.fillRect(px-1.4,py,2.8,4);
      ctx.fillStyle='rgba(214,74,58,0.95)';
      ctx.beginPath(); ctx.ellipse(px,py,5,3.2,0,Math.PI,0); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(px-2,py-1.4,0.9,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(px+2.2,py-1,0.7,0,6.2832); ctx.fill();
    } else if (key==='lake'){
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(px,py,4.6,3.2,0,0,6.2832); ctx.fill();
      ctx.strokeStyle='rgba(120,150,170,0.65)'; ctx.lineWidth=1;
      for (i=1;i<3;i++){ ctx.beginPath(); ctx.arc(px,py,2.2*i*0.9,Math.PI*0.15,Math.PI*0.85); ctx.stroke(); }
    } else if (key==='volcano'){
      ctx.fillStyle='rgba(40,26,22,0.90)';
      ctx.beginPath(); ctx.moveTo(px-4,py+3); ctx.lineTo(px-1,py-3); ctx.lineTo(px+3,py+3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,150,60,0.75)';
      ctx.beginPath(); ctx.arc(px+4,py-3,1.2,0,6.2832); ctx.fill();
    } else if (key==='snow'){
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(px,py,6,3.4,0,0,6.2832); ctx.fill();
      ctx.strokeStyle='rgba(150,200,235,0.80)'; ctx.lineWidth=1.1;
      ctx.beginPath(); ctx.moveTo(px,py-5); ctx.lineTo(px,py+1);
      ctx.moveTo(px-3,py-3); ctx.lineTo(px+3,py-3); ctx.stroke();
    } else if (key==='desert'){
      ctx.fillStyle='rgba(150,120,70,0.65)';
      ctx.beginPath(); ctx.ellipse(px,py,4,2.2,0,0,6.2832); ctx.fill();
      ctx.fillStyle='rgba(196,168,110,0.80)';
      ctx.beginPath(); ctx.arc(px+3.5,py+1,1.4,0,6.2832); ctx.fill();
    } else if (key==='ruins'){
      ctx.fillStyle='rgba(150,146,158,0.90)';
      ctx.fillRect(px-3,py-1,5.5,4); ctx.fillRect(px+2,py+1,3,3);
      ctx.fillStyle='rgba(110,126,96,0.70)';
      ctx.beginPath(); ctx.arc(px-3.6,py+2.4,1.5,0,6.2832); ctx.fill();
    } else {
      ctx.fillStyle='rgba(120,118,124,0.85)';
      ctx.beginPath(); ctx.moveTo(px-4,py+2.6); ctx.lineTo(px-0.6,py-2.6); ctx.lineTo(px+3.4,py+2.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(160,150,110,0.60)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px+4,py+3); ctx.quadraticCurveTo(px+6,py,px+4.5,py-3); ctx.stroke();
    }
  }

  // 中央枢纽：石砌广场（独立配色，避免用最近群系色导致中央出现色块断层）
  var HUB_PAL = (function(){
    var q={}, src=PAL.plains, kk;
    for (kk in src) q[kk]=src[kk];
    q.ruin=[[0.80,0.79,0.76],[0.62,0.60,0.60],[0.92,0.91,0.88]];
    return q;
  })();
  // 参与柔边的「地面类」—— 树/水/岩/熔岩是物件格，不向外扩散暗色（否则全图出现黑描边）
  var GROUNDY = { 0:1, 1:1, 2:1, 6:1, 7:1, 9:1 };

  // ---- 整图烘焙：瓦片 → 柔边 → 湿润边缘 → 装饰 ----
  function bakeMap(grid, biomeMap, lmMask){
    var W=MAP_W*TILE, H=MAP_H*TILE;
    var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    var ctx=cv.getContext('2d');
    var x,y,k,bio,p,v,d,nx,ny,nk,nb;
    ctx.lineJoin='round';
    function isHubCore(px,py){ return Math.abs(px-HUB.x)<=3 && Math.abs(py-HUB.y)<=3; }

    // 1) 基础瓦片，3 变体按坐标哈希选，消除网格重复感
    for (y=0;y<MAP_H;y++) for (x=0;x<MAP_W;x++){
      k=grid[y][x]; bio=biomeAt(x,y,biomeMap);
      var core = isHubCore(x,y);
      p = core ? HUB_PAL : palOf(bio);
      v = Math.floor(h2(x,y,3)*3);
      ctx.save(); ctx.translate(x*TILE,y*TILE);
      paintTile(ctx, core ? 9 : k, p, v, x, y);
      ctx.restore();
    }

    // 1.5) 每格极淡明暗浮动 + 全局方向光：打散大片同色，消除"色块拼贴感"
    for (y=0;y<MAP_H;y++) for (x=0;x<MAP_W;x++){
      var nz=h2(x,y,61);
      ctx.fillStyle = nz<0.5 ? 'rgba(0,0,0,'+(0.05*(0.5-nz)*2).toFixed(3)+')'
                             : 'rgba(255,255,255,'+(0.045*(nz-0.5)*2).toFixed(3)+')';
      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
    var glow=ctx.createLinearGradient(0,0,W,H);
    glow.addColorStop(0,'rgba(255,248,225,0.055)');
    glow.addColorStop(0.45,'rgba(0,0,0,0)');
    glow.addColorStop(1,'rgba(8,12,30,0.085)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

    // 2) 柔边：只在地面类之间过渡，3px 半透明混邻格底色
    var DX=[0,1,0,-1], DY=[-1,0,1,0];
    for (y=0;y<MAP_H;y++) for (x=0;x<MAP_W;x++){
      k=grid[y][x];
      if (!GROUNDY[k]) continue;
      for (d=0;d<4;d++){
        nx=x+DX[d]; ny=y+DY[d];
        if (nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
        nk=grid[ny][nx];
        if (!GROUNDY[nk] || nk===k) continue;
        if (isHubCore(x,y) && isHubCore(nx,ny)) continue;   // 广场内部不留接缝
        // 注意：baseOf 返回的是「三阶色组」，这里要取 [0] 底色，直接传数组会得到 NaN
        nb = isHubCore(nx,ny) ? HUB_PAL.ruin[0] : baseOf(nk, palOf(biomeAt(nx,ny,biomeMap)))[0];
        ctx.fillStyle=css(nb,0.30);
        if (d===0) ctx.fillRect(x*TILE, y*TILE, TILE, 3);
        else if (d===1) ctx.fillRect(x*TILE+TILE-3, y*TILE, 3, TILE);
        else if (d===2) ctx.fillRect(x*TILE, y*TILE+TILE-3, TILE, 3);
        else ctx.fillRect(x*TILE, y*TILE, 3, TILE);
      }
    }

    // 3) 物件边缘：水岸提亮一圈湿边、熔岩岸加暖光，让结构物有明确轮廓但不发黑
    for (y=0;y<MAP_H;y++) for (x=0;x<MAP_W;x++){
      k=grid[y][x];
      if (!GROUNDY[k]) continue;
      for (d=0;d<4;d++){
        nx=x+DX[d]; ny=y+DY[d];
        if (nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
        nk=grid[ny][nx];
        if (nk!==4 && nk!==8) continue;
        var isW = nk===4;
        var col = isW ? baseOf(4, palOf(biomeAt(nx,ny,biomeMap)))[2] : [1.0,0.58,0.22];
        ctx.fillStyle=css(col, isW?0.42:0.30);
        if (d===0) ctx.fillRect(x*TILE, y*TILE, TILE, 3);
        else if (d===1) ctx.fillRect(x*TILE+TILE-3, y*TILE, 3, TILE);
        else if (d===2) ctx.fillRect(x*TILE, y*TILE+TILE-3, TILE, 3);
        else ctx.fillRect(x*TILE, y*TILE, 3, TILE);
      }
    }

    // 4) 装饰：22% 密度，确定性哈希，保证每次打开一致
    for (y=0;y<MAP_H;y++) for (x=0;x<MAP_W;x++){
      if (!WALK[grid[y][x]]) continue;
      if (isHubCore(x,y)) continue;                        // 广场保持干净
      if (lmMask && lmMask[y] && lmMask[y][x]) continue;   // 地标脚下不长草叶
      if (h2(x,y,41)>0.22) continue;
      bio=biomeAt(x,y,biomeMap);
      ctx.save(); ctx.translate(x*TILE,y*TILE);
      paintDecor(ctx, bio?bio.key:'plains', h2(x,y,43), h2(x,y,47));
      ctx.restore();
    }

    return cv;
  }

  // 树色按群系给，避免"同一棵树种满八个群系"
  var TREE_COL = {
    plains:  [[0x3f8a4a,0x57a95c,0x7bc472],[0x5c4630,0x7d6242]],
    forest:  [[0x27522f,0x356b3b,0x4a8850],[0x4a3826,0x6b5236]],
    lake:    [[0x3a7f6a,0x4f9a80,0x6fba9c],[0x53442f,0x736046]],
    volcano: [[0x4a2420,0x63332a,0x7d4436],[0x3a2a22,0x54402f]],
    snow:    [[0x6f8f8a,0x8fada6,0xbcd2cb],[0x5a5048,0x7a6d60]],
    desert:  [[0x7d7a48,0x9a9459,0xb5ad72],[0x6b5a3a,0x8a7550]],
    ruins:   [[0x3e4a44,0x516058,0x687a6e],[0x4a4440,0x655c55]],
    ridge:   [[0x3a5444,0x4a6b55,0x5f8468],[0x4a4238,0x655a4c]]
  };
  function drawTree(scene, bioKey, v){
    var c = TREE_COL[bioKey] || TREE_COL.plains, leaf=c[0], trunk=c[1];
    var g=scene.add.graphics(), cx=32+(v?2:-2), base=76;
    g.fillStyle(0x0a1020,0.22); g.fillEllipse(cx, base-2, 32+v*6, 10);
    // 树干：下宽上窄，露出 20px 才有树感
    g.fillStyle(trunk[1],1);
    g.fillPoints([{x:cx-4.2,y:base-2},{x:cx+4.2,y:base-2},{x:cx+2.6,y:base-32},{x:cx-2.6,y:base-32}], true);
    g.fillStyle(trunk[0],1); g.fillRect(cx-4.2, base-8, 8.4, 6);

    if (v){
      // 变体 B：针叶三层三角（雪原 / 山道 / 火山用得上），往上一层层收窄
      g.fillStyle(leaf[0],1);
      g.fillPoints([{x:cx,y:base-74},{x:cx-21,y:base-40},{x:cx+21,y:base-40}], true);
      g.fillPoints([{x:cx,y:base-58},{x:cx-25,y:base-22},{x:cx+25,y:base-22}], true);
      g.fillStyle(leaf[1],1);
      g.fillPoints([{x:cx,y:base-74},{x:cx-13,y:base-46},{x:cx+3,y:base-48}], true);
      g.fillPoints([{x:cx,y:base-56},{x:cx-15,y:base-28},{x:cx+3,y:base-30}], true);
      g.fillStyle(leaf[2],1);
      g.fillPoints([{x:cx-1,y:base-72},{x:cx-7,y:base-58},{x:cx+2,y:base-58}], true);
    } else {
      // 变体 A：阔叶圆冠。基底椭圆 + 一圈凸起打破光滑轮廓，读起来才像"叶簇"而不是软糖
      var cy = base-46, bump = [[-0.86,0.30,0.32],[-0.34,-0.90,0.36],[0.44,-0.86,0.31],[0.90,0.10,0.29],[0.46,0.80,0.27],[-0.52,0.78,0.25]];
      var i, b;
      g.fillStyle(leaf[0],1);
      g.fillEllipse(cx, cy, 40, 44);
      for (i=0;i<bump.length;i++){
        b=bump[i];
        g.fillEllipse(cx+b[0]*20, cy+b[1]*22, 40*b[2], 37*b[2]);
      }
      // 中层：整体向内收，左轻上偏，形成左上受光
      g.fillStyle(leaf[1],1);
      g.fillEllipse(cx-2, cy-4, 31, 33);
      g.fillEllipse(cx-13, cy+7, 15, 14);
      g.fillEllipse(cx+12, cy+6, 14, 13);
      // 亮层
      g.fillStyle(leaf[2],1);
      g.fillEllipse(cx-7, cy-10, 19, 17);
      g.fillEllipse(cx-15, cy+3, 9, 8);
      // 冠底自阴影
      g.fillStyle(leaf[0],0.85);
      g.fillEllipse(cx, cy+16, 28, 9);
    }
    g.generateTexture('tree_'+bioKey+'_'+v, 64, 80);
    g.destroy();
  }

  /* ---- 人物绘制（玩家与 NPC 共用一套画法，只换配色）----
     4 帧：0 站立 / 1 迈左腿 / 2 站立 / 3 迈右腿
     统一：脚底椭圆投影 0.16 黑、肩线比身体亮一档、腰带压暗一档 */
  function paintPerson(g, o){
    var side=o.side, back=o.back, sw=o.sw, rise=(sw!==0)?-0.9:0;
    var SKIN=o.skin, SKIN_DN=rgbInt(shade(hexOf(o.skin),0.86));

    // 落地投影（全员统一，是画面统一感的关键）
    g.fillStyle(0x0a1020,0.18); g.fillEllipse(16,28.7,15,4.4);

    // 腿：前后腿分开画，后腿压暗一档，走路时抬起 1.4px 让 4 帧看得出差别
    var lOffX=0, rOffX=0, lOffY=0, rOffY=0;
    if (side){
      lOffX = sw>0? 2.2 : sw<0? -2.2 : 1.1;
      rOffX = -lOffX;
      lOffY = sw!==0? -1.0 : 0;
    } else {
      lOffY = sw>0? -1.4 : 0;
      rOffY = sw<0? -1.4 : 0;
      lOffX = sw>0? -0.6 : 0;
      rOffX = sw<0?  0.6 : 0;
    }
    g.fillStyle(rgbInt(shade(hexOf(o.pants),0.80)),1);
    g.fillRoundedRect(17.0+rOffX, 21.4+rOffY+rise, 3.8, 5.4, 1.4);
    g.fillStyle(o.pants,1);
    g.fillRoundedRect(11.2+lOffX, 21.4+lOffY+rise, 3.8, 5.4, 1.4);
    g.fillStyle(o.shoe,1);
    g.fillRoundedRect(16.7+rOffX, 26.0+rOffY+rise, 4.4, 2.2, 1.0);
    g.fillRoundedRect(10.9+lOffX, 26.0+lOffY+rise, 4.4, 2.2, 1.0);

    // 身体（深衣 + 亮肩 + 腰带三档拉开明度）
    g.fillStyle(o.cloth,1);
    g.fillRoundedRect(10.2, 12.6+rise, 11.6, 9.6, 3.4);
    if (!back){ g.fillStyle(o.clothL,1); g.fillRoundedRect(10.2, 12.6+rise, 11.6, 3.8, 3.4); }
    g.fillStyle(o.clothD,1); g.fillRect(10.2, 20.2+rise, 11.6, 2.0);

    // 手臂与腿反相摆动
    var armL = sw>0? 1.4 : sw<0? -1.4 : 0;
    g.fillStyle(o.clothD,1);
    if (side){
      g.fillRoundedRect(sw>0? 18.6 : 10.4, 13.8+rise, 3.4, 6.4, 1.6);
    } else {
      g.fillRoundedRect(7.9, 13.8+rise+Math.max(0,-armL), 3.2, 6.6, 1.6);
      g.fillRoundedRect(20.9, 13.8+rise+Math.max(0,armL), 3.2, 6.6, 1.6);
    }
    g.fillStyle(SKIN,1);
    if (side) g.fillCircle(sw>0? 20.3 : 12.1, 20.8+rise, 1.9);
    else {
      g.fillCircle(9.5, 21.0+rise+Math.max(0,-armL), 1.9);
      g.fillCircle(22.5, 21.0+rise+Math.max(0,armL), 1.9);
    }

    // 头：先画头发整圆，再叠一张偏下的脸，天然形成刘海
    var hy = 7.6+rise;
    if (back){
      g.fillStyle(o.hair,1);   g.fillCircle(16, hy, 6.9);
      g.fillStyle(o.hairL,1);  g.fillEllipse(16, hy-2.2, 11.6, 8.4);
      g.fillStyle(SKIN_DN,1);  g.fillCircle(16, hy+6.0, 3.6);          // 后颈
    } else {
      g.fillStyle(o.hair,1);   g.fillCircle(16, hy, 6.9);
      g.fillStyle(SKIN,1);     g.fillEllipse(16, hy+1.9, 11.8, 10.8);  // 脸
      g.fillStyle(o.hairL,1);  g.fillEllipse(16, hy-2.9, 12.6, 7.6);   // 刘海亮面
      g.fillStyle(0x1b2030,1);
      if (side){
        g.fillCircle(o.dir==='left'? 13.0 : 19.0, hy+2.2, 1.4);
        g.fillStyle(SKIN_DN,1);
        g.fillCircle(o.dir==='left'? 10.9 : 21.1, hy+3.1, 1.2);        // 鼻
      } else {
        g.fillCircle(13.4, hy+2.2, 1.4); g.fillCircle(18.6, hy+2.2, 1.4);
        g.fillStyle(o.hair,1);
        g.fillRect(11.8, hy-0.8, 3.0, 1.0); g.fillRect(17.2, hy-0.8, 3.0, 1.0);
      }
    }
  }
  function hexOf(n){ return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255]; }
  function rgbInt(c){
    var r=Math.max(0,Math.min(255,Math.round(c[0]*255)));
    var g=Math.max(0,Math.min(255,Math.round(c[1]*255)));
    var b=Math.max(0,Math.min(255,Math.round(c[2]*255)));
    return (r<<16)|(g<<8)|b;
  }

  function drawHero(scene, dir, frame){
    var g=scene.add.graphics();
    paintPerson(g, {
      dir:dir, side:(dir==='left'||dir==='right'), back:(dir==='up'),
      sw:(frame===1)?1:(frame===3)?-1:0,
      skin:0xffd6ad, hair:0x4a3018, hairL:0x6b4a2b,
      cloth:0x3d76b4, clothL:0x5590cc, clothD:0x244a72,
      pants:0x2b3142, shoe:0x1b2030
    });
    g.generateTexture('hero_'+dir+'_'+frame,32,32); g.destroy();
  }
  /* =====================================================================
     剧情 NPC 辨识配件（batch 9）

     13 个人物共用同一套五官、同一个发型，只靠衣服色区分。
     对「认识新角色」这个叙事目标来说不够 —— 玩家第二次见到长老，
     应该一眼认出来，而不是靠读名字。

     办法是在 paintPerson 之后叠一层配件。**不改 paintPerson 本身**：
     主角和馆主都用它，动一下会牵动全部走路帧。
     ===================================================================== */
  function paintNpcAcc(g, def){
    var hair  = hex(def.hair);
    var hairL = rgbInt(shade(hexOf(hex(def.hair)), 1.30));

    if (def.acc === 'beard'){
      // 白胡子压住下巴 + 一根木杖：一眼读成「年长者」。
      // 胡子高度必须控制住 —— 画到 6.6 高时从 y=10 就开始盖，
      // 把眼睛一并糊掉，整张脸变成一片白。现在只盖下巴往下。
      g.fillStyle(0xEDE7DA,1); g.fillEllipse(16, 16.2, 8.2, 4.8);
      g.fillStyle(0xD3CBB8,1); g.fillRect(12.4, 16.0, 7.2, 1.4);
      g.fillStyle(0x7A5A32,1); g.fillRoundedRect(23.4, 12.8, 2.0, 13.2, 0.9);
      g.fillStyle(0xC8A860,1); g.fillCircle(24.4, 12.3, 2.2);
    } else if (def.acc === 'hood'){
      // 兜帽：整头罩深紫，中间挖出脸。
      // 用纯黑会跟深色衣服糊成一块，人也读不出来，所以留一档明度差。
      g.fillStyle(0x2A2440,1); g.fillCircle(16, 6.4, 7.8);
      g.fillStyle(0x2A2440,1); g.fillRoundedRect(8.8, 4.4, 14.4, 8.8, 3.8);
      g.fillStyle(0xFFD6AD,1); g.fillEllipse(16, 10.0, 9.2, 7.0);
      g.fillStyle(0x1b2030,1); g.fillCircle(13.3, 9.6, 1.2); g.fillCircle(18.7, 9.6, 1.2);
    } else if (def.acc === 'twintail'){
      // 双马尾
      g.fillStyle(hair,1);  g.fillCircle(8.9, 10.2, 2.7); g.fillCircle(23.1, 10.2, 2.7);
      g.fillStyle(hairL,1); g.fillCircle(8.5, 9.5, 1.4);  g.fillCircle(22.7, 9.5, 1.4);
    } else if (def.acc === 'hat'){
      // 宽檐旅行帽
      g.fillStyle(0xA8814E,1); g.fillEllipse(16, 5.8, 18.8, 4.8);
      g.fillStyle(0xD2AA6A,1); g.fillEllipse(16, 3.8, 9.8, 5.6);
      g.fillStyle(0x7A5A32,1); g.fillRect(11.2, 5.0, 9.6, 1.4);
    } else if (def.acc === 'crown'){
      // 头冠 + 肩甲金边：冠军要有「高处」的形。
      // 冠军本身是白发，用亮金会和头发糊在一起，冠体压到深金才分得开。
      g.fillStyle(0xE8A400,1);
      g.fillPoints([{x:10.3,y:3.4},{x:12.9,y:0.2},{x:15.4,y:3.0},{x:18.4,y:0.1},
                    {x:21.7,y:3.4},{x:21.7,y:5.6},{x:10.3,y:5.6}], true);
      g.fillStyle(0xA87000,1); g.fillRect(10.3, 4.9, 11.4, 1.3);
      g.fillStyle(0xFFD34D,1); g.fillCircle(15.4, 2.6, 1.1); g.fillCircle(18.4, 2.4, 1.05);
      g.fillStyle(0xFFD34D,1); g.fillRoundedRect(9.2, 12.1, 13.6, 2.2, 1.0);
    }
  }

  function drawNPC(scene, def){
    var g=scene.add.graphics(), cl=hexOf(hex(def.cloth)), cd=hexOf(hex(def.cloth2));
    paintPerson(g, {
      dir:'down', side:false, back:false, sw:0,
      skin:0xffd6ad, hair:hex(def.hair), hairL:rgbInt(shade(hexOf(hex(def.hair)),1.35)),
      cloth:hex(def.cloth), clothL:rgbInt(shade(cl,1.28)), clothD:rgbInt(shade(cd,0.82)),

  var BADGE_TEX = 72;
  function badgeGlyph(g, kind, cx, cy, cFill, cHole){
    // cFill = 符号色；cHole = 月牙挖洞用的底色（其余符号不受影响）
    var F = rgbInt(cFill), H = rgbInt(cHole);
    g.fillStyle(F, 1);
    if (kind==='leaf'){
      // 幼苗：一根茎 + 左右两片外张的尖叶。
      // 早前版本两片叶从中轴向外张开，但收尾点太靠里，整体读成一颗菱形宝石。
      g.fillRect(cx-1.6, cy-4, 3.2, 17);
      g.fillPoints([{x:cx,y:cy-4},{x:cx-12,y:cy-12},{x:cx-10,y:cy+1},{x:cx-1,y:cy+3}], true);
      g.fillPoints([{x:cx,y:cy-4},{x:cx+12,y:cy-12},{x:cx+10,y:cy+1},{x:cx+1,y:cy+3}], true);
    } else if (kind==='moss'){
      g.fillCircle(cx-8, cy+5, 5.5); g.fillCircle(cx+8, cy+6, 5);
      g.fillCircle(cx, cy-6, 6.5);
    } else if (kind==='sand'){
      g.fillPoints([{x:cx,y:cy-12},{x:cx+10,y:cy},{x:cx,y:cy+12},{x:cx-10,y:cy}], true);
      g.fillCircle(cx-11, cy-7, 2.2); g.fillCircle(cx+11, cy-6, 1.8);
      g.fillCircle(cx+9, cy+9, 2.0);
    } else if (kind==='moon'){
      g.fillCircle(cx+1, cy, 11);
      // 挖月牙：用底色圆盖掉一半（Graphics 没有布尔运算，叠盖最省）
      g.fillStyle(H, 1); g.fillCircle(cx-6, cy-3, 9.2);
    } else if (kind==='drop'){
      g.fillCircle(cx, cy+4, 9);
      g.fillPoints([{x:cx,y:cy-13},{x:cx+7,y:cy+1},{x:cx-7,y:cy+1}], true);
    } else if (kind==='wing'){
      // 展翅：左右对称三角翼 + 中间身体。单侧三角会读成箭头/闪电，必须成对。
      g.fillPoints([{x:cx-2,y:cy-2},{x:cx-14,y:cy-11},{x:cx-12,y:cy+3},{x:cx-3,y:cy+7}], true);
      g.fillPoints([{x:cx+2,y:cy-2},{x:cx+14,y:cy-11},{x:cx+12,y:cy+3},{x:cx+3,y:cy+7}], true);
      g.fillPoints([{x:cx,y:cy-7},{x:cx+3.6,y:cy+1},{x:cx,y:cy+9},{x:cx-3.6,y:cy+1}], true);
    } else if (kind==='flame'){
      g.fillCircle(cx, cy+5, 8.5);
      g.fillPoints([{x:cx,y:cy-14},{x:cx+7,y:cy+2},{x:cx-7,y:cy+2}], true);
      g.fillPoints([{x:cx+1,y:cy-8},{x:cx+9,y:cy+1},{x:cx+1,y:cy+4}], true);
    } else if (kind==='crystal'){
      g.fillPoints([{x:cx,y:cy-13},{x:cx+10,y:cy-6},{x:cx+10,y:cy+6},
                    {x:cx,y:cy+13},{x:cx-10,y:cy+6},{x:cx-10,y:cy-6}], true);
      // 左半压暗、右半留亮：切出两个面，读成宝石。
      // 试过压上/下半，结果只剩两个尖角，看起来像字母 V，反而更差。
      g.fillStyle(H, 1);
      g.fillPoints([{x:cx,y:cy-13},{x:cx-10,y:cy-6},{x:cx-10,y:cy+6},{x:cx,y:cy+13}], true);
    }

  /* 地标放置：候选位置按「离群系中心的距离 → 需要推平的格数」排序，
     每放一座都会重算一次可达性，只有「切断地图」的候选才被拒绝。
     这样开阔草原（本来没有障碍物）也能立起风车，而不会把玩家封死在某一块里。
     三条硬约束：不压商道（PATH）、不压枢纽中心与出生点、不与已有地标重叠。 */
  function placeLandmarks(grid){
    var out = [], used = {};

    function cellsOf(x, y, w, h){
      var a = [], i, j;
      for (j=y; j<y+h; j++) for (i=x; i<x+w; i++) a.push([i, j]);
      return a;
    }
    // 能不能放：返回 { bad:原因 } 或 { ok:1, pave:需要推平的格数 }
    function probe(x, y, w, h, opts){
      var cells = cellsOf(x, y, w, h), pave = 0, water = 0, i, c, k;
      for (i=0;i<cells.length;i++){
        c = cells[i];
        if (c[0] < 1 || c[1] < 1 || c[0] > MAP_W-2 || c[1] > MAP_H-2) return { bad:'边界' };
        if (used[kOf(c[0], c[1])]) return { bad:'重叠' };
        if (c[0] === HUB.x && c[1] === HUB.y) return { bad:'枢纽中心' };
        if (opts.noSpawn && c[0] === HUB.x && c[1] === HUB.y+2) return { bad:'出生点' };
        k = grid[c[1]][c[0]];
        if (k === T.PATH){
          if (!opts.allowPath) return { bad:'商道' };    // 群系地标不压路；枢纽广场本身就是商道砖
          pave++;
          continue;
        }
        if (k === T.WATER) water++;
        if (WALK[k]) pave++;
      }
      if (opts.needWater && water === 0) return { bad:'要水面' };
      return { ok:1, pave:pave };
    }
    // 真正落地：把格改成 ROCK（不可通行），并确认可达面积只少了这些格
    function commit(x, y, w, h, rec){
      var before = computeReachable(grid), i;
      var cells = cellsOf(x, y, w, h), orig = [], walkBefore = 0;
      for (i=0;i<cells.length;i++){
        var kk = grid[cells[i][1]][cells[i][0]];
        orig.push(kk);
        if (WALK[kk]) walkBefore++;
      }
      for (i=0;i<cells.length;i++) grid[cells[i][1]][cells[i][0]] = T.ROCK;
      var after = computeReachable(grid);
      if (before.size - after.size !== walkBefore){       // 会切断地图 → 原样回滚
        for (i=0;i<cells.length;i++) grid[cells[i][1]][cells[i][0]] = orig[i];
        return false;
      }
      for (i=0;i<cells.length;i++) used[kOf(cells[i][0], cells[i][1])] = 1;
      out.push(rec);
      return true;
    }

    // 1) 枢纽：灵契中心 + 广场道具（喷泉 / 旗杆）—— 顺序固定，中心先占位
    function tryHub(kind, cands){
      var w = MARK_FP[kind][0], h = MARK_FP[kind][1];
